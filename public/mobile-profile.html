    <style>
        /* ========== 全局布局（与 index 一致） ========== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;

        /* 背景装饰 */
        .bg-decorations {
            position: fixed;

            left: 0;

            height: 100%;

            overflow: hidden;
            pointer-events: none;
        }

        .bg-decorations .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
            background-size: cover;
            opacity: 0.5;
        }

        .bg-decorations .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(30, 136, 229, 0.05);
        }

        .bg-decorations .circle1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        .bg-decorations .circle2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
        }

        .bg-decorations .circle3 {

        /* ========== 侧边栏 ========== */

            left: 0;

    <script>
        window.API_BASE = window.API_BASE || '/api';
        const token = localStorage.getItem('token');
        let currentUid = null;

        // ---------- 侧边栏 ----------
        function fillSidebarUser(me) {
            if (!me) return;
            const nickEl = document.getElementById('sidebarNickname');
            const emailEl = document.getElementById('sidebarEmail');
            if (nickEl) nickEl.textContent = me.nickname;
            if (emailEl) emailEl.textContent = me.email;
        }

        function bindSidebarActions() {
            const userBtn = document.getElementById('sidebarUserBtn');
            if (userBtn) userBtn.addEventListener('click', () => {
                window.location.href = token ? '/mobile-profile.html' : '/login.html';
            });
            const logoutBtn = document.getElementById('sidebarLogoutBtn');
            if (logoutBtn) logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            });
            const searchBtn = document.getElementById('searchBtn');
            const searchInput = document.getElementById('searchInput');
            if (searchBtn && searchInput) {
                searchBtn.addEventListener('click', () => {
                    const keyword = searchInput.value.trim();
                    window.location.href = keyword ? `/search.html?q=${encodeURIComponent(keyword)}` : '/search.html';
                });
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const keyword = searchInput.value.trim();
                        window.location.href = keyword ? `/search.html?q=${encodeURIComponent(keyword)}` : '/search.html';
                    }
                });
            }
        }

        // ---------- 签到 ----------
        function renderCheckinBtn(checkedIn) {
            const btn = document.getElementById('mpCheckinBtn');
            if (checkedIn) {
                btn.classList.add('checked');
                btn.textContent = '✅ 今日已签到';
            } else {
                btn.classList.remove('checked');
                btn.textContent = '📋 签到 +5';
            }
        }

        async function doCheckin() {
            if (!token) { window.location.href = '/login.html'; return; }
            const btn = document.getElementById('mpCheckinBtn');
            if (btn.classList.contains('checked')) return;
            try {
                const res = await fetch(`${window.API_BASE}/daily-checkin`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    renderCheckinBtn(true);
                    loadCoins();
                    alert('✅ 签到成功！' + (data.coins ? '获得 ' + data.coins + ' 鹏城币' : ''));
                } else {
                    alert(data.error || '签到失败');
                    renderCheckinBtn(true);
                }
            } catch (e) {
                alert('网络错误，请稍后重试');
            }
        }

        async function loadCoins() {
            if (!token) return;
            try {
                const res = await fetch(`${window.API_BASE}/user/coins`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('mpCoins').textContent = `🪙 ${data.coins} 鹏城币`;
                    renderCheckinBtn(data.checked_in_today);
                }
            } catch (e) { console.warn(e); }
        }

        // ---------- 活跃度日历（简化版） ----------
        async function loadActivity(uid) {
            const container = document.getElementById('mpCalendar');
            try {
                const res = await fetch(`${window.API_BASE}/users/${uid}/activity`);
                const data = await res.json();
                if (data.hidden || !data.activity) {
                    container.innerHTML = '<span class="mp-badge-empty">已隐藏活跃度</span>';
                    return;
                }
                const recent = data.activity.slice(-30);
                const colors = ['#E5E7EB', '#BFDBFE', '#93C5FD', '#60A5FA', '#1E88E5'];
                let html = '<div class="mp-calendar">';
                recent.forEach(d => {
                    html += `<div class="mp-cal-day" style="background:${colors[d.level] || '#E5E7EB'}" title="${d.date}：${d.count} 次活动"></div>`;
                });
                html += '</div>';
                html += `<div class="mp-cal-legend"><span style="background:#E5E7EB;width:11px;height:11px;border-radius:2px;display:inline-block;"></span> 少 <span style="background:#1E88E5;width:11px;height:11px;border-radius:2px;display:inline-block;"></span> 多（近30天）</div>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<span class="mp-badge-empty">活跃度加载失败</span>';
            }
        }

        // ---------- 成就徽章 ----------
        async function loadBadges(uid) {
            const container = document.getElementById('mpBadges');
            try {
                const res = await fetch(`${window.API_BASE}/users/${uid}`);
                const data = await res.json();
                if (res.ok && data.achievements && data.achievements.length) {
                    container.innerHTML = data.achievements.map(a =>
                        `<span class="mp-badge" title="${a.name}：${a.description}">${a.icon}</span>`
                    ).join('');
                } else {
                    container.innerHTML = '<span class="mp-badge-empty">还没有获得徽章，继续加油吧~</span>';
                }
            } catch (e) {
                container.innerHTML = '<span class="mp-badge-empty">徽章加载失败</span>';
            }
        }

        // ---------- 初始化 ----------
        (async function init() {
            bindSidebarActions();

            const profileCard = document.getElementById('mpProfileCard');
            profileCard.addEventListener('click', () => {
                window.location.href = token ? '/profile.html' : '/login.html';
            });
            document.getElementById('mpCheckinBtn').addEventListener('click', doCheckin);

            if (!token) {
                document.getElementById('mpAvatar').src = '';
                document.getElementById('mpNickname').textContent = '未登录';
                document.getElementById('mpLevel').textContent = '点击登录';
                document.getElementById('mpCoins').textContent = '🪙 -- 鹏城币';
                document.getElementById('mpCheckinBtn').textContent = '📋 登录后签到';
                return;
            }

            try {
                const meRes = await fetch(`${window.API_BASE}/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                const me = await meRes.json();
                if (!meRes.ok) throw new Error('登录失效');

                currentUid = me.id;
                document.getElementById('mpAvatar').src = me.avatar_url || '';
                document.getElementById('mpNickname').textContent = me.nickname;
                const level = calculateLevel(me.exp, me.has_passed_quiz);
                document.getElementById('mpLevel').textContent = `LV${level.level} ${level.name}`;
                document.getElementById('mpCoins').textContent = `🪙 ${me.coins || 0} 鹏城币`;

                fillSidebarUser(me);
                loadCoins();
                loadBadges(currentUid);
                loadActivity(currentUid);
            } catch (e) {
                document.getElementById('mpNickname').textContent = '登录已失效';
                document.getElementById('mpLevel').textContent = '点击重新登录';
            }
        })();
    </script>

    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeHarmonyBanner = function() {
                document.getElementById('harmonyBanner').style.display = 'none';
                localStorage.setItem('harmonyBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isHarmonyOS) {
                // 鸿蒙：每天首次弹窗引导添加到桌面
                const lastClosed = localStorage.getItem('harmonyBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('harmonyBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // 已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    // 根据浏览器环境设置不同文案
                    const ua = navigator.userAgent;
                    const isWeChat = /MicroMessenger/i.test(ua);
                    const isQQ = /QQ\//i.test(ua);
                    const isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua) && !isWeChat && !isQQ;

                    const textEl = document.getElementById('iosBannerText');
                    let bannerText = '';

                    if (isWeChat || isQQ) {
                        bannerText = '请点击右上角“...” → 选择“在浏览器中打开” → 在 Safari 中点击底部分享按钮 → “添加到主屏幕”';
                    } else if (isSafari) {
                        bannerText = '点击 Safari 底部的分享按钮（方框+向上箭头）→ 选择“添加到主屏幕”';
                    } else {
                        bannerText = '请在系统浏览器中打开此页面，然后通过浏览器菜单“添加到主屏幕”';
                    }

                    if (textEl) textEl.textContent = bannerText;

                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
</body>
