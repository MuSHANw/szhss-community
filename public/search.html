<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>搜索 - 深圳高中生社区</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- 移动端适配 -->
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/js/mobile.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 全局样式（与 index 一致） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
            background-color: #F5F7FA;
            color: #1f2d3d;
            line-height: 1.5;
            padding-top: 60px;
            margin-left: 260px;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
            position: relative;
        }

        body.sidebar-collapsed {
            margin-left: 70px;
        }

        /* 背景装饰 */
        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-decorations .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
            background-size: cover;
            opacity: 0.5;
        }

        .bg-decorations .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(30, 136, 229, 0.05);
        }

        .bg-decorations .circle1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        .bg-decorations .circle2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
        }

        .bg-decorations .circle3 {
            width: 150px;
            height: 150px;
            top: 30%;
            right: 10%;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ========== 顶部栏 ========== */
        .top-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 20px;
            color: #4a5568;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E88E5;
            text-decoration: none;
            margin-right: auto;
        }

        .search-area {
            display: flex;
            align-items: center;
            background: #f1f3f5;
            border-radius: 24px;
            padding: 4px 12px;
            width: 260px;
        }

        .search-area input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            padding: 8px 0;
        }

        .search-area button {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #6c757d;
        }

        /* 关于链接 */
        .about-link {
            margin-left: 16px;
            color: #4a5568;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .about-link:hover {
            color: #1E88E5;
        }

        .about-link i {
            margin-right: 4px;
        }

        .notifications-icon {
            position: relative;
            margin-left: 16px;
            font-size: 1.4rem;
            color: #6c757d;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .notif-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e53e3e;
            color: white;
            font-size: 0.7rem;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== 侧边栏 ========== */
        #sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 260px;
            background: white;
            border-right: 1px solid #eef2f6;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            z-index: 99;
            overflow-x: hidden;
        }

        #sidebar.collapsed {
            width: 70px;
        }

        #sidebar.collapsed .sidebar-user-info,
        #sidebar.collapsed .sidebar-link span {
            display: none;
        }

        #sidebar.collapsed .sidebar-logout {
            font-size: 0;
            padding: 8px;
        }

        #sidebar.collapsed .sidebar-logout::before {
            content: "🚪";
            font-size: 1.2rem;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            padding: 20px 16px;
            border-bottom: 1px solid #eef2f6;
            cursor: pointer;
        }

        .sidebar-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .sidebar-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-avatar i {
            font-size: 48px;
            color: #1E88E5;
        }

        .sidebar-user-info {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar-nickname {
            font-weight: 600;
            font-size: 1rem;
        }

        .sidebar-email {
            font-size: 0.7rem;
            color: #6c757d;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 0;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            color: #4a5568;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .sidebar-link i {
            width: 28px;
            font-size: 1.2rem;
            text-align: center;
        }

        .sidebar-link span {
            margin-left: 12px;
        }

        .sidebar-link:hover {
            background: #f0f2f5;
        }

        .sidebar-link.active {
            background: #e9f0fe;
            color: #1E88E5;
        }

        .notif-dot {
            color: #e53e3e;
            font-size: 0.7rem;
            margin-left: 4px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #eef2f6;
        }

        .sidebar-logout {
            width: 100%;
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: #e53e3e;
            border-radius: 8px;
            text-align: center;
        }

        .sidebar-logout:hover {
            background: #ffe5e5;
        }

        /* ========== 搜索页面特有样式 ========== */
        .search-header {
            margin-bottom: 20px;
        }

        .search-box-large {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .search-box-large input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            font-size: 1rem;
            background: white;
        }

        .search-box-large input:focus {
            outline: none;
            border-color: #1E88E5;
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.1);
        }

        .search-box-large button {
            background: #1E88E5;
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .search-box-large button:hover {
            background: #0b5e8a;
        }

        .results-count {
            margin: 24px 0 16px;
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* 帖子条目（与首页一致） */
        .post-item { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px; cursor: pointer; transition: background 0.15s; background: white; }
        .post-item:hover { background: #F9FAFB; }
        .post-item-avatar-area { flex-shrink: 0; width: 32px; height: 32px; }
        .post-item-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .post-item-avatar-icon { font-size: 32px; color: #1E88E5; }
        .post-item-content { flex: 1; min-width: 0; }
        .post-item-title { font-size: 1rem; font-weight: 600; color: #1F2937; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
        .post-item-excerpt { font-size: 0.875rem; color: #6B7280; line-height: 1.5; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post-item-meta { font-size: 0.75rem; color: #9CA3AF; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .post-item-dot { color: #D1D5DB; }
        .post-item-author { font-weight: 500; color: #6B7280; }
        .post-item-category { color: #1E88E5; }
        .post-item-stats { margin-left: auto; display: flex; gap: 14px; align-items: center; }
        .post-stat { cursor: default; display: inline-flex; align-items: center; gap: 2px; }
        .post-divider { height: 1px; background: #F3F4F6; margin: 0 20px; }
        .post-divider:last-child { display: none; }

        /* 搜索标签栏 */
        .search-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #F3F4F6;
            flex-wrap: wrap;
        }
        .search-tab {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #6B7280;
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .search-tab:hover { color: #1F2937; }
        .search-tab.active {
            color: #1E88E5;
            border-bottom-color: #1E88E5;
        }
        .search-tab span { color: #9CA3AF; font-weight: 400; }
        .search-tab.active span { color: #1E88E5; }

        /* 用户搜索结果 */
        .user-search-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            cursor: pointer;
            transition: background 0.15s;
            background: white;
        }
        .user-search-item:hover { background: #F9FAFB; }
        .user-search-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
        .user-search-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-search-info { flex: 1; min-width: 0; }
        .user-search-name { font-weight: 600; font-size: 0.95rem; color: #1F2937; }
        .user-search-meta { font-size: 0.8rem; color: #9CA3AF; margin-top: 2px; }

        /* 圈子搜索结果 */
        .circle-search-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            cursor: pointer;
            transition: background 0.15s;
            background: white;
        }
        .circle-search-item:hover { background: #F9FAFB; }
        .circle-search-icon {
            width: 44px; height: 44px; border-radius: 12px;
            overflow: hidden; flex-shrink: 0;
            background: #EFF6FF;
            display: flex; align-items: center; justify-content: center;
        }
        .circle-search-icon img { width: 100%; height: 100%; object-fit: cover; }
        .circle-search-info { flex: 1; min-width: 0; }
        .circle-search-name { font-weight: 600; font-size: 0.95rem; color: #1F2937; }
        .circle-search-meta {
            font-size: 0.8rem; color: #9CA3AF; margin-top: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* 关键词高亮 */
        mark { background: #FFF3CD; padding: 2px 4px; border-radius: 3px; color: #1F2937; }

        .user-search-item + .user-search-item,
        .circle-search-item + .circle-search-item { border-top: 1px solid #F3F4F6; }
        .post-item-tags { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
        .post-tag { background: #F3F4F6; color: #6B7280; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; cursor: pointer; transition: background 0.15s; }
        .post-tag:hover { background: #E5E7EB; }

        .post-card {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .post-category {
            background: #e9f0fe;
            color: #1E88E5;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .post-time {
            color: #8a9aa8;
        }

        .post-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .post-title a {
            text-decoration: none;
            color: #1f2d3d;
            font-weight: 600;
        }

        .post-title a:hover {
            color: #1E88E5;
        }

        .post-content {
            color: #4a5568;
            margin-bottom: 16px;
            line-height: 1.5;
            word-break: break-word;
        }

        .post-footer {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.8rem;
            color: #6c757d;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-author img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-author i {
            font-size: 22px;
            color: #1E88E5;
        }

        .post-footer i {
            margin-right: 4px;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .tag {
            background: #f0f2f5;
            color: #1f2d3d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tag:hover {
            background: #e2e6ea;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 32px 0;
        }

        .pagination button {
            background: #f0f2f5;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .pagination button:hover {
            background: #e2e6ea;
        }

        .pagination button.active {
            background: #1E88E5;
            color: white;
        }

        .no-results,
        .loading,
        .error {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            color: #6c757d;
            border: 1px solid #eef2f6;
        }

        .footer {
            background: white;
            border-top: 1px solid #e9ecef;
            padding: 20px 0;
            text-align: center;
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            body {
                margin-left: 0;
            }

            #sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: 260px !important;
            }

            #sidebar.open-mobile {
                transform: translateX(0);
            }

            .search-area {
                width: 180px;
            }

            .search-box-large {
                flex-direction: column;
                gap: 10px;
            }

            .search-box-large button {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .search-area {
                width: 150px;
            }
        }
    </style>
</head>

<body id="appBody">
    <!-- 背景装饰 -->
    <div class="bg-decorations">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <div class="wave"></div>
    </div>

    <!-- 顶部栏 -->
    <div class="top-bar-container">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <a href="/" class="logo">深圳高中生社区</a>
            <div class="search-area">

            <a href="/about.html" class="about-link" id="aboutLink">
                <i class="fas fa-info-circle"></i> 关于
            </a>
            <a href="/notifications.html" class="notifications-icon" id="notifLink">

                <span class="notif-badge" id="notifBadge" style="display:none;">0</span>

            <div class="sidebar-user-info">
                <div class="sidebar-nickname" id="sidebarNickname">未登录</div>

            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-link" title="首页"><i class="fas fa-home"></i><span>首页</span></a>

                <i class="fas fa-clock"></i><span>自习室</span>

            <a href="feed.html" class="sidebar-link" title="动态"><i class="fas fa-bolt"></i><span>动态</span></a>

            <a href="gaokao.html" class="sidebar-link" title="升学"><i class="fas fa-chart-line"></i><span>升学</span></a>
            <a href="profile.html" class="sidebar-link" title="个人主页"><i class="fas fa-user"></i><span>个人主页</span></a>

            <a href="admin.html" class="sidebar-link" title="管理后台"><i

            <a href="/notifications.html" class="sidebar-link" id="sidebarNotifLink" title="通知">

        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-logout" id="sidebarLogoutBtn">退出登录</button>
        </div>
    </div>

    <main class="container">
        <!-- 大搜索框 -->
        <div class="search-header">
            <div class="search-box-large">
                <input type="text" id="searchKeyword" placeholder="搜索标题、内容、分类或标签..." autocomplete="off">
                <button id="doSearchBtn"><i class="fas fa-search"></i> 搜索</button>
            </div>
        </div>

        <!-- 搜索维度标签 -->
        <div class="search-tabs" id="searchTabs" style="display:none;">
            <button class="search-tab active" data-type="posts">📝 帖子 (<span id="postsCount">0</span>)</button>
            <button class="search-tab" data-type="users">👤 用户 (<span id="usersCount">0</span>)</button>

        <!-- 搜索结果区域 -->
        <div id="resultsArea">
            <div class="loading">加载中...</div>
        </div>

        <!-- 分页 -->
        <div id="pagination" class="pagination"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 深圳高中生社区 | <a href="/rules.html" style="color:#6c757d;">社区公约</a> | <a href="/help.html" style="color:#6c757d;">帮助中心</a> | <a href="/changelog.html" style="color:#6c757d;">更新日志</a> | 粤ICP备xxxxxxxx号</p>
        </div>
    </footer>

    <script>
        window.API_BASE = window.API_BASE || '/api';

        // ---------- 侧边栏展开/收起 ----------
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('menuToggle');
        const body = document.getElementById('appBody');
        const isExpanded = localStorage.getItem('sidebarExpanded') !== 'false';
        if (!isExpanded) {
            sidebar.classList.add('collapsed');
            body.classList.add('sidebar-collapsed');
        } else {
            sidebar.classList.remove('collapsed');
            body.classList.remove('sidebar-collapsed');
        }
        toggleBtn.addEventListener('click', () => {
            const currentlyExpanded = !sidebar.classList.contains('collapsed');
            if (currentlyExpanded) {
                sidebar.classList.add('collapsed');
                body.classList.add('sidebar-collapsed');
                localStorage.setItem('sidebarExpanded', 'false');
            } else {
                sidebar.classList.remove('collapsed');
                body.classList.remove('sidebar-collapsed');
                localStorage.setItem('sidebarExpanded', 'true');
            }
        });

        // ---------- 用户信息 ----------
        const token = localStorage.getItem('token');
        const avatarDiv = document.getElementById('sidebarAvatar');
        const nicknameSpan = document.getElementById('sidebarNickname');
        const emailSpan = document.getElementById('sidebarEmail');
        async function updateSidebarUser() {
            if (!token) {
                nicknameSpan.innerText = '未登录';
                emailSpan.innerText = '';
                avatarDiv.innerHTML = '<i class="fas fa-user-circle"></i>';
                return;
            }
            try {
                const res = await fetch(`${window.API_BASE}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const user = await res.json();
                    nicknameSpan.innerText = user.nickname || '用户';
                    emailSpan.innerText = user.email || '';
                    if (user.avatar_url) {
                        avatarDiv.innerHTML = `<img src="${user.avatar_url}" alt="头像">`;
                    } else {
                        avatarDiv.innerHTML = '<i class="fas fa-user-circle"></i>';
                    }
                }
            } catch (e) { console.warn(e); }
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', () => {
            window.location.href = '/profile.html';
        });

        // ---------- 未读小红点 ----------
        async function updateNotifDot() {
            if (!token) return;
            try {
                const res = await fetch(`${window.API_BASE}/notifications?page=1&limit=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const unreadCount = data.unreadCount || 0;
                const topBadge = document.getElementById('notifBadge');
                const sidebarDot = document.getElementById('sidebarNotifDot');
                if (topBadge) {
                    if (unreadCount > 0) {
                        topBadge.style.display = 'flex';
                        topBadge.innerText = unreadCount > 99 ? '99+' : unreadCount;
                    } else {
                        topBadge.style.display = 'none';
                    }
                }
                if (sidebarDot) {
                    sidebarDot.style.display = unreadCount > 0 ? 'inline-block' : 'none';
                }
            } catch (e) { }
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);

        // ---------- 退出登录 ----------
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        // ---------- 顶部小搜索框 ----------
        const topSearchBtn = document.getElementById('searchBtn');
        const topSearchInput = document.getElementById('searchInput');
        if (topSearchBtn) {
            topSearchBtn.addEventListener('click', () => {
                const keyword = topSearchInput.value.trim();
                if (keyword) window.location.href = `/search.html?q=${encodeURIComponent(keyword)}`;
                else alert('请输入搜索关键词');
            });
            topSearchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') topSearchBtn.click();
            });
        }

        // ---------- 搜索页面功能 ----------
        let currentKeyword = '';
        let currentPage = 1;
        let totalPages = 1;
        let currentType = 'posts';
        let counts = { posts: 0, users: 0, circles: 0 };

        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        let keyword = urlParams.get('q');
        let page = parseInt(urlParams.get('page')) || 1;
        if (keyword) {
            document.getElementById('searchKeyword').value = keyword;
            currentKeyword = keyword;
            currentPage = page;
            performSearch(currentKeyword, currentPage);
        } else {
            document.getElementById('resultsArea').innerHTML = '<div class="no-results">输入关键词开始搜索</div>';
        }

        // 辅助函数
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
        }
        function renderMarkdown(text) {
            if (!text) return '';
            if (typeof marked !== 'undefined' && marked.parse) return marked.parse(text, { async: false });
            return escapeHtml(text);
        }
        function getPlainText(markdown, maxLen) {
            if (!markdown) return '';
            let text = markdown;
            if (typeof marked !== 'undefined' && marked.parse) {
                const html = marked.parse(markdown, { async: false });
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                text = tmp.textContent || tmp.innerText || '';
            }
            if (maxLen && text.length > maxLen) return text.substring(0, maxLen) + '...';
            return text;
        }

        // 关键词高亮
        function highlightKeyword(text, keyword) {
            if (!text || !keyword) return escapeHtml(text || '');
            const escaped = escapeHtml(text);
            const safeKeyword = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${safeKeyword})`, 'gi');
            return escaped.replace(regex, '<mark style="background:#FFF3CD;padding:2px 4px;border-radius:3px;color:#1F2937;">$1</mark>');
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        function getTypeLabel(type) {
            return { posts: '帖子', users: '用户', circles: '圈子' }[type] || '结果';
        }

        // 异步获取其他维度的数量
        async function fetchOtherCounts(q) {
            for (const type of ['posts', 'users', 'circles']) {
                try {
                    const res = await fetch(`${window.API_BASE}/search/all?q=${encodeURIComponent(q)}&type=${type}&page=1&limit=1`);
                    if (res.ok) { const data = await res.json(); counts[type] = data.total; }
                } catch (e) {}
            }
            updateTabCounts();
        }

        function updateTabCounts() {
            document.getElementById('postsCount').textContent = counts.posts || 0;
            document.getElementById('usersCount').textContent = counts.users || 0;
            document.getElementById('circlesCount').textContent = counts.circles || 0;
        }

        // 帖子结果渲染
        function renderPostResults(data, q) {
            const resultsDiv = document.getElementById('resultsArea');
            const totalPages = data.totalPages || 1;
            if (!data.results.length) {
                resultsDiv.innerHTML = `<div class="no-results">没有找到与"${escapeHtml(q)}"相关的帖子</div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            resultsDiv.innerHTML = `
                <div class="results-count">找到 ${data.total} 条结果，第 ${data.page}/${totalPages} 页</div>
                ${data.results.map(post => {
                    const avatarHtml = post.avatar_url
                        ? `<img src="${post.avatar_url}" alt="头像" class="post-item-avatar">`
                        : `<i class="fas fa-user-circle post-item-avatar-icon"></i>`;
                    return `
                        <div class="post-item" data-post-id="${post.id}">
                            <div class="post-item-avatar-area">${avatarHtml}</div>
                            <div class="post-item-content">
                                <div class="post-item-title">${highlightKeyword(post.title, q)}</div>
                                <div class="post-item-excerpt">${highlightKeyword(getPlainText(post.content, 150), q)}</div>
                                <div class="post-item-meta">
                                    <span class="post-item-author">${escapeHtml(post.nickname)}</span>
                                    <span class="post-item-dot">·</span>
                                    <span class="post-item-category">${escapeHtml(post.category || '综合')}</span>
                                    <span class="post-item-dot">·</span>
                                    <span class="post-item-time">${formatDate(post.created_at)}</span>
                                    <span class="post-item-stats">
                                        <span class="post-stat"><i class="far fa-heart"></i> ${post.likes || 0}</span>
                                        <span class="post-stat"><i class="far fa-comment"></i> ${post.reply_count || 0}</span>
                                        <span class="post-stat"><i class="far fa-eye"></i> ${post.view_count || 0}</span>
                                    </span>
                                </div>
                                ${post.tags && post.tags.length ? `<div class="post-item-tags">${post.tags.map(t => `<span class="post-tag" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                            </div>
                        </div>
                        <div class="post-divider"></div>
                    `;
                }).join('')}
            `;
            renderPagination(data.page, totalPages);

            document.querySelectorAll('.post-item').forEach(item => {
                item.addEventListener('click', () => { window.location.href = `/post-detail.html?id=${item.dataset.postId}`; });
            });
            document.querySelectorAll('.post-tag').forEach(tagEl => {
                tagEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tag = tagEl.getAttribute('data-tag');
                    if (tag) window.location.href = `/search.html?q=${encodeURIComponent(tag)}`;
                });
            });
        }

        // 用户结果渲染
        function renderUserResults(data, q) {
            const resultsDiv = document.getElementById('resultsArea');
            if (!data.results.length) {
                resultsDiv.innerHTML = `<div class="no-results">没有找到与"${escapeHtml(q)}"相关的用户</div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            resultsDiv.innerHTML = `
                <div class="results-count">找到 ${data.total} 位用户，第 ${data.page}/${data.totalPages} 页</div>
                ${data.results.map(user => {
                    const avatarHtml = user.avatar_url
                        ? `<img src="${escapeHtml(user.avatar_url)}" alt="头像">`
                        : `<i class="fas fa-user-circle" style="font-size:44px;color:#1E88E5;"></i>`;
                    return `
                        <div class="user-search-item" onclick="location.href='/user-profile.html?uid=${user.id}'">
                            <div class="user-search-avatar">${avatarHtml}</div>
                            <div class="user-search-info">
                                <div class="user-search-name">${highlightKeyword(user.nickname, q)}</div>
                                <div class="user-search-meta">
                                    ${user.school ? highlightKeyword(user.school, q) + ' · ' : ''}${user.district || '未填写区域'}
                                </div>
                            </div>
                            <i class="fas fa-chevron-right" style="color:#D1D5DB;"></i>
                        </div>
                    `;
                }).join('')}
            `;
            renderPagination(data.page, data.totalPages);
        }

        // 圈子结果渲染
        function renderCircleResults(data, q) {
            const resultsDiv = document.getElementById('resultsArea');
            if (!data.results.length) {
                resultsDiv.innerHTML = `<div class="no-results">没有找到与"${escapeHtml(q)}"相关的圈子</div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            resultsDiv.innerHTML = `
                <div class="results-count">找到 ${data.total} 个圈子，第 ${data.page}/${data.totalPages} 页</div>
                ${data.results.map(circle => {
                    return `
                        <div class="circle-search-item" onclick="location.href='/circle-detail.html?id=${circle.id}'">
                            <div class="circle-search-icon">
                                ${circle.icon_url
                                    ? `<img src="${escapeHtml(circle.icon_url)}" alt="圈子图标">`
                                    : `<i class="fas fa-users" style="font-size:24px;color:#1E88E5;"></i>`}
                            </div>
                            <div class="circle-search-info">
                                <div class="circle-search-name">${highlightKeyword(circle.name, q)}</div>
                                <div class="circle-search-meta">${circle.description ? highlightKeyword(circle.description, q).substring(0, 80) : '暂无简介'} · ${circle.member_count || 0} 成员</div>
                            </div>
                            <i class="fas fa-chevron-right" style="color:#D1D5DB;"></i>
                        </div>
                    `;
                }).join('')}
            `;
            renderPagination(data.page, data.totalPages);
        }

        // 执行搜索
        async function performSearch(q, page = 1) {
            const resultsDiv = document.getElementById('resultsArea');
            resultsDiv.innerHTML = '<div class="loading">搜索中...</div>';
            document.getElementById('searchTabs').style.display = 'flex';

            try {
                const res = await fetch(`${window.API_BASE}/search/all?q=${encodeURIComponent(q)}&type=${currentType}&page=${page}&limit=10`);
                if (!res.ok) throw new Error('搜索失败');
                const data = await res.json();

                counts[data.type] = data.total;
                updateTabCounts();
                fetchOtherCounts(q);

                if (currentType === 'posts') renderPostResults(data, q);
                else if (currentType === 'users') renderUserResults(data, q);
                else if (currentType === 'circles') renderCircleResults(data, q);
            } catch (err) {
                console.error(err);
                resultsDiv.innerHTML = `<div class="error">${err.message}</div>`;
            }
        }

        // 渲染分页
        function renderPagination(current, total) {
            const container = document.getElementById('pagination');
            if (total <= 1) {
                container.innerHTML = '';
                return;
            }
            let html = '';
            for (let i = 1; i <= total; i++) {
                html += `<button class="${i === current ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            container.innerHTML = html;
            container.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = parseInt(btn.dataset.page);
                    if (page && page !== currentPage) {
                        currentPage = page;
                        window.history.pushState(null, '', `/search.html?q=${encodeURIComponent(currentKeyword)}&page=${page}`);
                        performSearch(currentKeyword, page);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });
        }

        // 搜索标签点击切换
        document.querySelectorAll('.search-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const type = tab.dataset.type;
                if (type === currentType) return;
                currentType = type;
                document.querySelectorAll('.search-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentPage = 1;
                performSearch(currentKeyword, currentPage);
            });
        });

        // 大搜索框按钮事件
        const doSearchBtn = document.getElementById('doSearchBtn');
        const searchKeywordInput = document.getElementById('searchKeyword');
        doSearchBtn.addEventListener('click', () => {
            const q = searchKeywordInput.value.trim();
            if (q) {
                window.location.href = `/search.html?q=${encodeURIComponent(q)}`;
            } else {
                alert('请输入搜索关键词');
            }
        });
        searchKeywordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doSearchBtn.click();
        });
    </script>
</body>
