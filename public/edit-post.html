<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑帖子 - 深圳高中生社区</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/js/mobile.js" defer></script>
    <script src="/js/level-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif; background-color: #F5F7FA; color: #1f2d3d; line-height: 1.5; padding-top: 60px; margin-left: 260px; transition: margin-left 0.3s ease; position: relative; min-height: 100vh; }
        body.sidebar-collapsed { margin-left: 70px; }
        .bg-decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .bg-decorations .wave { position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: url('data:image/svg+xml;utf8,...') repeat-x; background-size: cover; opacity: 0.5; }
        .bg-decorations .circle { position: absolute; border-radius: 50%; background: rgba(30,136,229,0.05); }
        .bg-decorations .circle1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-decorations .circle2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
        .bg-decorations .circle3 { width: 150px; height: 150px; top: 30%; right: 10%; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .top-bar-container { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; border-bottom: 1px solid #e9ecef; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
        .top-bar { display: flex; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 20px; color: #4a5568; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1E88E5; text-decoration: none; margin-right: auto; }
        .search-area { display: flex; align-items: center; background: #f1f3f5; border-radius: 24px; padding: 4px 12px; width: 260px; }
        .search-area input { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; }
        .search-area button { background: transparent; border: none; cursor: pointer; color: #6c757d; }
        .about-link { margin-left: 16px; color: #4a5568; text-decoration: none; font-size: 0.95rem; transition: color 0.2s; white-space: nowrap; }
        .about-link:hover { color: #1E88E5; }
        .notifications-icon { position: relative; margin-left: 16px; font-size: 1.4rem; color: #6c757d; text-decoration: none; display: inline-flex; align-items: center; }
        .notif-badge { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 260px; background: white; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 99; overflow-x: hidden; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-user-info, #sidebar.collapsed .sidebar-link span { display: none; }
        #sidebar.collapsed .sidebar-logout { font-size: 0; padding: 8px; }
        #sidebar.collapsed .sidebar-logout::before { content: "🚪"; font-size: 1.2rem; }
        .sidebar-user { display: flex; align-items: center; padding: 20px 16px; border-bottom: 1px solid #eef2f6; cursor: pointer; }
        .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 12px; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-avatar i { font-size: 48px; color: #1E88E5; }
        .sidebar-user-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .sidebar-nickname { font-weight: 600; font-size: 1rem; }
        .sidebar-email { font-size: 0.7rem; color: #6c757d; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 16px 0; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: #4a5568; transition: background 0.2s; white-space: nowrap; }
        .sidebar-link i { width: 28px; font-size: 1.2rem; text-align: center; }
        .sidebar-link span { margin-left: 12px; }
        .sidebar-link:hover { background: #f0f2f5; }
        .sidebar-link.active { background: #e9f0fe; color: #1E88E5; }
        .notif-dot { color: #e53e3e; font-size: 0.7rem; margin-left: 4px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #eef2f6; }
        .sidebar-logout { width: 100%; background: none; border: none; padding: 8px; cursor: pointer; color: #e53e3e; border-radius: 8px; text-align: center; }
        .sidebar-logout:hover { background: #ffe5e5; }

        .edit-wrapper { display: flex; justify-content: center; margin: 32px 0; }
        .editor-container { max-width: 900px; width: 100%; background: white; border-radius: 16px; padding: 24px; border: 1px solid #eef2f6; }
        .back-link { display: inline-block; margin-bottom: 16px; color: #1E88E5; text-decoration: none; font-size: 0.9rem; }
        .back-link i { margin-right: 6px; }
        .editor-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #1E88E5; box-shadow: 0 0 0 3px rgba(30,136,229,0.1); }
        #title { font-size: 1.2rem; }

        .preset-tags { margin-bottom: 12px; }
        .preset-tags-label { font-size: 0.85rem; color: #6c757d; margin-bottom: 8px; }
        .preset-tag { display: inline-block; padding: 6px 14px; border-radius: 20px; background: #F3F4F6; color: #6B7280; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; margin-right: 6px; margin-bottom: 6px; border: 1px solid transparent; }
        .preset-tag:hover { background: #EFF6FF; color: #1E88E5; border-color: #1E88E5; }
        .preset-tag.active { background: #1E88E5; color: white; border-color: #1E88E5; }

        .tags-input-wrap { border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 10px; min-height: 42px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .tags-input-wrap:focus-within { border-color: #1E88E5; box-shadow: 0 0 0 3px rgba(30,136,229,0.1); }
        .tag-chip { display: inline-flex; align-items: center; gap: 4px; background: #EFF6FF; color: #1E88E5; padding: 3px 10px; border-radius: 16px; font-size: 0.8rem; }
        .tag-chip .tag-del { cursor: pointer; font-size: 1rem; line-height: 1; }
        .tag-chip .tag-del:hover { color: #e53e3e; }
        .tags-input-wrap input { flex: 1; border: none; outline: none; font-size: 0.9rem; min-width: 100px; padding: 4px 0; }

        .editor-toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px; background: #F8FAFC; border: 1px solid #E5E7EB; border-radius: 12px 12px 0 0; }
        .editor-toolbar .sep { width: 1px; height: 28px; background: #E5E7EB; margin: 0 4px; }
        .toolbar-btn { width: 36px; height: 36px; border: none; background: white; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: #4B5563; transition: all 0.15s; display: inline-flex; align-items: center; justify-content: center; }
        .toolbar-btn:hover { background: #EFF6FF; color: #1E88E5; }

        .editor-workspace { display: flex; border: 1px solid #E5E7EB; border-top: none; border-radius: 0 0 12px 12px; min-height: 350px; }
        .editor-textarea { flex: 1; padding: 16px; border: none; border-right: 1px solid #E5E7EB; resize: vertical; font-family: 'Consolas','Monaco','Courier New',monospace; font-size: 0.9rem; line-height: 1.6; outline: none; min-height: 300px; }
        .editor-preview { flex: 1; padding: 16px; background: white; overflow-y: auto; line-height: 1.6; font-size: 0.95rem; min-height: 300px; }
        .editor-preview img { max-width: 100%; border-radius: 8px; }
        .editor-preview video { max-width: 100%; border-radius: 8px; }
        .editor-preview pre { background: #F8FAFC; padding: 12px; border-radius: 8px; overflow-x: auto; }
        .editor-preview code { background: #F3F4F6; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
        .editor-preview pre code { background: none; padding: 0; }
        .editor-preview blockquote { border-left: 4px solid #1E88E5; padding-left: 16px; color: #6B7280; margin: 12px 0; }
        .editor-preview h1, .editor-preview h2, .editor-preview h3 { margin: 16px 0 8px; }
        .editor-preview p { margin: 8px 0; }
        .editor-preview ul, .editor-preview ol { padding-left: 24px; margin: 8px 0; }

        .submit-btn { width: 100%; background: #1E88E5; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
        .submit-btn:hover { background: #1565C0; }
        .error-msg { color: #e53e3e; text-align: center; margin-top: 12px; font-size: 0.9rem; }
        .hidden-input { display: none; }

        @media (max-width: 768px) {
            body { margin-left: 0; }
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; width: 260px !important; }
            #sidebar.open-mobile { transform: translateX(0); }
            .search-area { width: 180px; }
            .editor-container { margin: 16px; padding: 16px; }
            .editor-workspace { flex-direction: column; }
            .editor-textarea { border-right: none; border-bottom: 1px solid #E5E7EB; min-height: 200px; }
            .editor-preview { min-height: 200px; }
        }
    </style>
</head>
<body id="appBody">
    <div class="bg-decorations">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <div class="wave"></div>
    </div>
    <div class="top-bar-container">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <a href="/" class="logo">深圳高中生社区</a>
            <div class="search-area">
                <input type="text" placeholder="搜索帖子、用户..." id="searchInput">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <a href="/about.html" class="about-link" id="aboutLink"><i class="fas fa-info-circle"></i> 关于</a>
            <a href="/notifications.html" class="notifications-icon" id="notifLink">
                <i class="fas fa-bell"></i>
                <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
            </a>
        </div>
    </div>
    <div id="sidebar">
        <div class="sidebar-user" id="sidebarUserBtn">
            <div class="sidebar-avatar" id="sidebarAvatar"><i class="fas fa-user-circle"></i></div>
            <div class="sidebar-user-info">
                <div class="sidebar-nickname" id="sidebarNickname">未登录</div>
                <div class="sidebar-email" id="sidebarEmail"></div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-link" title="首页"><i class="fas fa-home"></i><span>首页</span></a>
            <a href="learning.html" class="sidebar-link" title="学习"><i class="fas fa-graduation-cap"></i><span>学习</span></a>
            <a href="circles.html" class="sidebar-link" title="圈子"><i class="fas fa-users"></i><span>圈子</span></a>
            <a href="/study.html" class="sidebar-link" title="自习室"><i class="fas fa-clock"></i><span>自习室</span></a>
            <a href="feed.html" class="sidebar-link" title="动态"><i class="fas fa-bolt"></i><span>动态</span></a>
            <a href="life.html" class="sidebar-link" title="生活"><i class="fas fa-life-ring"></i><span>生活</span></a>
            <a href="gaokao.html" class="sidebar-link" title="升学"><i class="fas fa-chart-line"></i><span>升学</span></a>
            <a href="profile.html" class="sidebar-link" title="个人主页"><i class="fas fa-user"></i><span>个人主页</span></a>
            <a href="settings.html" class="sidebar-link" title="设置"><i class="fas fa-cog"></i><span>设置</span></a>
            <a href="admin.html" class="sidebar-link" title="管理后台"><i class="fas fa-shield-alt"></i><span>管理后台</span></a>
            <a href="messages.html" class="sidebar-link" id="sidebarMessagesLink" title="私信"><i class="fas fa-envelope"></i><span>私信</span></a>
            <a href="feedback.html" class="sidebar-link" id="sidebarFeedbackLink" title="反馈"><i class="fas fa-comment-dots"></i><span>反馈</span></a>
            <a href="/notifications.html" class="sidebar-link" id="sidebarNotifLink" title="通知">
                <i class="fas fa-bell"></i><span>通知</span>
                <span class="notif-dot" id="sidebarNotifDot" style="display:none;">●</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-logout" id="sidebarLogoutBtn">退出登录</button>
        </div>
    </div>

    <div class="container">
        <div class="edit-wrapper">
            <div class="editor-container">
                <a href="#" id="backLink" class="back-link"><i class="fas fa-arrow-left"></i> 返回帖子</a>
                <h1 class="editor-title">📝 编辑帖子</h1>
                <form id="editForm">
                    <div class="form-group">
                        <label>标题</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group" style="display:flex;gap:16px;">
                        <div style="flex:1;">
                            <label>分类</label>
                            <select id="category">
                                <option value="学习">学习</option>
                                <option value="生活">生活</option>
                                <option value="社团">社团</option>
                                <option value="升学">升学</option>
                                <option value="综合">综合</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>快速添加标签</label>
                        <div class="preset-tags">
                            <div class="preset-tags-label">点击添加：</div>
                            <span class="preset-tag" data-tag="学习资料">📚 学习资料</span>
                            <span class="preset-tag" data-tag="经验分享">💬 经验分享</span>
                            <span class="preset-tag" data-tag="社团活动">🎉 社团活动</span>
                            <span class="preset-tag" data-tag="校园生活">🏫 校园生活</span>
                            <span class="preset-tag" data-tag="升学指导">🎓 升学指导</span>
                            <span class="preset-tag" data-tag="求助提问">❓ 求助提问</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>标签</label>
                        <div class="tags-input-wrap" id="tagsInputWrap">
                            <input type="text" id="tagInput" placeholder="输入自定义标签，按回车添加...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>内容（支持 Markdown）</label>
                        <div class="editor-toolbar">
                            <button type="button" class="toolbar-btn" title="加粗" data-cmd="bold"><b>B</b></button>
                            <button type="button" class="toolbar-btn" title="斜体" data-cmd="italic"><i>I</i></button>
                            <button type="button" class="toolbar-btn" title="标题" data-cmd="heading">H</button>
                            <div class="sep"></div>
                            <button type="button" class="toolbar-btn" title="无序列表" data-cmd="ulist"><i class="fas fa-list-ul"></i></button>
                            <button type="button" class="toolbar-btn" title="有序列表" data-cmd="olist"><i class="fas fa-list-ol"></i></button>
                            <div class="sep"></div>
                            <button type="button" class="toolbar-btn" title="链接" data-cmd="link"><i class="fas fa-link"></i></button>
                            <button type="button" class="toolbar-btn" title="图片" data-cmd="image"><i class="far fa-image"></i></button>
                            <button type="button" class="toolbar-btn" title="视频" data-cmd="video"><i class="fas fa-video"></i></button>
                            <div class="sep"></div>
                            <button type="button" class="toolbar-btn" title="代码块" data-cmd="code"><i class="fas fa-code"></i></button>
                            <button type="button" class="toolbar-btn" title="引用" data-cmd="quote"><i class="fas fa-quote-right"></i></button>
                        </div>
                        <div class="editor-workspace">
                            <textarea class="editor-textarea" id="content" placeholder="支持 Markdown 语法..."></textarea>
                            <div class="editor-preview" id="preview"><p style="color:#9CA3AF;">预览区域</p></div>
                        </div>
                    </div>
                    <input type="file" accept="image/*" class="hidden-input" id="imageInput" multiple>
                    <input type="file" accept="video/*" class="hidden-input" id="videoInput">
                    <button type="submit" class="submit-btn">保存修改</button>
                    <div id="errorMsg" class="error-msg"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        window.API_BASE = window.API_BASE || '/api';
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/login.html'; }

        // 侧边栏、用户信息等
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('menuToggle');
        const body = document.getElementById('appBody');
        const isExpanded = localStorage.getItem('sidebarExpanded') !== 'false';
        if (!isExpanded) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); }
        else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); }
        toggleBtn.addEventListener('click', function() {
            var e = !sidebar.classList.contains('collapsed');
            if (e) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','false'); }
            else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','true'); }
        });
        const avatarDiv = document.getElementById('sidebarAvatar');
        const nicknameSpan = document.getElementById('sidebarNickname');
        const emailSpan = document.getElementById('sidebarEmail');
        async function updateSidebarUser() {
            try {
                var res = await fetch(window.API_BASE+'/me', { headers: { 'Authorization': 'Bearer '+token } });
                if (res.ok) { var u = await res.json(); nicknameSpan.innerText = u.nickname||'用户'; emailSpan.innerText = u.email||''; avatarDiv.innerHTML = u.avatar_url?'<img src="'+u.avatar_url+'" alt="头像">':'<i class="fas fa-user-circle"></i>'; }
            } catch(e) {}
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', function() { window.location.href='/profile.html'; });
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', function() { localStorage.removeItem('token'); window.location.href='/login.html'; });
        async function updateNotifDot() {
            if (!token) return;
            try { var res = await fetch(window.API_BASE+'/notifications?page=1&limit=1', { headers: { 'Authorization': 'Bearer '+token } }); var d = await res.json(); var cnt = d.unreadCount||0; var badge = document.getElementById('notifBadge'); var dot = document.getElementById('sidebarNotifDot'); if (badge) { badge.style.display = cnt>0?'flex':'none'; badge.innerText = cnt>99?'99+':cnt; } if (dot) dot.style.display = cnt>0?'inline-block':'none'; } catch(e) {}
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);
        document.getElementById('searchBtn')?.addEventListener('click', function() { var q=document.getElementById('searchInput').value.trim(); if(q) window.location.href='/search.html?q='+encodeURIComponent(q); else alert('请输入搜索关键词'); });
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) { if(e.key==='Enter') document.getElementById('searchBtn').click(); });

        // ---------- 编辑器 ----------
        var contentEl = document.getElementById('content');
        var previewEl = document.getElementById('preview');
        contentEl.addEventListener('input', function() { updatePreview(); });

        function updatePreview() {
            try { previewEl.innerHTML = marked.parse(contentEl.value||''); }
            catch(e) { previewEl.innerHTML = '<p style="color:#e53e3e;">解析出错</p>'; }
        }

        // 工具栏
        function insertMarkdown(before, after) {
            var start = contentEl.selectionStart, end = contentEl.selectionEnd;
            var text = contentEl.value, selected = text.substring(start, end)||'文本';
            contentEl.value = text.substring(0,start) + before + selected + after + text.substring(end);
            contentEl.focus();
            contentEl.selectionStart = start + before.length;
            contentEl.selectionEnd = start + before.length + selected.length;
            contentEl.dispatchEvent(new Event('input'));
        }
        document.querySelectorAll('.toolbar-btn[data-cmd]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                switch(btn.dataset.cmd) {
                    case 'bold': insertMarkdown('**','**'); break;
                    case 'italic': insertMarkdown('*','*'); break;
                    case 'heading': insertMarkdown('\n## ','\n'); break;
                    case 'ulist': insertMarkdown('\n- ',''); break;
                    case 'olist': insertMarkdown('\n1. ',''); break;
                    case 'link': { var u=prompt('链接地址:','https://'); if(u) insertMarkdown('[',']('+u+')'); break; }
                    case 'code': insertMarkdown('\n```\n','\n```\n'); break;
                    case 'quote': insertMarkdown('\n> ','\n'); break;
                    case 'image': document.getElementById('imageInput').click(); break;
                    case 'video': document.getElementById('videoInput').click(); break;
                }
            });
        });

        // 文件上传
        async function uploadFile(file, type) {
            var fd = new FormData(); fd.append('file', file);
            var placeholder = type==='image' ? '![上传中...](uploading)' : '\n<video src="uploading" controls></video>\n';
            insertMarkdown(placeholder, '');
            try {
                var res = await fetch(window.API_BASE+'/upload/file', { method:'POST', headers:{'Authorization':'Bearer '+token}, body:fd });
                var data = await res.json();
                if (res.ok) {
                    var val = contentEl.value;
                    contentEl.value = type==='image'
                        ? val.replace('![上传中...](uploading)','!['+file.name+']('+data.url+')')
                        : val.replace('<video src="uploading" controls></video>','<video src="'+data.url+'" controls></video>');
                    contentEl.dispatchEvent(new Event('input'));
                } else { alert('上传失败'); }
            } catch(e) { alert('上传失败'); }
        }
        document.getElementById('imageInput').addEventListener('change', async function(e) {
            for(var i=0;i<e.target.files.length;i++) await uploadFile(e.target.files[i],'image');
            this.value='';
        });
        document.getElementById('videoInput').addEventListener('change', async function(e) {
            if(e.target.files[0]) await uploadFile(e.target.files[0],'video');
            this.value='';
        });
        contentEl.addEventListener('paste', function(e) {
            for(var i=0;i<e.clipboardData.items.length;i++) {
                if(e.clipboardData.items[i].type.indexOf('image')!==-1) {
                    e.preventDefault();
                    var file = e.clipboardData.items[i].getAsFile();
                    if(file) uploadFile(file,'image');
                    return;
                }
            }
        });

        // ---------- 标签 ----------
        var selectedTags = [];
        document.querySelectorAll('.preset-tag').forEach(function(el) {
            el.addEventListener('click', function() {
                var tag = el.dataset.tag;
                el.classList.toggle('active');
                var idx = selectedTags.indexOf(tag);
                if(idx!==-1) selectedTags.splice(idx,1);
                else selectedTags.push(tag);
                renderTags();
            });
        });
        document.getElementById('tagInput').addEventListener('keydown', function(e) {
            if(e.key==='Enter'||e.key===',') {
                e.preventDefault();
                var v = this.value.trim();
                if(v && selectedTags.indexOf(v)===-1) { selectedTags.push(v); renderTags(); }
                this.value='';
            }
        });
        function renderTags() {
            var wrap = document.getElementById('tagsInputWrap');
            wrap.querySelectorAll('.tag-chip').forEach(function(el){el.remove();});
            selectedTags.forEach(function(tag) {
                var chip = document.createElement('span');
                chip.className='tag-chip';
                chip.innerHTML = tag+'<span class="tag-del" data-tag="'+tag+'">&times;</span>';
                chip.querySelector('.tag-del').addEventListener('click', function() {
                    var t=this.dataset.tag;
                    var idx=selectedTags.indexOf(t);
                    if(idx!==-1) { selectedTags.splice(idx,1); renderTags(); }
                    document.querySelectorAll('.preset-tag').forEach(function(el){if(el.dataset.tag===t)el.classList.remove('active');});
                });
                wrap.insertBefore(chip, document.getElementById('tagInput'));
            });
        }

        // ---------- 加载帖子 ----------
        var urlParams = new URLSearchParams(window.location.search);
        var postId = urlParams.get('id');
        if (!postId) { alert('缺少帖子ID'); window.location.href='/'; }

        async function loadPost() {
            try {
                var res = await fetch(window.API_BASE+'/posts/'+postId);
                if (!res.ok) throw new Error('加载失败');
                var data = await res.json();
                var post = data.post;
                document.getElementById('title').value = post.title;
                document.getElementById('category').value = post.category||'综合';
                contentEl.value = post.content;
                document.getElementById('backLink').href='/post-detail.html?id='+postId;
                // 加载标签
                if (post.tags && post.tags.length) {
                    selectedTags = post.tags.map(function(t) { return t.replace(/^#/,''); });
                    renderTags();
                    document.querySelectorAll('.preset-tag').forEach(function(el) {
                        if(selectedTags.indexOf(el.dataset.tag)!==-1) el.classList.add('active');
                    });
                }
                updatePreview();
            } catch(err) {
                document.getElementById('errorMsg').innerText = err.message;
            }
        }

        // ---------- 保存 ----------
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var title = document.getElementById('title').value.trim();
            var content = contentEl.value.trim();
            var category = document.getElementById('category').value;
            if (!title || !content) { document.getElementById('errorMsg').innerText='标题和内容不能为空'; return; }
            var tags = selectedTags.map(function(t){return t.startsWith('#')?t:'#'+t;});
            try {
                var res = await fetch(window.API_BASE+'/posts/'+postId, {
                    method:'PUT',
                    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
                    body:JSON.stringify({title:title,content:content,category:category,tags:tags})
                });
                var data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert('修改成功');
                window.location.href='/post-detail.html?id='+postId;
            } catch(err) { document.getElementById('errorMsg').innerText=err.message||'保存失败'; }
        });

        loadPost();
    </script>
</body>
</html>
