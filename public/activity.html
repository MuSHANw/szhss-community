    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
            background-color: #F5F7FA; color: #1f2d3d; line-height: 1.5;
            padding-top: 60px; margin-left: 260px; transition: margin-left 0.3s ease; position: relative; min-height: 100vh;
        }
        body.sidebar-collapsed { margin-left: 70px; }
        .bg-decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .bg-decorations .wave { position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x; background-size: cover; opacity: 0.5; }
        .bg-decorations .circle { position: absolute; border-radius: 50%; background: rgba(30,136,229,0.05); }
        .bg-decorations .circle1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-decorations .circle2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
        .bg-decorations .circle3 { width: 150px; height: 150px; top: 30%; right: 10%; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .top-bar-container { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; border-bottom: 1px solid #e9ecef; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
        .top-bar { display: flex; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 20px; color: #4a5568; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1E88E5; text-decoration: none; margin-right: auto; }
        .search-area { display: flex; align-items: center; background: #f1f3f5; border-radius: 24px; padding: 4px 12px; width: 260px; }
        .search-area input { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; }
        .search-area button { background: transparent; border: none; cursor: pointer; color: #6c757d; }
        .about-link { margin-left: 16px; color: #4a5568; text-decoration: none; font-size: 0.95rem; transition: color 0.2s; white-space: nowrap; }
        .about-link:hover { color: #1E88E5; }
        .notifications-icon { position: relative; margin-left: 16px; font-size: 1.4rem; color: #6c757d; text-decoration: none; display: inline-flex; align-items: center; }
        .notif-badge { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 260px; background: white; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 99; overflow-x: hidden; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-user-info, #sidebar.collapsed .sidebar-link span { display: none; }
        #sidebar.collapsed .sidebar-logout { font-size: 0; padding: 8px; }
        #sidebar.collapsed .sidebar-logout::before { content: "🚪"; font-size: 1.2rem; }
        .sidebar-user { display: flex; align-items: center; padding: 20px 16px; border-bottom: 1px solid #eef2f6; cursor: pointer; }
        .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 12px; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-avatar i { font-size: 48px; color: #1E88E5; }
        .sidebar-user-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .sidebar-nickname { font-weight: 600; font-size: 1rem; }
        .sidebar-email { font-size: 0.7rem; color: #6c757d; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 16px 0; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: #4a5568; transition: background 0.2s; white-space: nowrap; }
        .sidebar-link i { width: 28px; font-size: 1.2rem; text-align: center; }
        .sidebar-link span { margin-left: 12px; }
        .sidebar-link:hover { background: #f0f2f5; }
        .sidebar-link.active { background: #e9f0fe; color: #1E88E5; }
        .sidebar-link.sponsor-link { color: #e53e3e; }
        .sidebar-link.sponsor-link:hover { background: #ffe5e5; }
        .sidebar-link.sponsor-link i { color: #e53e3e; }
        .notif-dot { color: #e53e3e; font-size: 0.7rem; margin-left: 4px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #eef2f6; }
        .sidebar-logout { width: 100%; background: none; border: none; padding: 8px; cursor: pointer; color: #e53e3e; border-radius: 8px; text-align: center; }
        .sidebar-logout:hover { background: #ffe5e5; }

        /* ========== 活动详情 ========== */
        .activity-wrapper { max-width: 900px; margin: 32px auto; }

        .activity-hero {
            position: relative; border-radius: 16px; overflow: hidden; min-height: 260px;
            display: flex; align-items: flex-end; color: white;
            background: linear-gradient(135deg, #dc2626, #7c3aed);
        }
        .activity-hero.has-cover { background-size: cover; background-position: center; }
        .activity-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0.05)); }
        .activity-hero-content { position: relative; z-index: 1; padding: 28px; width: 100%; }
        .activity-hero-badge {
            display: inline-block; padding: 3px 12px; border-radius: 12px;
            background: rgba(239,68,68,0.95); font-size: 0.8rem; font-weight: 600; margin-bottom: 10px;
        }
        .activity-hero-badge.upcoming { background: rgba(245,158,11,0.95); }
        .activity-hero-badge.ended { background: rgba(107,114,128,0.95); }
        .activity-hero-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
        .activity-hero-time { font-size: 0.9rem; opacity: 0.95; }

        .activity-card {
            background: white; border-radius: 16px; padding: 24px;
            border: 1px solid #eef2f6; margin-top: 16px;
        }
        .activity-card h3 { font-size: 1.1rem; margin-bottom: 16px; }
        .activity-card h3 i { color: #1E88E5; margin-right: 6px; }

        .activity-meta-row { display: flex; flex-wrap: wrap; gap: 18px; color: #6B7280; font-size: 0.85rem; }
        .activity-meta-row span { display: inline-flex; align-items: center; gap: 5px; }
        .activity-rules { line-height: 1.8; color: #374151; font-size: 0.95rem; }
        .activity-rules img { max-width: 100%; border-radius: 8px; }
        .activity-rules a { color: #1E88E5; }

        .reward-row { display: flex; flex-wrap: wrap; gap: 12px; }
        .reward-item {
            display: inline-flex; align-items: center; gap: 8px;
            background: #FFF7ED; color: #B45309; padding: 10px 18px;
            border-radius: 12px; font-size: 0.9rem; font-weight: 600;
        }
        .reward-item.coin { background: #FEF3C7; color: #92400E; }
        .reward-item.badge { background: #EFF6FF; color: #1E40AF; }

        /* 投票 */
        .vote-option {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .vote-option:hover { border-color: #1E88E5; }
        .vote-option.voted { cursor: default; }
        .vote-option.voted .vote-bar-fill { background: #10B981; }
        .vote-option-index {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            background: #EFF6FF; color: #1E88E5; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 0.85rem;
        }
        .vote-option.voted .vote-option-index { background: #10B981; color: white; }
        .vote-option-body { flex: 1; min-width: 0; }
        .vote-option-label { font-weight: 600; margin-bottom: 6px; }
        .vote-bar { height: 8px; background: #EFF6FF; border-radius: 4px; overflow: hidden; }
        .vote-bar-fill { height: 100%; background: #1E88E5; border-radius: 4px; transition: width 0.4s; }
        .vote-option-count { font-size: 0.8rem; color: #6B7280; margin-top: 4px; }
        .vote-option-desc { font-size: 0.8rem; color: #6B7280; margin-top: 2px; }

        /* 打卡 */
        .checkin-btn {
            background: #1E88E5; color: white; border: none;
            padding: 12px 36px; border-radius: 40px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .checkin-btn:hover { background: #1565C0; }
        .checkin-btn.done { background: #10B981; cursor: default; }
        .checkin-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 16px; }
        .checkin-weekday { text-align: center; font-size: 0.75rem; color: #9CA3AF; padding: 4px 0; }
        .checkin-day {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 0.8rem; background: #F9FAFB; color: #374151;
        }
        .checkin-day.empty { background: transparent; }
        .checkin-day.today { border: 2px solid #1E88E5; font-weight: 700; }
        .checkin-day.done { background: #1E88E5; color: white; font-weight: 600; }

        /* 表单 */
        .activity-input, .activity-textarea, .activity-select {
            width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0;
            border-radius: 12px; font-size: 0.95rem; outline: none; font-family: inherit; background: white;
        }
        .activity-input:focus, .activity-textarea:focus, .activity-select:focus { border-color: #1E88E5; }
        .activity-textarea { min-height: 100px; resize: vertical; }
        .form-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #374151; }
        .form-group { margin-bottom: 14px; }
        .form-row { display: flex; gap: 14px; }
        .form-row .form-group { flex: 1; }

        .btn-primary {
            background: #1E88E5; color: white; border: none;
            padding: 12px 36px; border-radius: 40px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary:hover { background: #1565C0; }
        .btn-primary:disabled { background: #D1D5DB; cursor: not-allowed; }
        .btn-secondary {
            background: #f0f2f5; color: #374151; border: none;
            padding: 12px 36px; border-radius: 40px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-secondary:hover { background: #e2e8f0; }

        /* 投票确认制 */
        .vote-option.selected { border-color: #1E88E5; background: #EFF6FF; }
        .vote-option-image { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .vote-option-checked { font-size: 0.8rem; color: #065F46; margin-top: 4px; font-weight: 600; }

        /* 校际PK */
        .pk-faction-card {
            display: flex; align-items: center; gap: 14px; padding: 14px;
            background: #F9FAFB; border: 1px solid #eef2f6; border-radius: 12px; margin-bottom: 10px;
        }
        .pk-faction-logo { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: #EFF6FF; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .pk-faction-name { font-weight: 600; }
        .pk-faction-desc { font-size: 0.8rem; color: #6B7280; }

        /* 排行榜 */
        .leaderboard-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f2f5; }
        .leaderboard-item:last-child { border-bottom: none; }
        .leaderboard-rank {
            width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; background: #F3F4F6; color: #6B7280;
        }
        .leaderboard-rank.rank-1 { background: #FEF3C7; color: #B45309; }
        .leaderboard-rank.rank-2 { background: #E5E7EB; color: #4B5563; }
        .leaderboard-rank.rank-3 { background: #FFEDD5; color: #C2410C; }
        .leaderboard-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #EFF6FF; }
        .leaderboard-info { flex: 1; min-width: 0; }
        .leaderboard-name { font-weight: 600; font-size: 0.9rem; }
        .leaderboard-score { font-size: 0.8rem; color: #6B7280; }

        /* 作品墙 */
        .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
        .work-card { border: 1px solid #eef2f6; border-radius: 12px; padding: 14px; }
        .work-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .work-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .work-author { font-size: 0.85rem; font-weight: 600; }
        .work-time { font-size: 0.75rem; color: #9CA3AF; }
        .work-content { font-size: 0.9rem; color: #374151; line-height: 1.6; word-break: break-word; }

        /* 答题 */
        .quiz-question { margin-bottom: 20px; }
        .quiz-question-title { font-weight: 600; margin-bottom: 10px; }
        .quiz-option { display: block; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; }
        .quiz-option:hover { border-color: #1E88E5; background: #F0F7FF; }
        .quiz-option input { margin-right: 8px; }

        /* 通用 */
        .action-hint { font-size: 0.85rem; color: #6B7280; margin-top: 12px; }
        .participate-status {
            display: inline-block; padding: 4px 14px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600; background: #D1FAE5; color: #065F46; margin-bottom: 14px;
        }
        .loading, .error { text-align: center; padding: 60px; color: #6c757d; }
        .poster-btn {
            background: white; color: #1E88E5; border: 2px solid #1E88E5;
            padding: 10px 24px; border-radius: 40px; font-size: 0.9rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .poster-btn:hover { background: #1E88E5; color: white; }

        /* 模态框 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-dialog {
            background: white; border-radius: 20px; padding: 28px 24px;
            max-width: 420px; width: 90%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative; text-align: center; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .modal-close-btn { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #6c757d; }
        .btn-primary-sm { background: #1E88E5; color: white; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .btn-secondary-sm { background: #f0f2f5; color: #4a5568; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; }

        @media (max-width: 768px) {
            body { margin-left: 0; }
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; width: 260px !important; }
            #sidebar.open-mobile { transform: translateX(0); }
            .search-area { width: 34px; }
            .activity-wrapper { margin: 16px; }
            .activity-hero { min-height: 200px; }
            .activity-hero-title { font-size: 1.4rem; }
            .activity-card { padding: 18px; }
            .form-row { flex-direction: column; gap: 0; }
        }
    
        /* ========== 移动端专项优化（第二批） ========== */
@media (max-width: 768px) {
    .activity-hero { height: auto; max-height: 200px; }
    .activity-hero img, .activity-hero.has-cover img { width: 100%; height: auto; max-height: 200px; object-fit: cover; }
    .vote-option { width: 100%; }
    #voteArea, .vote-area { grid-template-columns: 1fr; }
    #signupForm input, #signupForm textarea, #signupForm select { font-size: 16px; }
    .confirm-vote-btn, #confirmVoteBtn { width: 100%; min-height: 44px; }
    .activity-rules { overflow-wrap: break-word; word-break: break-all; }
}
    </style>
</head>

            <a href="profile.html" class="sidebar-link" title="个人主页"><i class="fas fa-user"></i><span>个人主页</span></a>
            <a href="settings.html" class="sidebar-link" title="设置"><i class="fas fa-cog"></i><span>设置</span></a>
            <a href="feedback.html" class="sidebar-link" id="sidebarFeedbackLink" title="反馈">
                <i class="fas fa-comment-dots"></i><span>反馈</span>
            </a>
            <a href="https://mushanw.github.io/MuShanblog/sponsor.html" class="sidebar-link sponsor-link" title="赞助" target="_blank">
                <i class="fas fa-heart"></i><span>赞助</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-logout" id="sidebarLogoutBtn">退出登录</button>
        </div>
    </div>

    <!-- 活动主体 -->
    <div class="container">
        <div class="activity-wrapper">
            <div id="activityCard"><div class="loading">加载中...</div></div>
        </div>
    </div>

    <!-- 海报模态框 -->
    <div id="posterModal" class="modal-overlay" style="display:none;">
        <div class="modal-dialog">
            <button class="modal-close-btn" onclick="closePosterModal()">&times;</button>
            <img id="posterImg" style="width:100%;border-radius:12px;" alt="活动海报">
            <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;">
                <button class="btn-primary-sm" onclick="downloadPoster()">下载海报</button>
                <button class="btn-secondary-sm" onclick="shareActivity()">分享给好友</button>
            </div>
        </div>
    </div>

    <!-- 投票确认模态框 -->
    <div id="voteConfirmModal" class="modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;">
        <div class="modal-dialog" style="background:white;border-radius:16px;padding:24px;max-width:380px;width:90%;text-align:center;">
            <h3 style="margin-bottom:12px;">确认投票</h3>
            <p id="voteConfirmText" style="margin-bottom:20px;color:#6B7280;">你确定要投票给这个选项吗？投票后不可更改。</p>
            <div style="display:flex;gap:12px;justify-content:center;">
                <button class="btn-secondary" onclick="closeVoteConfirm()" style="padding:10px 28px;">取消</button>
                <button class="btn-primary" id="voteConfirmBtn" style="padding:10px 28px;">确认</button>
            </div>
        </div>
    </div>

    <script>
        window.API_BASE = window.API_BASE || '/api';
        var token = localStorage.getItem('token');
        var activityId = new URLSearchParams(window.location.search).get('id');
        var currentUserId = null;
        var activityData = null;
        var selectedVoteIndex = null;   // 当前选中的投票选项索引
        window._factionLogoUrl = '';    // PK阵营 Logo 上传后的URL

        // ---------- 侧边栏 ----------
        var sidebar = document.getElementById('sidebar'), toggleBtn = document.getElementById('menuToggle'), body = document.getElementById('appBody');
        if (localStorage.getItem('sidebarExpanded') !== 'false') { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); }
        else { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); }
        toggleBtn.addEventListener('click', function() {
            var e = !sidebar.classList.contains('collapsed');
            if (e) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); localStorage.setItem('sidebarExpanded', 'false'); }
            else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); localStorage.setItem('sidebarExpanded', 'true'); }
        });
        async function updateSidebarUser() {
            try {
                var res = await fetch(window.API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.status === 401) { localStorage.removeItem('token'); return; }
                if (res.ok) {
                    var u = await res.json();
                    document.getElementById('sidebarNickname').innerText = u.nickname || '用户';
                    document.getElementById('sidebarEmail').innerText = u.email || '';
                    document.getElementById('sidebarAvatar').innerHTML = u.avatar_url ? '<img src="' + u.avatar_url + '" alt="头像">' : '<i class="fas fa-user-circle"></i>';
                    currentUserId = u.id;
                }
            } catch (e) {}
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', function() { window.location.href = '/profile.html'; });
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', function() { localStorage.removeItem('token'); window.location.href = '/login.html'; });
        async function updateNotifDot() {
            if (!token) return;
            try {
                var res = await fetch(window.API_BASE + '/notifications?page=1&limit=1', { headers: { 'Authorization': 'Bearer ' + token } });
                var d = await res.json();
                var cnt = d.unreadCount || 0;
                var badge = document.getElementById('notifBadge');
                var dot = document.getElementById('sidebarNotifDot');
                if (badge) { badge.style.display = cnt > 0 ? 'flex' : 'none'; badge.innerText = cnt > 99 ? '99+' : cnt; }
                if (dot) dot.style.display = cnt > 0 ? 'inline-block' : 'none';
            } catch (e) {}
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);
        document.getElementById('searchBtn')?.addEventListener('click', function() { var q = document.getElementById('searchInput').value.trim(); if (q) window.location.href = '/search.html?q=' + encodeURIComponent(q); else alert('请输入搜索关键词'); });
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('searchBtn').click(); });

        // ---------- 工具函数 ----------
        function escapeHtml(str) { if (str === null || str === undefined) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        function formatDate(isoString) {
            if (!isoString) return '';
            var date = new Date(isoString);
            return date.getFullYear() + '/' + (date.getMonth() + 1) + '/' + date.getDate() + ' ' + date.getHours() + ':' + String(date.getMinutes()).padStart(2, '0');
        }
        function formatShortDate(isoString) {
            if (!isoString) return '';
            var date = new Date(isoString);
            return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
        }
        function getFullUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            return url.startsWith('/') ? 'https://szhss-community.top' + url : 'https://szhss-community.top/' + url;
        }

        var TYPE_NAMES = { vote: '投票评选', submit: '投稿征集', checkin: '打卡挑战', signup: '报名参与', quiz: '答题竞赛', pk: '校际PK' };

        // 活动状态：upcoming / active / ended / completed
        function getStatus(a) {
            if (a.status === 'completed') return 'completed';
            var now = new Date();
            var end = a.end_time ? new Date(a.end_time) : null;
            var start = a.start_time ? new Date(a.start_time) : null;
            if (end && now > end) return 'ended';
            if (start && now < start) return 'upcoming';
            return 'active';
        }

        // ---------- 加载活动 ----------
        async function loadActivity() {
            var container = document.getElementById('activityCard');
            if (!activityId) { container.innerHTML = '<div class="error">无效的活动ID</div>'; return; }
            try {
                var res = await fetch(window.API_BASE + '/activities/' + activityId, {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });
                var data = await res.json();
                if (!res.ok || !data.activity) { container.innerHTML = '<div class="error">' + escapeHtml(data.error || '活动不存在') + '</div>'; return; }
                var a = data.activity;
                activityData = a;

                var status = getStatus(a);
                var statusBadge = '';
                if (status === 'upcoming') statusBadge = '<span class="activity-hero-badge upcoming">📅 未开始</span>';
                else if (status === 'active') statusBadge = '<span class="activity-hero-badge">🔥 进行中</span>';
                else statusBadge = '<span class="activity-hero-badge ended">🏁 已结束</span>';

                var coverStyle = a.cover_url ? ' class="activity-hero has-cover" style="background-image:url(' + "'" + getFullUrl(a.cover_url) + "'" + ');"' : ' class="activity-hero"';

                var html = '';
                html += '<div' + coverStyle + '>';
                html += '    <div class="activity-hero-content">';
                html += '        <span class="activity-hero-badge">🎉 ' + escapeHtml(TYPE_NAMES[a.type] || a.type) + '</span> ' + statusBadge;
                html += '        <div class="activity-hero-title">' + escapeHtml(a.title) + '</div>';
                html += '        <div class="activity-hero-time"><i class="far fa-calendar-alt"></i> ' + formatDate(a.start_time) + ' ~ ' + formatDate(a.end_time) + '</div>';
                html += '    </div>';
                html += '</div>';

                // 元信息
                html += '<div class="activity-card">';
                html += '    <div class="activity-meta-row">';
                html += '        <span><i class="fas fa-users"></i> ' + (a.participant_count || 0) + ' 人参与</span>';
                html += '        <span><i class="fas fa-user-circle"></i> 主办：' + escapeHtml(a.creator_nickname || '官方') + '</span>';
                if (a.reward_coins > 0) html += '        <span><i class="fas fa-coins"></i> ' + a.reward_coins + ' 鹏城币奖励</span>';
                html += '    </div>';
                html += '</div>';

                // 规则
                if (a.rules) {
                    html += '<div class="activity-card"><h3><i class="fas fa-list-ul"></i>活动规则</h3><div class="activity-rules">' + a.rules + '</div></div>';
                }

                // 奖励
                if (a.reward_coins > 0 || a.reward_badge) {
                    html += '<div class="activity-card"><h3><i class="fas fa-gift"></i>活动奖励</h3><div class="reward-row">';
                    if (a.reward_coins > 0) html += '    <div class="reward-item coin"><i class="fas fa-coins"></i> 完成活动可得 ' + a.reward_coins + ' 鹏城币</div>';
                    if (a.reward_badge) html += '    <div class="reward-item badge"><i class="fas fa-medal"></i> 限定勋章：' + escapeHtml(a.reward_badge) + '</div>';
                    html += '</div></div>';
                }

                // 参与区域（按类型）
                html += '<div class="activity-card" id="participationArea">' + renderParticipation(a, status) + '</div>';

                // 排行榜（打卡/答题/投稿参与）
                if (a.type === 'checkin' || a.type === 'quiz' || a.type === 'submit') {
                    html += '<div class="activity-card" id="leaderboardCard"><h3><i class="fas fa-trophy"></i>参与排行 TOP20</h3><div id="leaderboardList">加载中...</div></div>';
                }

                // 分享
                html += '<div class="activity-card" style="text-align:center;">';
                html += '    <button class="poster-btn" onclick="showPoster()"><i class="fas fa-share-alt"></i> 生成活动海报分享</button>';
                html += '</div>';

                container.innerHTML = html;

                // 加载排行榜
                var lbCard = document.getElementById('leaderboardList');
                if (lbCard) loadLeaderboard(a.id);
                // 加载参与区域动态数据（作品墙/打卡日历）
                loadParticipationData(a);
            } catch (e) {
                container.innerHTML = '<div class="error">加载活动失败</div>';
            }
        }

        // ---------- 参与区域渲染 ----------
        function renderParticipation(a, status) {
            var active = status === 'active';
            var participated = a.user_participation;
            var hint = active ? '' : '<div class="action-hint">活动当前不可参与</div>';

            if (!active) {
                return '<div class="action-hint">' + (status === 'upcoming' ? '活动还未开始，敬请期待！' : '活动已结束，感谢参与！') + '</div>';
            }

            var html = '<h3><i class="fas fa-hand-paper"></i>立即参与</h3>';
            if (participated) html += '<div class="participate-status">✅ 你已参与本活动</div>';

            switch (a.type) {
                case 'vote': return html + '<div id="voteAreaWrap">' + renderVote(a, participated) + '</div>';
                case 'submit': return html + renderSubmit(a, participated);
                case 'checkin': return html + renderCheckin(a, participated);
                case 'signup': return html + renderSignup(a, participated);
                case 'quiz': return html + renderQuiz(a, participated);
                case 'pk': return html + renderPk(a, participated);
                default: return html + renderDefault(a, participated);
            }
        }

        // 投票（确认制：先选中再确认，已投票则锁定）
        function renderVote(a, participated) {
            var options = (a.config && a.config.options) || [];
            if (options.length === 0) return '<div class="action-hint">暂未设置候选选项</div>';
            // 登录用户以服务端为准；未登录用户参考本浏览器 localStorage 记录（防止重复投票）
            var localVotedIndex = localStorage.getItem('activityVote_' + a.id);
            var votedOption = (a.user_vote !== null && a.user_vote !== undefined)
                ? a.user_vote
                : (localVotedIndex !== null ? parseInt(localVotedIndex) : null);
            var hasVoted = votedOption !== null && votedOption !== undefined;
            var counts = a.vote_counts || {};
            var total = options.reduce(function(s, _, i) { return s + (counts[i] || 0); }, 0) || 1;

            var html = '';
            html += '<div id="voteArea">';
            options.forEach(function(opt, i) {
                // 兼容两种格式：字符串（旧）或 { title, description, image_url }（新）
                var label = typeof opt === 'string' ? opt : (opt && opt.title) || '选项' + (i + 1);
                var desc = (typeof opt === 'object' && opt && opt.description) ? opt.description : '';
                var image = (typeof opt === 'object' && opt && opt.image_url) ? opt.image_url : '';
                var count = counts[i] || 0;
                var pct = Math.round(count / total * 100);
                var isVotedOption = hasVoted && votedOption === i;
                var selected = !hasVoted && !participated && selectedVoteIndex === i;
                var clickable = !hasVoted && !participated;
                html += '<div class="vote-option' + (selected ? ' selected' : '') + (isVotedOption ? ' voted' : '') + '" id="voteOpt' + i + '" onclick="' + (clickable ? 'selectVoteOption(' + i + ')' : '') + '">';
                if (image) html += '    <img class="vote-option-image" src="' + getFullUrl(image) + '" alt="" onerror="this.style.display=\'none\'">';
                html += '    <div class="vote-option-index">' + (isVotedOption || selected ? '✓' : (i + 1)) + '</div>';
                html += '    <div class="vote-option-body">';
                html += '        <div class="vote-option-label">' + escapeHtml(label) + '</div>';
                if (desc) html += '        <div class="vote-option-desc">' + escapeHtml(desc) + '</div>';
                html += '        <div class="vote-bar"><div class="vote-bar-fill" style="width:' + pct + '%;"></div></div>';
                html += '        <div class="vote-option-count">' + count + ' 票（' + pct + '%）</div>';
                if (isVotedOption) html += '        <div class="vote-option-checked">✅ 你已投票</div>';
                html += '    </div>';
                html += '</div>';
            });
            html += '</div>';

            // 未投票时显示确认投票按钮
            if (!hasVoted && !participated) {
                html += '<div style="margin-top:16px;text-align:center;">';
                html += '    <button class="btn-primary" id="confirmVoteBtn" onclick="openVoteConfirm()" ' + (selectedVoteIndex === null ? 'disabled' : '') + '>确认投票</button>';
                html += '</div>';
                html += '<div class="action-hint" style="text-align:center;">点击选择你支持的选项，然后确认投票（每人仅一票）</div>';
            }
            return html;
        }

        // 选择投票选项
        function selectVoteOption(i) {
            if (selectedVoteIndex === i) selectedVoteIndex = null;
            else selectedVoteIndex = i;
            var wrap = document.getElementById('voteAreaWrap');
            if (wrap && activityData) {
                wrap.innerHTML = renderVote(activityData, activityData.user_participation);
            }
        }

        // 打开投票确认模态框
        function openVoteConfirm() {
            if (selectedVoteIndex === null) return;
            var options = (activityData.config && activityData.config.options) || [];
            var opt = options[selectedVoteIndex];
            var label = typeof opt === 'string' ? opt : (opt && opt.title) || ('选项' + (selectedVoteIndex + 1));
            document.getElementById('voteConfirmText').textContent = '你确定要投票给【' + label + '】吗？投票后不可更改。';
            document.getElementById('voteConfirmModal').style.display = 'flex';
        }

        function closeVoteConfirm() {
            document.getElementById('voteConfirmModal').style.display = 'none';
        }

        async function confirmVote() {
            if (selectedVoteIndex === null) return;
            // 登录用户带 token，未登录游客匿名投票（支持朋友圈拉票场景）
            var headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            var res = await fetch(window.API_BASE + '/activities/' + activityId + '/vote', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ option_id: selectedVoteIndex })
            });
            if (res.ok) {
                closeVoteConfirm();
                // 未登录用户用 localStorage 记录本浏览器已投选项，防止重复投票
                localStorage.setItem('activityVote_' + activityId, String(selectedVoteIndex));
                selectedVoteIndex = null;
                alert('投票成功！');
                loadActivity();
            } else {
                var d = await res.json();
                closeVoteConfirm();
                alert(d.error || '投票失败');
            }
        }

        // 投稿
        function renderSubmit(a, participated) {
            var html = '<div id="submitForm' + (participated ? '" style="display:none;' : '') + '">';
            html += '    <div class="form-group"><label class="form-label">投稿内容</label>';
            html += '        <textarea class="activity-textarea" id="submitContent" placeholder="粘贴你的作品链接或直接输入文字投稿..." style="min-height:100px;"></textarea></div>';
            html += '    <button class="btn-primary" onclick="submitWork()">提交投稿</button>';
            html += '</div>';
            html += '<div style="margin-top:16px;"><h4 style="font-size:0.95rem;margin-bottom:12px;"><i class="fas fa-images"></i> 作品墙</h4>';
            html += '    <div class="work-grid" id="worksGrid"><div class="loading" style="padding:20px;">加载中...</div></div>';
            html += '</div>';
            return html;
        }

        // 打卡
        function renderCheckin(a, participated) {
            var html = '<div style="text-align:center;padding:8px 0 4px;">';
            html += '    <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">' + (participated ? '✅ 今日已打卡' : '✅ 打卡签到') + '</button>';
            html += '</div>';
            html += '<div class="action-hint" style="text-align:center;">每天可打卡一次，坚持就是胜利！</div>';
            html += '<div id="checkinCalendar" style="margin-top:16px;"><div class="loading" style="padding:20px;">加载中...</div></div>';
            return html;
        }

        // 报名（按 config.fields 动态生成表单）
        function renderSignup(a, participated) {
            var config = a.config || {};
            var fields = (config.fields && config.fields.length > 0) ? config.fields : [{ name: '姓名', type: 'text', required: true }];
            var maxCount = config.max_count || 0;
            var count = a.participant_count || 0;
            var remain = maxCount > 0 ? Math.max(0, maxCount - count) : '不限';

            var html = '';
            html += '<div class="action-hint" style="margin-bottom:12px;">👥 已报名 ' + count + ' 人' + (maxCount > 0 ? ' / ' + maxCount + ' 人' : '') + '，剩余名额 ' + remain + '</div>';

            html += '<div id="signupForm' + (participated ? '" style="display:none;' : '') + '">';
            fields.forEach(function(f, i) {
                var label = escapeHtml(f.name) + (f.required ? ' <span style="color:#EF4444;">*</span>' : '');
                if (f.type === 'select' && f.options && f.options.length > 0) {
                    var opts = '<option value="">请选择</option>' + f.options.map(function(o) { return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + '</option>'; }).join('');
                    html += '    <div class="form-group"><label class="form-label">' + label + '</label><select class="activity-select" id="signupField_' + i + '">' + opts + '</select></div>';
                } else {
                    html += '    <div class="form-group"><label class="form-label">' + label + '</label><input class="activity-input" id="signupField_' + i + '" placeholder="请输入' + escapeHtml(f.name) + '"></div>';
                }
            });
            html += '    <button class="btn-primary" onclick="submitSignup()">确认报名</button>';
            html += '</div>';
            html += '<div id="signupList" style="margin-top:16px;"><h4 style="font-size:0.95rem;margin-bottom:12px;"><i class="fas fa-clipboard-list"></i> 已报名名单</h4>';
            html += '    <div id="signupNames" style="color:#6B7280;font-size:0.85rem;">加载中...</div></div>';
            return html;
        }

        // 校际PK阵营展示 + 自定义申请
        function renderPk(a, participated) {
            var config = a.config || {};
            var factions = config.factions || [];
            var pendingFactions = config.pending_factions || [];
            var myPending = !!(token && currentUserId && pendingFactions.some(function(f) { return f.user_id === currentUserId; }));

            var html = '';
            html += '<div style="margin-bottom:16px;">';
            if (factions.length === 0) {
                html += '<div class="action-hint">暂无阵营，快来申请创建你的学校阵营！</div>';
            }
            factions.forEach(function(f) {
                var logo = f.logo_url ? '<img class="pk-faction-logo" src="' + getFullUrl(f.logo_url) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;pk-faction-logo&quot;>🏫</div>\'">' : '<div class="pk-faction-logo">🏫</div>';
                html += '<div class="pk-faction-card">' + logo + '<div><div class="pk-faction-name">' + escapeHtml(f.name) + '</div><div class="pk-faction-desc">' + escapeHtml(f.description || '') + '</div></div></div>';
            });
            html += '</div>';

            if (myPending) {
                html += '<div class="participate-status">⏳ 你的阵营申请审核中</div>';
            } else {
                html += '<div style="text-align:center;margin-bottom:16px;"><button class="btn-primary" onclick="openFactionApply()" style="padding:10px 28px;">+ 添加我的学校</button></div>';
                html += '<div id="factionApplyForm" style="display:none;margin-top:12px;padding:16px;background:#F9FAFB;border-radius:12px;">';
                html += '    <div class="form-group"><label class="form-label">学校名称 *</label><input class="activity-input" id="factionName" placeholder="如：深圳市高级中学"></div>';
                html += '    <div class="form-group"><label class="form-label">Logo</label>';
                html += '        <div onclick="document.getElementById(\'factionLogoInput\').click()" style="width:80px;height:80px;border:2px dashed #D1D5DB;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;background:white;">';
                html += '            <span id="factionLogoPlaceholder" style="font-size:1.5rem;">📷</span>';
                html += '            <img id="factionLogoPreview" src="" style="display:none;width:100%;height:100%;object-fit:cover;">';
                html += '            <input type="file" id="factionLogoInput" accept="image/*" style="display:none;" onchange="uploadFactionLogo(this)">';
                html += '        </div>';
                html += '    </div>';
                html += '    <div class="form-group"><label class="form-label">简介</label><textarea class="activity-textarea" id="factionDesc" placeholder="介绍一下你的学校/阵营..."></textarea></div>';
                html += '    <button class="btn-primary" onclick="submitFactionApply()" style="padding:10px 28px;">提交申请</button>';
                html += '</div>';
            }
            return html;
        }

        function openFactionApply() {
            var form = document.getElementById('factionApplyForm');
            if (form) form.style.display = 'block';
        }

        async function uploadFactionLogo(input) {
            var file = input.files[0];
            if (!file) return;
            var formData = new FormData();
            formData.append('file', file);
            try {
                var res = await fetch(window.API_BASE + '/upload/file', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
                var data = await res.json();
                if (res.ok && data.url) {
                    window._factionLogoUrl = data.url;
                    document.getElementById('factionLogoPreview').src = getFullUrl(data.url);
                    document.getElementById('factionLogoPreview').style.display = 'block';
                    document.getElementById('factionLogoPlaceholder').style.display = 'none';
                } else {
                    alert(data.error || (res.status === 403 ? '上传图片需通过二级入站考试' : '上传失败'));
                }
            } catch (e) { alert('上传失败'); }
        }

        async function submitFactionApply() {
            if (!token) { alert('请先登录'); return; }
            var name = document.getElementById('factionName').value.trim();
            var desc = document.getElementById('factionDesc').value.trim();
            var logo_url = window._factionLogoUrl || '';
            if (!name) { alert('请输入学校名称'); return; }
            var res = await fetch(window.API_BASE + '/activities/' + activityId + '/custom-faction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ name: name, logo_url: logo_url, description: desc })
            });
            if (res.ok) {
                window._factionLogoUrl = '';
                alert('申请已提交，请等待管理员审核');
                loadActivity();
            } else {
                var d = await res.json();
                alert(d.error || '提交失败');
            }
        }

        // 答题
        function renderQuiz(a, participated) {
            var questions = (a.config && a.config.questions) || [];
            if (questions.length === 0) return '<div class="action-hint">暂未设置题目</div>';
            var html = '<div id="quizForm' + (participated ? '" style="display:none;' : '') + '">';
            questions.forEach(function(q, i) {
                var opts = q.options || [];
                html += '    <div class="quiz-question">';
                html += '        <div class="quiz-question-title">' + (i + 1) + '. ' + escapeHtml(q.question) + '</div>';
                opts.forEach(function(opt, j) {
                    html += '        <label class="quiz-option"><input type="radio" name="q' + i + '" value="' + j + '"> ' + escapeHtml(opt) + '</label>';
                });
                html += '    </div>';
            });
            html += '    <button class="btn-primary" onclick="submitQuiz()">提交答卷</button>';
            html += '</div>';
            return html;
        }

        function renderDefault(a, participated) {
            return '<div class="form-group"><label class="form-label">报名信息</label><textarea class="activity-textarea" id="defaultContent" placeholder="输入你的参与信息..."></textarea></div>' +
                   '<button class="btn-primary" onclick="submitDefault()">确认参与</button>';
        }

        // ---------- 参与动作 ----------
        async function participate(action_type, content) {
            if (!token) { alert('请先登录'); return false; }
            var res = await fetch(window.API_BASE + '/activities/' + activityId + '/participate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ action_type: action_type, content: content || '' })
            });
            if (res.ok) return true;
            var d = await res.json();
            alert(d.error || '操作失败');
            return false;
        }

        // 投票已改为确认制：见 selectVoteOption / openVoteConfirm / confirmVote

        async function submitWork() {
            var content = document.getElementById('submitContent').value.trim();
            if (!content) { alert('请输入投稿内容'); return; }
            if (await participate('submit', content)) { alert('投稿成功！'); loadActivity(); }
        }

        async function doCheckin() {
            var btn = document.getElementById('checkinBtn');
            if (btn && btn.classList.contains('done')) return;
            if (await participate('checkin', new Date().toLocaleString())) { alert('打卡成功！坚持就是胜利！'); loadActivity(); }
        }

        async function submitSignup() {
            if (!token) { alert('请先登录'); return; }
            var config = (activityData && activityData.config) || {};
            var fields = (config.fields && config.fields.length > 0) ? config.fields : [{ name: '姓名', type: 'text', required: true }];
            var data = {};
            var valid = true;
            fields.forEach(function(f, i) {
                var el = document.getElementById('signupField_' + i);
                var val = el ? el.value.trim() : '';
                data[f.name] = val;
                if (f.required && !val) {
                    valid = false;
                    alert('请填写：' + f.name);
                }
            });
            if (!valid) return;
            if (await participate('signup', JSON.stringify({ fields: data }))) {
                alert('报名成功！'); loadActivity();
            }
        }

        async function submitQuiz() {
            var questions = (activityData.config && activityData.config.questions) || [];
            var answers = [];
            var complete = true;
            questions.forEach(function(q, i) {
                var sel = document.querySelector('input[name="q' + i + '"]:checked');
                if (!sel) complete = false;
                answers.push(sel ? parseInt(sel.value) : null);
            });
            if (!complete) { alert('请完成所有题目后再提交'); return; }
            if (await participate('quiz', JSON.stringify({ answers: answers }))) { alert('答卷提交成功！'); loadActivity(); }
        }

        async function submitDefault() {
            var content = document.getElementById('defaultContent').value.trim();
            if (!content) { alert('请输入参与信息'); return; }
            if (await participate('participate', content)) { alert('参与成功！'); loadActivity(); }
        }

        // ---------- 动态数据加载 ----------
        async function loadParticipationData(a) {
            if (a.type === 'submit') loadWorks(a.id);
            if (a.type === 'checkin') loadCheckinCalendar(a.id);
            if (a.type === 'signup') loadSignupList(a.id);
        }

        // 作品墙
        async function loadWorks(activityId) {
            var grid = document.getElementById('worksGrid');
            if (!grid) return;
            try {
                var res = await fetch(window.API_BASE + '/activities/' + activityId + '/participants?action_type=submit');
                var data = await res.json();
                var works = data.participants || [];
                if (works.length === 0) { grid.innerHTML = '<div class="action-hint" style="grid-column:1/-1;">暂无投稿，快来抢沙发！</div>'; return; }
                grid.innerHTML = works.map(function(w) {
                    var avatar = w.avatar_url ? '<img class="work-avatar" src="' + getFullUrl(w.avatar_url) + '" alt="">' : '<div class="work-avatar" style="background:#EFF6FF;color:#1E88E5;display:flex;align-items:center;justify-content:center;"><i class="fas fa-user"></i></div>';
                    return '<div class="work-card"><div class="work-card-header">' + avatar + '<div><div class="work-author">' + escapeHtml(w.nickname) + '</div><div class="work-time">' + formatShortDate(w.created_at) + '</div></div></div><div class="work-content">' + escapeHtml(w.content) + '</div></div>';
                }).join('');
            } catch (e) { grid.innerHTML = '<div class="action-hint">加载失败</div>'; }
        }

        // 打卡日历
        async function loadCheckinCalendar(activityId) {
            var cal = document.getElementById('checkinCalendar');
            if (!cal) return;
            try {
                var res = await fetch(window.API_BASE + '/activities/' + activityId + '/participants?action_type=checkin&limit=500');
                var data = await res.json();
                var list = data.participants || [];
                var myDates = [];
                if (currentUserId) {
                    list.forEach(function(p) { if (p.user_id === currentUserId) { var d = new Date(p.created_at); myDates.push(d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate()); } });
                }
                var now = new Date();
                var year = now.getFullYear(), month = now.getMonth();
                var firstDay = new Date(year, month, 1);
                var startWeekday = firstDay.getDay();
                var daysInMonth = new Date(year, month + 1, 0).getDate();
                var html = '';
                ['日','一','二','三','四','五','六'].forEach(function(w) { html += '<div class="checkin-weekday">' + w + '</div>'; });
                for (var i = 0; i < startWeekday; i++) html += '<div class="checkin-day empty"></div>';
                for (var d = 1; d <= daysInMonth; d++) {
                    var key = year + '-' + (month + 1) + '-' + d;
                    var done = myDates.indexOf(key) !== -1;
                    var isToday = d === now.getDate();
                    html += '<div class="checkin-day' + (done ? ' done' : '') + (isToday ? ' today' : '') + '" title="' + key + (done ? ' 已打卡' : '') + '">' + d + '</div>';
                }
                cal.innerHTML = html;
            } catch (e) { cal.innerHTML = '<div class="action-hint">加载失败</div>'; }
        }

        // 报名名单
        async function loadSignupList(activityId) {
            var box = document.getElementById('signupNames');
            if (!box) return;
            try {
                var res = await fetch(window.API_BASE + '/activities/' + activityId + '/participants?action_type=signup');
                var data = await res.json();
                var list = data.participants || [];
                box.innerHTML = list.length > 0
                    ? '👥 ' + list.map(function(p) { return escapeHtml(p.nickname); }).join('、')
                    : '暂无报名';
            } catch (e) { box.innerHTML = '加载失败'; }
        }

        // 排行榜
        async function loadLeaderboard(activityId) {
            var box = document.getElementById('leaderboardList');
            try {
                var res = await fetch(window.API_BASE + '/activities/' + activityId + '/leaderboard');
                var data = await res.json();
                var list = data.leaderboard || [];
                if (list.length === 0) { box.innerHTML = '<div class="action-hint">暂无排行数据</div>'; return; }
                box.innerHTML = list.map(function(u, i) {
                    var rank = i + 1;
                    var rankClass = rank === 1 ? ' rank-1' : rank === 2 ? ' rank-2' : rank === 3 ? ' rank-3' : '';
                    var avatar = u.avatar_url ? '<img class="leaderboard-avatar" src="' + getFullUrl(u.avatar_url) + '" alt="">' : '<div class="leaderboard-avatar" style="display:flex;align-items:center;justify-content:center;color:#1E88E5;"><i class="fas fa-user"></i></div>';
                    return '<div class="leaderboard-item"><div class="leaderboard-rank' + rankClass + '">' + rank + '</div>' + avatar +
                           '<div class="leaderboard-info"><div class="leaderboard-name">' + escapeHtml(u.nickname) + '</div><div class="leaderboard-score">' + u.score + ' 次参与</div></div></div>';
                }).join('');
            } catch (e) { box.innerHTML = '<div class="action-hint">加载失败</div>'; }
        }

        // ---------- 海报生成 ----------
        var posterDataUrl = '';
        function showPoster() {
            if (!activityData) return;
            posterDataUrl = generatePoster(activityData);
            document.getElementById('posterImg').src = posterDataUrl;
            document.getElementById('posterModal').style.display = 'flex';
        }
        function closePosterModal() { document.getElementById('posterModal').style.display = 'none'; }
        function downloadPoster() {
            var a = document.createElement('a');
            a.href = posterDataUrl;
            a.download = '活动海报_' + (activityData ? activityData.id : '') + '.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
        function shareActivity() {
            var url = location.origin + '/activity.html?id=' + activityId;
            if (navigator.share) {
                navigator.share({ title: activityData ? activityData.title : '社区活动', text: '来看看深圳高中生社区的精彩活动吧！', url: url }).catch(function() {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function() { alert('活动链接已复制，快去分享吧！'); });
            } else {
                alert('活动链接：' + url);
            }
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            var chars = String(text).split('');
            var line = '';
            for (var i = 0; i < chars.length; i++) {
                line += chars[i];
                if (ctx.measureText(line).width > maxWidth) {
                    ctx.fillText(line.slice(0, -1), x, y);
                    line = chars[i];
                    y += lineHeight;
                }
            }
            ctx.fillText(line, x, y);
            return y + lineHeight;
        }

        function generatePoster(a) {
            var canvas = document.createElement('canvas');
            canvas.width = 600; canvas.height = 880;
            var ctx = canvas.getContext('2d');
            var grad = ctx.createLinearGradient(0, 0, 600, 880);
            grad.addColorStop(0, '#dc2626');
            grad.addColorStop(1, '#7c3aed');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 600, 880);

            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.font = 'bold 150px sans-serif';
            ctx.fillText('SZHS', 20, 200);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText('🎉 深圳高中生社区 · 活动', 40, 90);

            ctx.font = 'bold 44px sans-serif';
            wrapText(ctx, a.title, 40, 260, 520, 60);

            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.font = '26px sans-serif';
            ctx.fillText('⏰ ' + formatDate(a.start_time) + ' ~ ' + formatDate(a.end_time), 40, 600);

            ctx.font = '26px sans-serif';
            ctx.fillText('👥 ' + (a.participant_count || 0) + ' 人已参与', 40, 650);
            if (a.reward_coins > 0) ctx.fillText('🪙 奖励 ' + a.reward_coins + ' 鹏城币', 40, 700);
            else if (a.reward_badge) ctx.fillText('🏅 限定勋章：' + a.reward_badge, 40, 700);

            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '22px sans-serif';
            ctx.fillText('szhss-community.top/activity.html?id=' + a.id, 40, 780);

            return canvas.toDataURL('image/png');
        }

        // 模态框点击遮罩关闭
        document.getElementById('posterModal')?.addEventListener('click', function(e) {
            if (e.target === this) closePosterModal();
        });
        document.getElementById('voteConfirmBtn')?.addEventListener('click', confirmVote);
        document.getElementById('voteConfirmModal')?.addEventListener('click', function(e) {
            if (e.target === this) closeVoteConfirm();
        });

        loadActivity();
    </script>

    </footer>
    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // 已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    // 根据浏览器环境设置不同文案
                    const ua = navigator.userAgent;
                    const isWeChat = /MicroMessenger/i.test(ua);
                    const isQQ = /QQ\//i.test(ua);
                    const isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua) && !isWeChat && !isQQ;

                    const textEl = document.getElementById('iosBannerText');
                    let bannerText = '';

                    if (isWeChat || isQQ) {
                        bannerText = '请点击右上角“...” → 选择“在浏览器中打开” → 在 Safari 中点击底部分享按钮 → “添加到主屏幕”';
                    } else if (isSafari) {
                        bannerText = '点击 Safari 底部的分享按钮（方框+向上箭头）→ 选择“添加到主屏幕”';
                    } else {
                        bannerText = '请在系统浏览器中打开此页面，然后通过浏览器菜单“添加到主屏幕”';
                    }

                    if (textEl) textEl.textContent = bannerText;

                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
