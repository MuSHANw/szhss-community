    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif; background-color: #F5F7FA; color: #1f2d3d; line-height: 1.5; padding-top: 60px; margin-left: 260px; transition: margin-left 0.3s ease; }
        body.sidebar-collapsed { margin-left: 70px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .top-bar-container { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; border-bottom: 1px solid #e9ecef; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
        .top-bar { display: flex; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 20px; color: #4a5568; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1E88E5; text-decoration: none; margin-right: auto; }
        .search-area { display: flex; align-items: center; background: #f1f3f5; border-radius: 24px; padding: 4px 12px; width: 260px; }
        .search-area input { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; }
        .search-area button { background: transparent; border: none; cursor: pointer; color: #6c757d; }
        .about-link { margin-left: 16px; color: #4a5568; text-decoration: none; font-size: 0.95rem; transition: color 0.2s; white-space: nowrap; }
        .about-link:hover { color: #1E88E5; }
        .about-link i { margin-right: 4px; }
        .notifications-icon { position: relative; margin-left: 16px; font-size: 1.4rem; color: #6c757d; text-decoration: none; display: inline-flex; align-items: center; }
        .notif-badge { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 260px; background: white; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 99; overflow-x: hidden; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-user-info, #sidebar.collapsed .sidebar-link span { display: none; }
        #sidebar.collapsed .sidebar-logout { font-size: 0; padding: 8px; }
        #sidebar.collapsed .sidebar-logout::before { content: "🚪"; font-size: 1.2rem; }
        .sidebar-user { display: flex; align-items: center; padding: 20px 16px; border-bottom: 1px solid #eef2f6; cursor: pointer; }
        .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 12px; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-avatar i { font-size: 48px; color: #1E88E5; }
        .sidebar-user-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .sidebar-nickname { font-weight: 600; font-size: 1rem; }
        .sidebar-email { font-size: 0.7rem; color: #6c757d; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 16px 0; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: #4a5568; transition: background 0.2s; white-space: nowrap; }
        .sidebar-link i { width: 28px; font-size: 1.2rem; text-align: center; }
        .sidebar-link span { margin-left: 12px; }
        .sidebar-link:hover { background: #f0f2f5; }
        .sidebar-link.active { background: #e9f0fe; color: #1E88E5; }
        .notif-dot { color: #e53e3e; font-size: 0.7rem; margin-left: 4px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #eef2f6; }
        .sidebar-logout { width: 100%; background: none; border: none; padding: 8px; cursor: pointer; color: #e53e3e; border-radius: 8px; text-align: center; }
        .sidebar-logout:hover { background: #ffe5e5; }

        /* 编辑器主体 */
        .post-wrapper { max-width: 900px; margin: 32px auto; }
        .page-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 24px; }

        /* 草稿提示 */
        .draft-notice { display:none; background:#FFF3CD; padding:12px 16px; border-radius:12px; margin-bottom:16px; align-items:center; flex-wrap:wrap; gap:8px; font-size:0.9rem; }
        .draft-notice button { background:#1E88E5; color:white; border:none; padding:6px 16px; border-radius:20px; cursor:pointer; font-size:0.85rem; }
        .draft-notice button:last-child { background:#e2e8f0; color:#4a5568; }

        /* 表单 */
        .form-card { background:white; border-radius:16px; padding:24px; border:1px solid #eef2f6; margin-bottom:16px; }
        .form-group { margin-bottom:16px; }
        .form-group:last-child { margin-bottom:0; }
        .form-group label { display:block; font-weight:600; margin-bottom:6px; font-size:0.9rem; color:#374151; }
        #postTitle { width:100%; padding:12px 16px; border:1px solid #e2e8f0; border-radius:12px; font-size:1.2rem; outline:none; font-family:inherit; }
        #postTitle:focus { border-color:#1E88E5; box-shadow:0 0 0 3px rgba(30,136,229,0.1); }
        #postCategory { width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:12px; font-size:0.95rem; outline:none; background:white; font-family:inherit; }
        #postCategory:focus { border-color:#1E88E5; }

        /* 预设标签 */
        .preset-tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
        .preset-tag { padding:6px 16px; border-radius:20px; background:#F3F4F6; color:#6B7280; font-size:0.85rem; cursor:pointer; transition:all 0.2s; border:1px solid transparent; user-select:none; }
        .preset-tag:hover { background:#EFF6FF; color:#1E88E5; border-color:#1E88E5; }
        .preset-tag.active { background:#1E88E5; color:white; border-color:#1E88E5; }

        /* 标签显示 */
        .tags-display { display:flex; flex-wrap:wrap; gap:6px; padding:8px 0; min-height:36px; }
        .tag-pill { display:inline-flex; align-items:center; gap:4px; background:#EFF6FF; color:#1E88E5; padding:4px 12px; border-radius:20px; font-size:0.85rem; }
        .tag-pill button { background:none; border:none; color:#1E88E5; cursor:pointer; font-size:1.1rem; padding:0; line-height:1; }
        .tag-pill button:hover { color:#e53e3e; }
        #customTagInput { border:none; outline:none; font-size:0.9rem; padding:6px 0; flex:1; min-width:120px; font-family:inherit; }

        /* 编辑器 */
        .editor-wrapper { border:1px solid #e2e8f0; border-radius:12px; overflow:hidden; background:white; }
        #editor-container .ql-editor { min-height:320px; font-size:1rem; line-height:1.7; padding:16px 20px; }
        #editor-container .ql-toolbar { border:none; border-bottom:1px solid #eef2f6; background:#FAFBFC; padding:8px 12px; }
        #editor-container .ql-container { border:none; }
        #editor-container img { max-width:100%; border-radius:8px; margin:8px 0; }
        #editor-container video { max-width:100%; border-radius:8px; margin:8px 0; }
        #editor-container .ql-editor.ql-blank::before { color:#9CA3AF; font-style:normal; }

        /* 操作按钮 */
        .action-bar { display:flex; gap:12px; margin-top:16px; align-items:center; flex-wrap:wrap; }
        .btn-primary { background:#1E88E5; color:white; border:none; padding:12px 32px; border-radius:40px; font-size:1rem; font-weight:600; cursor:pointer; transition:background 0.2s; }
        .btn-primary:hover { background:#1565C0; }
        .btn-secondary { background:#f0f2f5; color:#4a5568; border:none; padding:12px 24px; border-radius:40px; font-size:1rem; cursor:pointer; transition:background 0.2s; }
        .btn-secondary:hover { background:#e2e6ea; }
        .save-hint { font-size:0.8rem; color:#9CA3AF; margin-left:auto; }

        @media (max-width: 768px) {
            body { margin-left:0; }
            #sidebar { transform:translateX(-100%); transition:transform 0.3s ease; width:260px !important; }
            #sidebar.open-mobile { transform:translateX(0); }
            .search-area { width:34px; }
            .post-wrapper { margin:16px; }
            .form-card { padding:16px; }
            #editor-container .ql-editor { min-height:200px; font-size:16px; }
            .action-bar { flex-direction:column; }
            .btn-primary, .btn-secondary { width:100%; text-align:center; }
            .save-hint { margin-left:0; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script>
        window.API_BASE = window.API_BASE || '/api';
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = '/login.html'; }

        // ---------- 侧边栏等通用 ----------
        var sidebar = document.getElementById('sidebar'), toggleBtn = document.getElementById('menuToggle'), body = document.getElementById('appBody');
        if (localStorage.getItem('sidebarExpanded') !== 'false') { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); }
        else { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); }
        toggleBtn.addEventListener('click', function() {
            var e = !sidebar.classList.contains('collapsed');
            if (e) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','false'); }
            else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','true'); }
        });
        async function updateSidebarUser() {
            try { var res = await fetch(window.API_BASE+'/me', { headers: { 'Authorization': 'Bearer '+token } }); if (res.status===401) { localStorage.removeItem('token'); window.location.href='/login.html'; return; } if (res.ok) { var u = await res.json(); document.getElementById('sidebarNickname').innerText = u.nickname||'用户'; document.getElementById('sidebarEmail').innerText = u.email||''; document.getElementById('sidebarAvatar').innerHTML = u.avatar_url ? '<img src="'+u.avatar_url+'" alt="头像">' : '<i class="fas fa-user-circle"></i>'; } } catch(e) {}
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', function() { window.location.href='/profile.html'; });
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', function() { localStorage.removeItem('token'); window.location.href='/login.html'; });
        async function updateNotifDot() {
            if (!token) return;
            try { var res = await fetch(window.API_BASE+'/notifications?page=1&limit=1', { headers: { 'Authorization': 'Bearer '+token } }); var d = await res.json(); var cnt = d.unreadCount||0; var badge = document.getElementById('notifBadge'); var dot = document.getElementById('sidebarNotifDot'); if (badge) { badge.style.display = cnt>0?'flex':'none'; badge.innerText = cnt>99?'99+':cnt; } if (dot) dot.style.display = cnt>0?'inline-block':'none'; } catch(e) {}
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);
        document.getElementById('searchBtn')?.addEventListener('click', function() { var q = document.getElementById('searchInput').value.trim(); if (q) window.location.href='/search.html?q='+encodeURIComponent(q); else alert('请输入搜索关键词'); });
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('searchBtn').click(); });

        // ---------- Quill 编辑器 ----------
        var quill = new Quill('#editor-container', {
            theme: 'snow',
            placeholder: '在这里写下你的内容...支持文字排版、图片、视频等',
            modules: {
                toolbar: {
                    container: [
                        ['bold', 'italic', 'underline', 'strike'],
                        ['blockquote', 'code-block'],
                        [{ 'header': 1 }, { 'header': 2 }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        [{ 'script': 'sub'}, { 'script': 'super' }],
                        [{ 'indent': '-1'}, { 'indent': '+1' }],
                        [{ 'size': ['small', false, 'large', 'huge'] }],
                        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'align': [] }],
                        ['link', 'image', 'video'],
                        ['clean']
                    ],
                    handlers: {
                        'image': imageHandler,
                        'video': videoHandler
                    }
                }
            }
        });

        // ---------- 图片上传 ----------
        function imageHandler() {
            var input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();
            input.onchange = function() {
                var file = input.files[0];
                if (!file) return;
                uploadAndInsert(file, 'image');
            };
        }

        // ---------- 视频上传 ----------
        function videoHandler() {
            var input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'video/*');
            input.click();
            input.onchange = function() {
                var file = input.files[0];
                if (!file) return;
                uploadAndInsert(file, 'video');
            };
        }

        // ---------- 上传并插入 ----------
        async function uploadAndInsert(file, type) {
            var maxSize = type === 'video' ? 200 * 1024 * 1024 : 50 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('文件过大！' + (type === 'video' ? '视频不能超过 200MB' : '图片不能超过 50MB'));
                return;
            }

            var fd = new FormData();
            fd.append('file', file);
            showUploading();

            try {
                var res = await fetch(window.API_BASE + '/upload/file', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: fd
                });
                var data = await res.json();
                if (res.ok && data.url) {
                    var range = quill.getSelection(true);
                    if (type === 'image') {
                        quill.insertEmbed(range.index, 'image', data.url);
                    } else {
                        quill.insertEmbed(range.index, 'video', data.url);
                    }
                    quill.setSelection(range.index + 1);
                } else {
                    if (data.quiz_required) {
                        hideUploading();
                        if (confirm('⚠️ 请先通过第二级入站考试才能上传文件\n点击确定前往答题页面')) {
                            window.location.href = data.quiz_url || '/quiz.html?level=2';
                        }
                        return;
                    }
                    alert(data.error || '上传失败');
                }
            } catch (err) {
                alert('上传失败，请重试');
            } finally {
                hideUploading();
            }
        }

        function showUploading() {
            var el = document.getElementById('uploadToast');
            if (!el) { el = document.createElement('div'); el.id = 'uploadToast'; el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:16px 24px;border-radius:12px;z-index:9999;font-size:1rem;'; el.textContent = '⏳ 上传中...'; document.body.appendChild(el); }
            el.style.display = 'block';
        }
        function hideUploading() { var el = document.getElementById('uploadToast'); if (el) el.style.display = 'none'; }

        // ---------- 标签系统 ----------
        var selectedTags = [];

        function getCurrentTags() { return selectedTags; }

        function setTagsFromString(tagString) {
            if (!tagString) return;
            selectedTags = tagString.split(',').filter(function(t) { return t.trim(); });
            syncTagUI();
        }

        function syncTagUI() {
            // 标签显示
            var container = document.getElementById('tagsDisplay');
            container.innerHTML = selectedTags.map(function(tag) {
                return '<span class="tag-pill">' + escapeHtml(tag) + ' <button onclick="removeTag(\'' + escapeHtml(tag) + '\')">&times;</button></span>';
            }).join('');
            document.getElementById('postTags').value = selectedTags.join(',');
            // 预设标签状态
            document.querySelectorAll('.preset-tag').forEach(function(btn) {
                if (selectedTags.indexOf(btn.dataset.tag) !== -1) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function toggleTag(tag) {
            var idx = selectedTags.indexOf(tag);
            if (idx !== -1) selectedTags.splice(idx, 1);
            else selectedTags.push(tag);
            syncTagUI();
        }

        function removeTag(tag) {
            var idx = selectedTags.indexOf(tag);
            if (idx !== -1) selectedTags.splice(idx, 1);
            syncTagUI();
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m==='&') return '&amp;'; if (m==='<') return '&lt;'; if (m==='>') return '&gt;'; return m; }); }

        document.querySelectorAll('.preset-tag').forEach(function(el) {
            el.addEventListener('click', function() { toggleTag(el.dataset.tag); });
        });

        document.getElementById('customTagInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                var tag = e.target.value.trim().replace(/,/g, '');
                if (tag && selectedTags.indexOf(tag) === -1) { selectedTags.push(tag); syncTagUI(); }
                e.target.value = '';
            }
        });

        // ---------- 草稿箱（多草稿）----------
        var currentDraftId = null;

        // 检查 URL 参数，加载指定草稿
        (function() {
            var draftId = new URLSearchParams(window.location.search).get('draft');
            if (draftId) { loadDraftById(draftId); }
        })();

        function getAllDrafts() {
            try { return JSON.parse(localStorage.getItem('post_drafts')) || []; }
            catch(e) { return []; }
        }

        function saveDraftsToStorage(drafts) {
            try { localStorage.setItem('post_drafts', JSON.stringify(drafts)); } catch(e) {}
        }

        var autoSaveTimer;
        function startAutoSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(saveDraft, 30000);
        }

        function saveDraft() {
            var title = document.getElementById('postTitle').value;
            var content = quill.root.innerHTML;
            if (!title && (!content || content === '<p><br></p>' || content === '<p></p>')) return;

            var drafts = getAllDrafts();
            if (currentDraftId) {
                // 更新已有草稿
                var idx = drafts.findIndex(function(d) { return d.id === currentDraftId; });
                if (idx !== -1) {
                    drafts[idx].title = title;
                    drafts[idx].content = content;
                    drafts[idx].category = document.getElementById('postCategory').value;
                    drafts[idx].tags = selectedTags.join(',');
                    drafts[idx].savedAt = new Date().toLocaleString();
                }
            } else {
                // 新建草稿
                currentDraftId = Date.now().toString();
                drafts.push({
                    id: currentDraftId,
                    title: title,
                    content: content,
                    category: document.getElementById('postCategory').value,
                    tags: selectedTags.join(','),
                    savedAt: new Date().toLocaleString()
                });
            }
            saveDraftsToStorage(drafts);
            showSaveIndicator();
        }

        function loadDraftById(draftId) {
            var drafts = getAllDrafts();
            var data = drafts.find(function(d) { return d.id === draftId; });
            if (!data) return;
            currentDraftId = draftId;
            document.getElementById('postTitle').value = data.title || '';
            quill.root.innerHTML = data.content || '';
            document.getElementById('postCategory').value = data.category || '综合';
            selectedTags = [];
            if (data.tags) setTagsFromString(data.tags);
        }

        function removeCurrentDraft() {
            if (!currentDraftId) return;
            var drafts = getAllDrafts();
            drafts = drafts.filter(function(d) { return d.id !== currentDraftId; });
            saveDraftsToStorage(drafts);
            currentDraftId = null;
        }

        function showSaveIndicator() {
            var el = document.getElementById('saveToast');
            if (!el) { el = document.createElement('div'); el.id = 'saveToast'; el.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:white;padding:8px 16px;border-radius:20px;z-index:9999;font-size:0.85rem;transition:opacity 0.3s;pointer-events:none;'; el.textContent = '💾 草稿已保存'; document.body.appendChild(el); }
            el.style.opacity = '1'; el.style.display = 'block';
            setTimeout(function() { el.style.opacity = '0'; }, 1500);
        }

        document.getElementById('postTitle').addEventListener('input', startAutoSave);
        quill.on('text-change', startAutoSave);
        document.getElementById('postCategory').addEventListener('change', startAutoSave);

        document.getElementById('saveDraftBtn').addEventListener('click', function() { saveDraft(); showSaveIndicator(); });

        // ---------- 草稿恢复提示 ----------
        function checkRecentDraft() {
            var drafts = getAllDrafts();
            if (drafts.length === 0) return;
            // 如果当前已通过 draft=id 加载了草稿，不重复提示
            if (currentDraftId) return;
            var latest = drafts[drafts.length - 1];
            if (latest.title || (latest.content && latest.content.replace(/<[^>]*>/g, '').trim())) {
                document.getElementById('draftNotice').style.display = 'flex';
                document.getElementById('draftTime').textContent = latest.savedAt || '';
            }
        }

        document.getElementById('restoreDraftBtn').addEventListener('click', function() {
            var drafts = getAllDrafts();
            if (drafts.length === 0) return;
            var latest = drafts[drafts.length - 1];
            currentDraftId = latest.id;
            document.getElementById('postTitle').value = latest.title || '';
            quill.root.innerHTML = latest.content || '';
            document.getElementById('postCategory').value = latest.category || '综合';
            selectedTags = [];
            if (latest.tags) setTagsFromString(latest.tags);
            document.getElementById('draftNotice').style.display = 'none';
            saveDraft();
        });

        document.getElementById('discardDraftBtn').addEventListener('click', function() {
            var drafts = getAllDrafts();
            if (drafts.length > 0) {
                var latest = drafts[drafts.length - 1];
                drafts = drafts.filter(function(d) { return d.id !== latest.id; });
                saveDraftsToStorage(drafts);
            }
            document.getElementById('draftNotice').style.display = 'none';
        });

        checkRecentDraft();

        // ---------- 从 HTML 内容中提取图片和视频 URL ----------
        function extractMedia(content) {
            var images = [], videos = [];
            var videoExt = /\.(mp4|webm|mov|m4v|ogv|ogg)$/i;
            var temp = document.createElement('div');
            temp.innerHTML = content;
            // 图片：若 src 实际是视频文件则归入 videos，避免视频被当图片
            temp.querySelectorAll('img').forEach(function(img) {
                if (img.src) {
                    if (videoExt.test(img.src)) videos.push(img.src);
                    else images.push(img.src);
                }
            });
            // 原生 video 标签
            temp.querySelectorAll('video').forEach(function(video) {
                if (video.src) videos.push(video.src);
            });
            // Quill 的 video 格式渲染为 <iframe class="ql-video" src="...">，需一并提取
            temp.querySelectorAll('iframe.ql-video, iframe[src*=".mp4"], iframe[src*=".webm"], iframe[src*=".mov"], iframe[src*=".m4v"], iframe[src*=".ogv"]').forEach(function(fr) {
                if (fr.src) videos.push(fr.src);
            });
            return { images: images, videos: videos };
        }

        // ---------- 发布帖子 ----------
        document.getElementById('submitBtn').addEventListener('click', async function() {
            var title = document.getElementById('postTitle').value.trim();
            var content = quill.root.innerHTML.trim();
            var category = document.getElementById('postCategory').value;

            if (!title) { alert('请输入标题'); return; }
            if (!content || content === '<p><br></p>' || content === '<p></p>') { alert('请输入内容'); return; }

            // 从 Quill 内容中提取图片和视频 URL
            var media = extractMedia(content);

            this.disabled = true;
            this.textContent = '⏳ 发布中...';

            try {
                var res = await fetch(window.API_BASE + '/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        category: category,
                        tags: selectedTags,
                        images: media.images,
                        videos: media.videos
                    })
                });
                var data = await res.json();
                if (res.ok) {
                    removeCurrentDraft();
                    window.location.href = '/post-detail.html?id=' + data.id;
                } else {
                    if (data && data.quiz_required) {
                        alert('⚠️ 请先通过入站答题才能发布帖子');
                        window.location.href = data.quiz_url || '/quiz.html';
                        return;
                    }
                    alert(data.error || '发布失败');
                    this.disabled = false;
                    this.textContent = '🚀 发布帖子';
                }
            } catch (err) {
                alert('发布失败，请检查网络');
                this.disabled = false;
                this.textContent = '🚀 发布帖子';
            }
        });
    </script>

    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // 已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    // 根据浏览器环境设置不同文案
                    const ua = navigator.userAgent;
                    const isWeChat = /MicroMessenger/i.test(ua);
                    const isQQ = /QQ\//i.test(ua);
                    const isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua) && !isWeChat && !isQQ;

                    const textEl = document.getElementById('iosBannerText');
                    let bannerText = '';

                    if (isWeChat || isQQ) {
                        bannerText = '请点击右上角“...” → 选择“在浏览器中打开” → 在 Safari 中点击底部分享按钮 → “添加到主屏幕”';
                    } else if (isSafari) {
                        bannerText = '点击 Safari 底部的分享按钮（方框+向上箭头）→ 选择“添加到主屏幕”';
                    } else {
                        bannerText = '请在系统浏览器中打开此页面，然后通过浏览器菜单“添加到主屏幕”';
                    }

                    if (textEl) textEl.textContent = bannerText;

                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
