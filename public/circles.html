    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
            background-color: #F5F7FA; color: #1f2d3d; line-height: 1.5;
            padding-top: 60px; margin-left: 260px; transition: margin-left 0.3s ease; min-height: 100vh; position: relative;
        }
        body.sidebar-collapsed { margin-left: 70px; }

        .bg-decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .bg-decorations .wave {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x;
            background-size: cover; opacity: 0.5;
        }
        .bg-decorations .circle { position: absolute; border-radius: 50%; background: rgba(30, 136, 229, 0.05); }
        .bg-decorations .circle1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-decorations .circle2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
        .bg-decorations .circle3 { width: 150px; height: 150px; top: 30%; right: 10%; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* ========== 顶部栏 ========== */
        .top-bar-container { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; border-bottom: 1px solid #e9ecef; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
        .top-bar { display: flex; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 20px; color: #4a5568; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1E88E5; text-decoration: none; margin-right: auto; }
        .search-area { display: flex; align-items: center; background: #f1f3f5; border-radius: 24px; padding: 4px 12px; width: 260px; }
        .search-area input { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; }
        .search-area button { background: transparent; border: none; cursor: pointer; color: #6c757d; }
        .about-link { margin-left: 16px; color: #4a5568; text-decoration: none; font-size: 0.95rem; transition: color 0.2s; white-space: nowrap; }
        .about-link:hover { color: #1E88E5; }
        .about-link i { margin-right: 4px; }
        .notifications-icon { position: relative; margin-left: 16px; font-size: 1.4rem; color: #6c757d; text-decoration: none; display: inline-flex; align-items: center; }
        .notif-badge { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

        /* ========== 侧边栏 ========== */
        #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 260px; background: white; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 99; overflow-x: hidden; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-user-info, #sidebar.collapsed .sidebar-link span { display: none; }
        .sidebar-user { display: flex; align-items: center; padding: 20px 16px; border-bottom: 1px solid #eef2f6; cursor: pointer; }
        .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 12px; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-avatar i { font-size: 48px; color: #1E88E5; }
        .sidebar-user-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .sidebar-nickname { font-weight: 600; font-size: 1rem; }
        .sidebar-email { font-size: 0.7rem; color: #6c757d; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 16px 0; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: #4a5568; transition: background 0.2s; white-space: nowrap; }
        .sidebar-link i { width: 28px; font-size: 1.2rem; text-align: center; }
        .sidebar-link span { margin-left: 12px; }
        .sidebar-link:hover { background: #f0f2f5; }
        .sidebar-link.active { background: #e9f0fe; color: #1E88E5; }
        .notif-dot { color: #e53e3e; font-size: 0.7rem; margin-left: 4px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #eef2f6; }
        .sidebar-logout { width: 100%; background: none; border: none; padding: 8px; cursor: pointer; color: #e53e3e; border-radius: 8px; text-align: center; }
        .sidebar-logout:hover { background: #ffe5e5; }

        /* ========== 轮播 ========== */
        .circle-carousel { position: relative; width: 100%; height: 280px; border-radius: 20px; overflow: hidden; margin: 24px 0; background: #1E88E5; }
        .carousel-track { display: flex; height: 100%; transition: transform 0.5s ease; }
        .carousel-slide { min-width: 100%; height: 100%; position: relative; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .carousel-slide::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); }
        .carousel-content { position: relative; z-index: 1; text-align: center; color: white; padding: 0 40px; }
        .carousel-logo { width: 60px; height: 60px; border-radius: 16px; border: 3px solid white; object-fit: cover; margin-bottom: 12px; display: inline-block; }
        .carousel-name { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
        .carousel-desc { font-size: 0.9rem; opacity: 0.9; margin-bottom: 12px; max-width: 400px; margin: 0 auto 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .carousel-stats { font-size: 0.85rem; opacity: 0.85; margin-bottom: 16px; }
        .carousel-stats span { margin: 0 10px; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: background 0.2s; z-index: 2; line-height: 40px; text-align: center; }
        .carousel-btn:hover { background: rgba(255,255,255,0.4); }
        .carousel-prev { left: 12px; }
        .carousel-next { right: 12px; }
        .carousel-dots { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
        .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: background 0.2s; }
        .carousel-dot.active { background: white; }

        /* ========== 动态流 ========== */
        .circle-activities { background: white; border-radius: 16px; padding: 20px; margin-bottom: 24px; border: 1px solid #eef2f6; }
        .circle-activities h3 { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }
        .activities-list { margin-top: 12px; }
        .activity-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #F3F4F6; cursor: pointer; transition: background 0.15s; border-radius: 8px; }
        .activity-item:hover { background: #F9FAFB; padding: 10px 12px; margin: 0 -12px; }
        .activity-item:last-child { border-bottom: none; }
        .activity-icon { font-size: 1.3rem; flex-shrink: 0; width: 32px; text-align: center; }
        .activity-info { flex: 1; min-width: 0; }
        .activity-circle-name { font-weight: 600; font-size: 0.9rem; }
        .activity-circle-name img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px; }
        .activity-text { font-size: 0.85rem; color: #6B7280; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .activity-time { font-size: 0.75rem; color: #9CA3AF; flex-shrink: 0; }

        /* ========== 搜索与分类 ========== */
        .search-sort-bar { margin-bottom: 24px; }
        .search-box { display: flex; margin-bottom: 12px; }
        .search-box input { flex: 1; padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 40px 0 0 40px; font-size: 0.95rem; background: white; outline: none; }
        .search-box input:focus { border-color: #1E88E5; }
        .search-box button { background: #1E88E5; color: white; border: none; padding: 0 20px; border-radius: 0 40px 40px 0; cursor: pointer; transition: background 0.2s; }
        .search-box button:hover { background: #0b5e8a; }

        .category-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .category-tab { padding: 6px 14px; border-radius: 20px; border: 1px solid #E5E7EB; background: white; cursor: pointer; font-size: 0.85rem; color: #6B7280; transition: all 0.2s; }
        .category-tab:hover { border-color: #1E88E5; color: #1E88E5; }
        .category-tab.active { background: #1E88E5; color: white; border-color: #1E88E5; }

        .sort-bar { display: flex; gap: 8px; flex-wrap: wrap; }
        .sort-btn { background: #f0f2f5; border: none; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .sort-btn.active { background: #1E88E5; color: white; }
        .sort-btn:hover { background: #e2e6ea; }

        /* ========== 圈子卡片 ========== */
        .circles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }

        .circle-card-new { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eef2f6; cursor: pointer; transition: all 0.3s; position: relative; }
        .circle-card-new:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.08); transform: translateY(-4px); }
        .card-cover { height: 100px; background-size: cover; background-position: center; position: relative; }
        .card-cover.no-cover { background: linear-gradient(135deg, #667eea, #764ba2); }
        .active-dot { position: absolute; top: 10px; left: 10px; width: 10px; height: 10px; background: #10B981; border-radius: 50%; border: 2px solid white; }
        .active-badge { position: absolute; top: 10px; left: 26px; font-size: 0.7rem; color: #10B981; font-weight: 600; }
        .card-logo { width: 50px; height: 50px; border-radius: 14px; object-fit: cover; position: absolute; bottom: -25px; left: 16px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card-body { padding: 30px 16px 16px; }
        .card-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
        .card-desc { font-size: 0.8rem; color: #6B7280; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-stats { display: flex; gap: 12px; font-size: 0.8rem; color: #9CA3AF; }

        /* ========== 创建圈子的横幅 ========== */
        .create-circle-banner { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); border-radius: 20px; padding: 24px 32px; display: flex; align-items: center; justify-content: space-between; margin-top: 0; margin-bottom: 32px; border: 2px dashed #BFDBFE; }
        .banner-text h3 { margin-bottom: 4px; font-size: 1.1rem; }
        .banner-text p { color: #6B7280; font-size: 0.9rem; }
        .btn-primary { background: #1E88E5; color: white; border: none; padding: 10px 24px; border-radius: 40px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .btn-primary:hover { background: #1565C0; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin: 32px 0; }
        .pagination button { background: #f0f2f5; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .pagination button:hover { background: #e2e6ea; }
        .pagination button.active { background: #1E88E5; color: white; }

        .loading, .error, .no-circles { text-align: center; padding: 60px 20px; background: white; border-radius: 16px; color: #6c757d; }

        .footer { background: white; border-top: 1px solid #e9ecef; padding: 20px 0; text-align: center; font-size: 0.75rem; color: #6c757d; }

        /* ========== 移动端 ========== */
        @media (max-width: 768px) {
            body { margin-left: 0; }
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; width: 260px !important; }
            #sidebar.open-mobile { transform: translateX(0); }
            .circle-carousel { height: 220px; border-radius: 12px; }
            .carousel-logo { width: 48px; height: 48px; }
            .carousel-name { font-size: 1.3rem; }
            .circles-grid { grid-template-columns: 1fr; }
            .create-circle-banner { flex-direction: column; text-align: center; gap: 12px; }
            .search-area { width: 140px; }
            .category-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
        }
    
        /* ========== 移动端专项优化（第二批） ========== */
@media (max-width: 768px) {
    .circles-grid { grid-template-columns: 1fr; }
    .search-sort-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .sort-bar { flex-wrap: nowrap; overflow-x: auto; }
    .sort-btn { white-space: nowrap; min-height: 40px; flex-shrink: 0; }
    .search-input { width: 100%; }
}
    </style>
</head>

            <p>&copy; 2026 深圳高中生社区 | <a href="/rules.html" style="color:#6c757d;">社区公约</a> | <a href="/help.html" style="color:#6c757d;">帮助中心</a> | <a href="/changelog.html" style="color:#6c757d;">更新日志</a> | 粤ICP备xxxxxxxx号</p>
        </div>
    </footer>

    <script>
        window.API_BASE = window.API_BASE || '/api';

        // ===================== 通用初始化 =====================

        const token = localStorage.getItem('token');

        // 侧边栏
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('menuToggle');
        const body = document.getElementById('appBody');
        const isExpanded = localStorage.getItem('sidebarExpanded') !== 'false';
        if (!isExpanded) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); }
        toggleBtn.addEventListener('click', () => {
            const c = !sidebar.classList.contains('collapsed');
            if (c) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); localStorage.setItem('sidebarExpanded', 'false'); }
            else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); localStorage.setItem('sidebarExpanded', 'true'); }
        });

        // 用户信息
        async function updateSidebarUser() {
            const av = document.getElementById('sidebarAvatar'), nn = document.getElementById('sidebarNickname'), em = document.getElementById('sidebarEmail');
            if (!token) { nn.innerText = '未登录'; em.innerText = ''; av.innerHTML = '<i class="fas fa-user-circle"></i>'; return; }
            try {
                const r = await fetch(window.API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (r.ok) { const u = await r.json(); nn.innerText = u.nickname || '用户'; em.innerText = u.email || ''; av.innerHTML = u.avatar_url ? '<img src="' + u.avatar_url + '" alt="头像">' : '<i class="fas fa-user-circle"></i>'; }
            } catch (e) { console.warn(e); }
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', () => { window.location.href = '/profile.html'; });

        // 小红点
        async function updateNotifDot() {
            if (!token) return;
            try {
                const r = await fetch(window.API_BASE + '/notifications?page=1&limit=1', { headers: { 'Authorization': 'Bearer ' + token } });
                const d = await r.json(); const uc = d.unreadCount || 0;
                const tb = document.getElementById('notifBadge'), sd = document.getElementById('sidebarNotifDot');
                if (tb) { tb.style.display = uc > 0 ? 'flex' : 'none'; tb.innerText = uc > 99 ? '99+' : uc; }
                if (sd) sd.style.display = uc > 0 ? 'inline-block' : 'none';
            } catch (e) { }
        }
        updateNotifDot(); if (token) setInterval(updateNotifDot, 30000);
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', () => { localStorage.removeItem('token'); window.location.href = '/login.html'; });

        const topSearchBtn = document.getElementById('topSearchBtn');
        const topSearchInput = document.getElementById('topSearchInput');
        topSearchBtn?.addEventListener('click', () => { const q = topSearchInput.value.trim(); if (q) window.location.href = '/search.html?q=' + encodeURIComponent(q); });
        topSearchInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter') topSearchBtn.click(); });

        // ===================== 圈子广场逻辑 =====================

        let allCircles = [];
        let filteredCircles = [];
        let currentPage = 1;
        let totalPages = 1;
        let currentCategory = 'all';
        let currentSort = 'member_count';
        const PAGE_SIZE = 18;

        // 轮播
        let currentSlide = 0;
        let carouselInterval = null;

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m] || m; }); }

        function formatDate(iso) {
            if (!iso) return '';
            var d = new Date(iso);
            return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function formatRelativeTime(iso) {
            if (!iso) return '';
            var now = new Date(), d = new Date(iso), diff = Math.floor((now - d) / 1000);
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 604800) return Math.floor(diff / 86400) + '天前';
            return formatDate(iso);
        }

        // ===================== 加载数据 =====================

        async function loadCircles(search, sort) {
            var url = window.API_BASE + '/circles?limit=50&sort=' + (sort || currentSort);
            if (search) url += '&search=' + encodeURIComponent(search);
            try {
                var res = await fetch(url);
                var data = await res.json();
                allCircles = data.circles || [];
                // 渲染动态
                renderActivities(data.recent_activities || []);
                // 初始化轮播
                initCarousel(allCircles);
                // 应用分类过滤
                applyFilters();
            } catch (err) {
                document.getElementById('circlesList').innerHTML = '<div class="error" style="grid-column:1/-1;">加载失败，请刷新重试</div>';
            }
        }

        // ===================== 动态流 =====================

        function renderActivities(activities) {
            var container = document.getElementById('activitiesList');
            if (!activities || activities.length === 0) {
                container.innerHTML = '<div class="activity-item"><span style="color:#999;padding:8px 0;">暂无圈子动态，快去创建或加入圈子吧~</span></div>';
                return;
            }
            var icons = { event: '🎉', essence: '⭐', new_circle: '🆕' };
            var texts = { event: '发布了新活动', essence: '有篇精华帖被推荐', new_circle: '新圈子成立' };

            container.innerHTML = activities.map(function(a) {
                return '<div class="activity-item" onclick="location.href=\'/circle-detail.html?id=' + a.circle_id + '\'">' +
                    '<div class="activity-icon">' + (icons[a.activity_type] || '📣') + '</div>' +
                    '<div class="activity-info">' +
                    '<div class="activity-circle-name">' +
                    (a.circle_icon ? '<img src="' + escapeHtml(a.circle_icon) + '" alt="">' : '') +
                    escapeHtml(a.circle_name) +
                    '</div>' +
                    '<div class="activity-text">' + (texts[a.activity_type] || '') + '：' + escapeHtml(a.activity_title) + '</div>' +
                    '</div>' +
                    '<div class="activity-time">' + formatRelativeTime(a.created_at) + '</div>' +
                    '</div>';
            }).join('');
        }

        // ===================== 轮播 =====================

        function initCarousel(circles) {
            var top = circles.slice(0, 3);
            var track = document.getElementById('carouselTrack');
            var dots = document.getElementById('carouselDots');

            if (top.length === 0) {
                track.innerHTML = '<div class="carousel-slide" style="background:linear-gradient(135deg,#1E88E5,#64B5F6)"><div class="carousel-content"><div class="carousel-name">暂无圈子</div><div class="carousel-desc">快来创建第一个圈子吧！</div></div></div>';
                dots.innerHTML = '';
                return;
            }

            track.innerHTML = top.map(function(c, i) {
                var cs = c.banner_url ? 'background-image:url(\'' + escapeHtml(c.banner_url) + '\')' : 'background:linear-gradient(135deg,#667eea,#764ba2)';
                var lh = c.icon_url ? '<img src="' + escapeHtml(c.icon_url) + '" class="carousel-logo" alt="' + escapeHtml(c.name) + '">' : '<div class="carousel-logo" style="background:rgba(255,255,255,0.2);display:inline-flex;align-items:center;justify-content:center;font-size:2rem;">👥</div>';
                return '<div class="carousel-slide" style="' + cs + '" onclick="location.href=\'/circle-detail.html?id=' + c.id + '\'">' +
                    '<div class="carousel-content">' + lh +
                    '<div class="carousel-name">' + escapeHtml(c.name) + '</div>' +
                    '<div class="carousel-desc">' + escapeHtml(c.description || '加入圈子，一起交流讨论！') + '</div>' +
                    '<div class="carousel-stats"><span>👤 ' + (c.member_count || 0) + ' 成员</span><span>📝 ' + (c.post_count || 0) + ' 帖子</span></div>' +
                    '<button class="btn-primary" style="display:inline-block;padding:8px 20px;border-radius:20px;font-size:0.9rem;">查看详情 →</button>' +
                    '</div></div>';
            }).join('');

            if (top.length > 1) {
                dots.innerHTML = top.map(function(_, i) {
                    return '<div class="carousel-dot' + (i === 0 ? ' active' : '') + '" onclick="goToSlide(' + i + ')"></div>';
                }).join('');
                startAutoPlay();
            } else {
                dots.innerHTML = '';
            }
        }

        function moveCarousel(dir) {
            var slides = document.querySelectorAll('.carousel-slide');
            if (slides.length <= 1) return;
            currentSlide = (currentSlide + dir + slides.length) % slides.length;
            updateCarousel();
        }

        function goToSlide(index) { currentSlide = index; updateCarousel(); }

        function updateCarousel() {
            document.getElementById('carouselTrack').style.transform = 'translateX(-' + (currentSlide * 100) + '%)';
            document.querySelectorAll('.carousel-dot').forEach(function(d, i) { d.classList.toggle('active', i === currentSlide); });
            resetAutoPlay();
        }

        function startAutoPlay() { if (carouselInterval) clearInterval(carouselInterval); carouselInterval = setInterval(function() { moveCarousel(1); }, 5000); }
        function resetAutoPlay() { if (carouselInterval) { clearInterval(carouselInterval); startAutoPlay(); } }

        // ===================== 分类过滤与渲染 =====================

        function applyFilters() {
            var keyword = document.getElementById('circleSearchInput').value.trim().toLowerCase();
            filteredCircles = allCircles.filter(function(c) {
                // 分类过滤
                if (currentCategory !== 'all') {
                    var cat = (c.category || c.description || '').toLowerCase();
                    if (cat.indexOf(currentCategory.toLowerCase()) === -1) return false;
                }
                // 搜索过滤
                if (keyword) {
                    var name = (c.name || '').toLowerCase();
                    var desc = (c.description || '').toLowerCase();
                    if (name.indexOf(keyword) === -1 && desc.indexOf(keyword) === -1) return false;
                }
                return true;
            });

            // 排序
            if (currentSort === 'post_count') {
                filteredCircles.sort(function(a, b) { return (b.post_count || 0) - (a.post_count || 0); });
            } else if (currentSort === 'created_at') {
                filteredCircles.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
            } else {
                filteredCircles.sort(function(a, b) { return (b.member_count || 0) - (a.member_count || 0); });
            }

            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            var container = document.getElementById('circlesList');
            var pagination = document.getElementById('pagination');
            totalPages = Math.ceil(filteredCircles.length / PAGE_SIZE) || 1;

            if (filteredCircles.length === 0) {
                container.innerHTML = '<div class="no-circles" style="grid-column:1/-1;">暂无匹配的圈子</div>';
                pagination.innerHTML = '';
                return;
            }

            var start = (currentPage - 1) * PAGE_SIZE;
            var pageCircles = filteredCircles.slice(start, start + PAGE_SIZE);

            container.innerHTML = pageCircles.map(function(c) {
                var cs = c.banner_url ? 'background-image:url(\'' + escapeHtml(c.banner_url) + '\')' : '';
                var cc = c.banner_url ? '' : 'no-cover';
                var lh = c.icon_url ? '<img src="' + escapeHtml(c.icon_url) + '" class="card-logo" alt="' + escapeHtml(c.name) + '">' : '<div class="card-logo" style="background:#1E88E5;display:flex;align-items:center;justify-content:center;color:white;font-size:1.5rem;">👥</div>';

                // 判断是否活跃（24小时内有新帖——简化处理，默认不显示，可根据需要修改）
                var activeHtml = c.member_count > 5 ? '<div class="active-dot"></div><div class="active-badge">活跃</div>' : '';

                return '<div class="circle-card-new" onclick="location.href=\'/circle-detail.html?id=' + c.id + '\'">' +
                    '<div class="card-cover ' + cc + '" style="' + cs + '">' + activeHtml + lh + '</div>' +
                    '<div class="card-body">' +
                    '<div class="card-name">' + escapeHtml(c.name) + '</div>' +
                    '<div class="card-desc">' + escapeHtml(c.description || '暂无简介') + '</div>' +
                    '<div class="card-stats">' +
                    '<span>👤 ' + (c.member_count || 0) + ' 成员</span>' +
                    '<span>📝 ' + (c.post_count || 0) + ' 帖子</span>' +
                    '</div></div></div>';
            }).join('');

            // 分页
            if (totalPages <= 1) { pagination.innerHTML = ''; return; }
            var ph = '';
            for (var i = 1; i <= totalPages; i++) {
                ph += '<button class="' + (i === currentPage ? 'active' : '') + '" data-page="' + i + '">' + i + '</button>';
            }
            pagination.innerHTML = ph;
            pagination.querySelectorAll('button').forEach(function(b) {
                b.addEventListener('click', function() {
                    var p = parseInt(b.dataset.page);
                    if (p && p !== currentPage) { currentPage = p; renderPage(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
                });
            });
        }

        // ===================== 事件绑定 =====================

        // 分类标签
        document.querySelectorAll('.category-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.category-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                applyFilters();
            });
        });

        // 排序按钮
        document.querySelectorAll('.sort-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                applyFilters();
            });
        });

        // 搜索
        document.getElementById('circleSearchBtn').addEventListener('click', applyFilters);
        document.getElementById('circleSearchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') applyFilters();
        });

        // ===================== 初始化 =====================

        loadCircles();
    </script>
    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeHarmonyBanner = function() {
                document.getElementById('harmonyBanner').style.display = 'none';
                localStorage.setItem('harmonyBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isHarmonyOS) {
                // 鸿蒙：每天首次弹窗引导添加到桌面
                const lastClosed = localStorage.getItem('harmonyBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('harmonyBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // 已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    // 根据浏览器环境设置不同文案
                    const ua = navigator.userAgent;
                    const isWeChat = /MicroMessenger/i.test(ua);
                    const isQQ = /QQ\//i.test(ua);
                    const isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua) && !isWeChat && !isQQ;

                    const textEl = document.getElementById('iosBannerText');
                    let bannerText = '';

                    if (isWeChat || isQQ) {
                        bannerText = '请点击右上角“...” → 选择“在浏览器中打开” → 在 Safari 中点击底部分享按钮 → “添加到主屏幕”';
                    } else if (isSafari) {
                        bannerText = '点击 Safari 底部的分享按钮（方框+向上箭头）→ 选择“添加到主屏幕”';
                    } else {
                        bannerText = '请在系统浏览器中打开此页面，然后通过浏览器菜单“添加到主屏幕”';
                    }

                    if (textEl) textEl.textContent = bannerText;

                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
