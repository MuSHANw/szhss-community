<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动日历 - 深圳高中生社区</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/js/mobile.js" defer></script>
    <script src="/js/level-utils.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
            background-color: #F5F7FA; color: #1f2d3d; line-height: 1.5;
            padding-top: 60px; margin-left: 260px; transition: margin-left 0.3s ease; position: relative; min-height: 100vh;
        }
        body.sidebar-collapsed { margin-left: 70px; }
        .bg-decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .bg-decorations .wave { position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x; background-size: cover; opacity: 0.5; }
        .bg-decorations .circle { position: absolute; border-radius: 50%; background: rgba(30,136,229,0.05); }
        .bg-decorations .circle1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-decorations .circle2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
        .bg-decorations .circle3 { width: 150px; height: 150px; top: 30%; right: 10%; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .top-bar-container { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; border-bottom: 1px solid #e9ecef; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
        .top-bar { display: flex; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 20px; color: #4a5568; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1E88E5; text-decoration: none; margin-right: auto; }
        .search-area { display: flex; align-items: center; background: #f1f3f5; border-radius: 24px; padding: 4px 12px; width: 260px; }
        .search-area input { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; }
        .search-area button { background: transparent; border: none; cursor: pointer; color: #6c757d; }
        .about-link { margin-left: 16px; color: #4a5568; text-decoration: none; font-size: 0.95rem; transition: color 0.2s; white-space: nowrap; }
        .about-link:hover { color: #1E88E5; }
        .notifications-icon { position: relative; margin-left: 16px; font-size: 1.4rem; color: #6c757d; text-decoration: none; display: inline-flex; align-items: center; }
        .notif-badge { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 260px; background: white; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 99; overflow-x: hidden; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-user-info, #sidebar.collapsed .sidebar-link span { display: none; }
        #sidebar.collapsed .sidebar-logout { font-size: 0; padding: 8px; }
        #sidebar.collapsed .sidebar-logout::before { content: "🚪"; font-size: 1.2rem; }
        .sidebar-user { display: flex; align-items: center; padding: 20px 16px; border-bottom: 1px solid #eef2f6; cursor: pointer; }
        .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 12px; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-avatar i { font-size: 48px; color: #1E88E5; }
        .sidebar-user-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .sidebar-nickname { font-weight: 600; font-size: 1rem; }
        .sidebar-email { font-size: 0.7rem; color: #6c757d; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 16px 0; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: #4a5568; transition: background 0.2s; white-space: nowrap; }
        .sidebar-link i { width: 28px; font-size: 1.2rem; text-align: center; }
        .sidebar-link span { margin-left: 12px; }
        .sidebar-link:hover { background: #f0f2f5; }
        .sidebar-link.active { background: #e9f0fe; color: #1E88E5; }
        .sidebar-link.sponsor-link { color: #e53e3e; }
        .sidebar-link.sponsor-link:hover { background: #ffe5e5; }
        .sidebar-link.sponsor-link i { color: #e53e3e; }
        .notif-dot { color: #e53e3e; font-size: 0.7rem; margin-left: 4px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #eef2f6; }
        .sidebar-logout { width: 100%; background: none; border: none; padding: 8px; cursor: pointer; color: #e53e3e; border-radius: 8px; text-align: center; }
        .sidebar-logout:hover { background: #ffe5e5; }

        /* ========== 活动日历 ========== */
        .calendar-page { max-width: 900px; margin: 32px auto; }
        .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { color: #6B7280; font-size: 0.9rem; margin-bottom: 20px; }

        .calendar-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .calendar-month-title { font-size: 1.2rem; font-weight: 700; }
        .calendar-nav-btn {
            background: white; border: 1px solid #e2e8f0; border-radius: 24px;
            width: 36px; height: 36px; cursor: pointer; font-size: 1rem; color: #374151;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .calendar-nav-btn:hover { background: #EFF6FF; border-color: #1E88E5; color: #1E88E5; }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 4px; background: white; padding: 16px;
            border-radius: 16px; border: 1px solid #eef2f6;
        }
        .calendar-day-header {
            text-align: center; font-size: 0.8rem; color: #9CA3AF;
            padding: 8px 0;
        }
        .calendar-day {
            aspect-ratio: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border-radius: 8px; cursor: pointer; transition: background 0.15s;
            font-size: 0.9rem; position: relative; min-height: 44px;
        }
        .calendar-day:hover { background: #F9FAFB; }
        .calendar-day.today { background: #EFF6FF; font-weight: 700; color: #1E88E5; }
        .calendar-day.selected { background: #1E88E5; color: white; font-weight: 700; }
        .calendar-day.has-events::after {
            content: ''; position: absolute; bottom: 6px;
            width: 6px; height: 6px; border-radius: 50%;
            background: #EF4444;
        }
        .calendar-day.selected::after { background: white; }
        .calendar-day.empty { cursor: default; }

        .day-event-list {
            background: white; border-radius: 16px; border: 1px solid #eef2f6;
            padding: 20px; margin-top: 16px;
        }
        .day-event-list h3 { font-size: 1.05rem; margin-bottom: 14px; }
        .event-item {
            display: flex; align-items: center; gap: 14px; padding: 12px 0;
            border-bottom: 1px solid #f0f2f5; cursor: pointer; text-decoration: none; color: inherit;
            transition: background 0.15s;
        }
        .event-item:last-child { border-bottom: none; }
        .event-item:hover { background: #F9FAFB; }
        .event-type-badge {
            flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; background: #FEE2E2; color: #DC2626;
        }
        .event-item-body { flex: 1; min-width: 0; }
        .event-item-title { font-weight: 600; font-size: 0.95rem; }
        .event-item-meta { font-size: 0.8rem; color: #6B7280; margin-top: 2px; }

        .upcoming-card {
            background: white; border-radius: 16px; border: 1px solid #eef2f6;
            padding: 20px; margin-top: 16px;
        }
        .upcoming-card h3 { font-size: 1.05rem; margin-bottom: 14px; }

        .loading, .error, .empty { text-align: center; padding: 30px; color: #6c757d; font-size: 0.9rem; }

        @media (max-width: 768px) {
            body { margin-left: 0; }
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; width: 260px !important; }
            #sidebar.open-mobile { transform: translateX(0); }
            .search-area { width: 34px; }
            .calendar-page { margin: 16px; }
            .calendar-grid { padding: 10px; gap: 2px; }
            .calendar-day { font-size: 0.8rem; min-height: 38px; }
        }
    </style>
</head>
<body id="appBody">

        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
        <div class="wave"></div>
    </div>

    <!-- 顶部栏 -->
    <div class="top-bar-container">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

            <div class="search-area">
                <input type="text" placeholder="搜索帖子、用户..." id="searchInput">
                <button id="searchBtn"><i class="fas fa-search"></i></button>

            <a href="/about.html" class="about-link"><i class="fas fa-info-circle"></i> 关于</a>

    <!-- 侧边栏 -->
    <div id="sidebar">
        <div class="sidebar-user" id="sidebarUserBtn">

            <div class="sidebar-user-info">
                <div class="sidebar-nickname" id="sidebarNickname">未登录</div>

    <!-- 日历主体 -->
    <div class="container">
        <div class="calendar-page">
            <div class="page-title">📅 深圳高中生社区 · 活动日历</div>
            <div class="page-subtitle">查看社区官方活动与比赛的时间分布，点击日期查看当天活动</div>

            <div class="calendar-header">
                <button class="calendar-nav-btn" onclick="changeMonth(-1)">❮</button>
                <div class="calendar-month-title" id="monthTitle">加载中...</div>
                <button class="calendar-nav-btn" onclick="changeMonth(1)">❯</button>
            </div>

            <div class="calendar-grid" id="calendarGrid">
                <div class="loading" style="grid-column:1/-1;">加载中...</div>
            </div>

            <div class="day-event-list" id="dayEventList">
                <h3 id="dayEventTitle">📌 请选择日期</h3>
                <div id="dayEvents" class="empty">点击日历中的日期，查看当天的活动</div>
            </div>

            <div class="upcoming-card">
                <h3>⏳ 即将开始的活动</h3>
                <div id="upcomingList"><div class="loading">加载中...</div></div>
            </div>
        </div>

    <script>
        window.API_BASE = window.API_BASE || '/api';
        var token = localStorage.getItem('token');

        // ---------- 侧边栏 ----------
        var sidebar = document.getElementById('sidebar'), toggleBtn = document.getElementById('menuToggle'), body = document.getElementById('appBody');
        if (localStorage.getItem('sidebarExpanded') !== 'false') { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); }
        else { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); }
        toggleBtn.addEventListener('click', function() {
            var e = !sidebar.classList.contains('collapsed');
            if (e) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); localStorage.setItem('sidebarExpanded', 'false'); }
            else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); localStorage.setItem('sidebarExpanded', 'true'); }
        });
        async function updateSidebarUser() {
            try {
                var res = await fetch(window.API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.status === 401) { localStorage.removeItem('token'); return; }
                if (res.ok) {
                    var u = await res.json();
                    document.getElementById('sidebarNickname').innerText = u.nickname || '用户';
                    document.getElementById('sidebarEmail').innerText = u.email || '';
                    document.getElementById('sidebarAvatar').innerHTML = u.avatar_url ? '<img src="' + u.avatar_url + '" alt="头像">' : '<i class="fas fa-user-circle"></i>';
                }
            } catch (e) {}
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', function() { window.location.href = '/profile.html'; });
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', function() { localStorage.removeItem('token'); window.location.href = '/login.html'; });
        async function updateNotifDot() {
            if (!token) return;
            try {
                var res = await fetch(window.API_BASE + '/notifications?page=1&limit=1', { headers: { 'Authorization': 'Bearer ' + token } });
                var d = await res.json();
                var cnt = d.unreadCount || 0;
                var badge = document.getElementById('notifBadge');
                var dot = document.getElementById('sidebarNotifDot');
                if (badge) { badge.style.display = cnt > 0 ? 'flex' : 'none'; badge.innerText = cnt > 99 ? '99+' : cnt; }
                if (dot) dot.style.display = cnt > 0 ? 'inline-block' : 'none';
            } catch (e) {}
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);
        document.getElementById('searchBtn')?.addEventListener('click', function() { var q = document.getElementById('searchInput').value.trim(); if (q) window.location.href = '/search.html?q=' + encodeURIComponent(q); else alert('请输入搜索关键词'); });
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('searchBtn').click(); });

        // ---------- 工具函数 ----------
        function escapeHtml(str) { if (str === null || str === undefined) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        function formatDate(isoString) {
            if (!isoString) return '';
            var date = new Date(isoString);
            return date.getFullYear() + '/' + (date.getMonth() + 1) + '/' + date.getDate() + ' ' + date.getHours() + ':' + String(date.getMinutes()).padStart(2, '0');
        }
        var TYPE_ICONS = { vote: '🗳️', submit: '📮', checkin: '✅', signup: '📝', quiz: '🧠', pk: '⚔️' };
        var TYPE_NAMES = { vote: '投票评选', submit: '投稿征集', checkin: '打卡挑战', signup: '报名参与', quiz: '答题竞赛', pk: '校际PK' };

        // ---------- 日历状态 ----------
        var nowDate = new Date();
        var currentYear = nowDate.getFullYear();
        var currentMonth = nowDate.getMonth(); // 0-11
        var allActivities = [];
        var selectedDate = null;

        // ---------- 加载活动 ----------
        async function loadAllActivities() {
            try {
                var res = await fetch(window.API_BASE + '/activities?limit=200');
                var data = await res.json();
                allActivities = data.activities || [];
            } catch (e) { allActivities = []; }
            renderCalendar();
            loadUpcoming();
        }

        function activitiesOfDay(year, month, day) {
            return allActivities.filter(function(a) {
                if (!a.start_time) return false;
                var d = new Date(a.start_time);
                return d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
            });
        }

        function activitiesOfMonth(year, month) {
            return allActivities.filter(function(a) {
                if (!a.start_time) return false;
                var d = new Date(a.start_time);
                return d.getFullYear() === year && d.getMonth() === month;
            });
        }

        // ---------- 渲染日历 ----------
        function renderCalendar() {
            document.getElementById('monthTitle').textContent = currentYear + '年' + (currentMonth + 1) + '月';

            var grid = document.getElementById('calendarGrid');
            var firstDay = new Date(currentYear, currentMonth, 1);
            var startWeekday = firstDay.getDay(); // 0=周日
            var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            var today = new Date();
            var monthActivities = activitiesOfMonth(currentYear, currentMonth);
            var hasEventsSet = {};
            monthActivities.forEach(function(a) {
                var d = new Date(a.start_time);
                hasEventsSet[d.getDate()] = true;
            });

            var html = '';
            ['日','一','二','三','四','五','六'].forEach(function(w) {
                html += '<div class="calendar-day-header">' + w + '</div>';
            });
            for (var i = 0; i < startWeekday; i++) html += '<div class="calendar-day empty"></div>';

            for (var d = 1; d <= daysInMonth; d++) {
                var isToday = d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear();
                var isSelected = selectedDate && selectedDate.getDate() === d && selectedDate.getMonth() === currentMonth && selectedDate.getFullYear() === currentYear;
                var hasEvents = !!hasEventsSet[d];
                var cls = 'calendar-day';
                if (isToday) cls += ' today';
                if (isSelected) cls += ' selected';
                if (hasEvents) cls += ' has-events';
                html += '<div class="' + cls + '" onclick="selectDate(' + d + ')">' + d + '</div>';
            }
            grid.innerHTML = html;

            // 默认选中今天
            if (!selectedDate) selectDate(today.getDate());
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            selectedDate = null;
            renderCalendar();
        }

        // ---------- 选中日期 ----------
        function selectDate(day) {
            selectedDate = new Date(currentYear, currentMonth, day);
            renderCalendar();

            document.getElementById('dayEventTitle').textContent = '📌 ' + currentYear + '年' + (currentMonth + 1) + '月' + day + '日的活动';
            var list = activitiesOfDay(currentYear, currentMonth, day);
            var box = document.getElementById('dayEvents');
            if (list.length === 0) {
                box.innerHTML = '<div class="empty">这一天暂无活动</div>';
                return;
            }
            box.innerHTML = list.map(function(a) { return renderEventItem(a); }).join('');
        }

        function renderEventItem(a) {
            var icon = TYPE_ICONS[a.type] || '🎉';
            var typeName = TYPE_NAMES[a.type] || a.type;
            return '<a class="event-item" href="/activity.html?id=' + a.id + '">' +
                '<div class="event-type-badge">' + icon + '</div>' +
                '<div class="event-item-body">' +
                '    <div class="event-item-title">' + escapeHtml(a.title) + '</div>' +
                '    <div class="event-item-meta">' + typeName + ' · ' + formatDate(a.start_time) + ' ~ ' + formatDate(a.end_time) + ' · ' + (a.participant_count || 0) + ' 人参与</div>' +
                '</div></a>';
        }

        // ---------- 即将开始 ----------
        function loadUpcoming() {
            var box = document.getElementById('upcomingList');
            var now = new Date();
            var upcoming = allActivities
                .filter(function(a) { return a.start_time && new Date(a.start_time) > now; })
                .sort(function(a, b) { return new Date(a.start_time) - new Date(b.start_time); })
                .slice(0, 5);
            if (upcoming.length === 0) { box.innerHTML = '<div class="empty">暂无即将开始的活动</div>'; return; }
            box.innerHTML = upcoming.map(function(a) { return renderEventItem(a); }).join('');
        }

        loadAllActivities();
    </script>
