<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>重置密码 - 深圳高中生社区</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/js/device-detect.js"></script>
    <script src="/js/mobile.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x bottom; background-color: #F5F7FA; background-size: contain; color: #1f2d3d; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; border-radius: 24px; padding: 40px 36px; max-width: 420px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid #eef2f6; }
        .auth-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 4px; }
        .auth-sub { text-align: center; color: #6c757d; font-size: 0.9rem; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #374151; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; outline: none; font-family: inherit; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #1E88E5; box-shadow: 0 0 0 3px rgba(30,136,229,0.1); }
        .submit-btn { width: 100%; padding: 14px; background: #1E88E5; color: white; border: none; border-radius: 40px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .submit-btn:hover { background: #1565C0; }
        .submit-btn:disabled { background: #9CA3AF; cursor: not-allowed; }
        .msg { text-align: center; font-size: 0.85rem; margin-top: 12px; min-height: 1.2em; }
        .msg.success { color: #10B981; }
        .msg.error { color: #e53e3e; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #1E88E5; text-decoration: none; font-size: 0.9rem; }
        .hint { font-size: 0.75rem; color: #9CA3AF; margin-top: 4px; }
        @media (max-width: 768px) { .auth-card { padding: 28px 20px; } }
    </style>
</head>
<body>
    <div id="androidBanner" style="display:none;background:linear-gradient(135deg,#1E88E5,#1565C0);color:white;padding:10px 16px;text-align:center;position:fixed;top:0;left:0;right:0;z-index:9999;font-size:0.9rem;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
        📱 深圳高中生社区 App 已上线！
        <a href="https://szhss-community.top/uploads/szhss-community.apk" style="color:#FFD93D;font-weight:700;text-decoration:underline;">点击下载安卓版</a>
        <button onclick="closeAndroidBanner()" style="background:none;border:none;color:white;margin-left:12px;cursor:pointer;font-size:1.2rem;">✕</button>
    </div>
    <div id="iosBanner" style="display:none;background:#F3F4F6;color:#333;padding:10px 16px;text-align:center;position:fixed;top:0;left:0;right:0;z-index:9999;font-size:0.9rem;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        📱 点击下方 <strong>分享按钮</strong> → <strong>添加到桌面</strong>，体验和App一样流畅！
        <button onclick="closeIOSBanner()" style="background:none;border:none;color:#999;margin-left:12px;cursor:pointer;font-size:1.2rem;">✕</button>
    </div>

    <div class="auth-card">
        <div class="auth-title">🔐 重置密码</div>
        <div class="auth-sub">请输入邮箱和收到的验证码，设置新密码</div>

        <form id="resetForm">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" placeholder="你的注册邮箱" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <input type="text" id="code" placeholder="6位数字验证码" maxlength="6" inputmode="numeric" required>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="password" placeholder="至少6位" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password" required>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">重置密码</button>
            <div id="msg" class="msg"></div>
        </form>

        <div class="hint" style="text-align:center;margin-top:12px;">没收到验证码？<a href="/forgot-password.html" style="color:#1E88E5;text-decoration:none;">重新获取</a></div>

        <a href="/login.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回登录</a>
    </div>

    <script>
        window.API_BASE = window.API_BASE || '/api';
        var urlParams = new URLSearchParams(window.location.search);
        var urlEmail = urlParams.get('email');
        var emailInput = document.getElementById('email');
        if (urlEmail) emailInput.value = urlEmail;

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var msg = document.getElementById('msg');
            var btn = document.getElementById('submitBtn');
            var email = emailInput.value.trim();
            var code = document.getElementById('code').value.trim();
            var password = document.getElementById('password').value;
            var confirmPwd = document.getElementById('confirmPassword').value;

            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                msg.className = 'msg error'; msg.textContent = '请输入有效的邮箱地址';
                return;
            }
            if (!/^\d{6}$/.test(code)) {
                msg.className = 'msg error'; msg.textContent = '请输入6位数字验证码';
                return;
            }
            if (password.length < 6) {
                msg.className = 'msg error'; msg.textContent = '密码至少6位';
                return;
            }
            if (password !== confirmPwd) {
                msg.className = 'msg error'; msg.textContent = '两次输入的密码不一致';
                return;
            }

            btn.disabled = true; btn.textContent = '重置中...';
            try {
                var res = await fetch(window.API_BASE + '/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, code: code, password: password })
                });
                var data = await res.json();
                if (res.ok) {
                    msg.className = 'msg success';
                    msg.innerHTML = '✅ 密码重置成功！3秒后跳转登录页';
                    setTimeout(function() { window.location.href = '/login.html'; }, 3000);
                } else {
                    msg.className = 'msg error'; msg.textContent = data.error || '重置失败';
                    btn.disabled = false; btn.textContent = '重置密码';
                }
            } catch (err) {
                msg.className = 'msg error'; msg.textContent = '网络错误，请重试';
                btn.disabled = false; btn.textContent = '重置密码';
            }
        });
    </script>
    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // iOS：已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
</body>
</html>
