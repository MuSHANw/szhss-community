<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员仪表盘 - 深圳高中生社区</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- 移动端适配 -->
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/js/mobile.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- 引入 Quill（公告编辑器） -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <style>
        /* ========== 管理员页面特有样式 ========== */
        .admin-container {
            max-width: 1200px;
            margin: 32px auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #eef2f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1E88E5;
        }

        .stat-label {
            color: #6c757d;
            margin-top: 8px;
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #eef2f6;
        }

        .chart-card h3 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            text-align: center;
        }

        canvas {
            max-height: 300px;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid #eef2f6;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 500;
            color: #6c757d;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 30px;
        }

        .tab-btn.active {
            color: #1E88E5;
            background: #e9f0fe;
        }

        .tab-content {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #eef2f6;
        }

        .tab-content.active {
            display: block;
        }

        .list-item {
            border-bottom: 1px solid #f0f2f5;
            padding: 16px;
            margin-bottom: 8px;
        }

        .item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: #6c757d;
        }

        .item-content {
            margin-bottom: 8px;
        }

        .item-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-sm {
            background: #f0f2f5;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-sm.primary {
            background: #1E88E5;
            color: white;
        }

        .btn-sm.danger {
            background: #e53e3e;
            color: white;
        }

        /* 公告管理 */
        .card {
            background: white; border-radius: 16px; padding: 20px;
            border: 1px solid #eef2f6;
        }
        .card h3 { font-size: 1.1rem; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #374151; }
        .form-group input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.95rem; outline: none; font-family: inherit; }
        .form-group input[type="text"]:focus { border-color: #1E88E5; }
        .btn-primary {
            background: #1E88E5; color: white; border: none;
            padding: 10px 24px; border-radius: 40px; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary:hover { background: #1565C0; }

        .reply-form {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .reply-form input {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            background: #e9ecef;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }

        .badge-resolved {
            background: #d4edda;
            color: #155724;
        }

        .badge-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-read {
            background: #cfe2ff;
            color: #004085;
        }

        /* 圈子申请特有样式 */
        .participants-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }

        .participant-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f0f2f5;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .participant-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
        }

        .participant-name {
            font-weight: 500;
        }

        .initiator-badge {
            background: #1E88E5;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.6rem;
            margin-left: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        /* ========== 管理后台侧边导航布局 ========== */
        .admin-layout {
            display: flex; gap: 0; background: white;
            border-radius: 16px; overflow: hidden; border: 1px solid #eef2f6;
            margin-top: 20px;
        }
        .admin-sidebar {
            width: 200px; flex-shrink: 0;
            border-right: 1px solid #F3F4F6; padding: 16px 0;
            background: #FAFBFC;
        }
        .admin-nav-item {
            padding: 10px 20px; cursor: pointer; font-size: 0.9rem;
            color: #6B7280; transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .admin-nav-item:hover { background: #F0F4FF; color: #1E88E5; }
        .admin-nav-item.active {
            background: #EFF6FF; color: #1E88E5;
            border-left-color: #1E88E5; font-weight: 600;
        }
        .admin-content { flex: 1; padding: 24px; min-height: 500px; }
        .admin-content .tab-content {
            background: transparent; border: none; padding: 0; border-radius: 0;
        }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
        .form-group select,
        .form-group input[type="datetime-local"],
        .form-group input[type="number"] {
            width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0;
            border-radius: 12px; font-size: 0.95rem; outline: none;
            font-family: inherit; background: white;
        }
        .form-group select:focus,
        .form-group input[type="datetime-local"]:focus,
        .form-group input[type="number"]:focus { border-color: #1E88E5; }
        .btn-secondary {
            background: #f0f2f5; color: #374151; border: none;
            padding: 10px 24px; border-radius: 40px; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        /* 活动类型配置区域 */
        .type-config { padding: 14px; background: #FAFBFC; border-radius: 12px; margin-bottom: 16px; border: 1px solid #F3F4F6; }
        .config-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; color: #374151; }
        .option-image-upload:hover { border-color: #1E88E5; background: #EFF6FF; }
        .vote-option-card input[type="text"] { width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.85rem; outline: none; font-family: inherit; }
        .vote-option-card input[type="text"]:focus { border-color: #1E88E5; }

        @media (max-width: 768px) {
            .admin-layout { flex-direction: column; }
            .admin-sidebar {
                width: 100%; display: flex; flex-wrap: wrap;
                gap: 4px; padding: 8px 12px; border-right: none;
                border-bottom: 1px solid #F3F4F6;
            }
            .admin-nav-item {
                padding: 6px 12px; font-size: 0.8rem;
                border-radius: 16px; border-left: none;
            }
        }

        /* ========== 顶部栏和侧边栏（与 index 一致） ========== */
        /* 顶部铃铛链接 */
        .notifications-icon {
            position: relative;
            margin-left: 16px;
            font-size: 1.4rem;
            color: #6c757d;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .notif-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #e53e3e;
            color: white;
            font-size: 0.7rem;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .top-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 20px;
            color: #4a5568;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E88E5;
            text-decoration: none;
            margin-right: auto;
        }

        .search-area {
            display: flex;
            align-items: center;
            background: #f1f3f5;
            border-radius: 24px;
            padding: 4px 12px;
            width: 260px;
        }

        .search-area input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            padding: 8px 0;
        }

        .search-area button {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #6c757d;
        }

        /* 关于链接 */
        .about-link {
            margin-left: 16px;
            color: #4a5568;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .about-link:hover {
            color: #1E88E5;
        }

        .about-link i {
            margin-right: 4px;
        }

        #sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            bottom: 0;
            width: 260px;
            background: white;
            border-right: 1px solid #eef2f6;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            z-index: 99;
            overflow-x: hidden;
        }

        #sidebar.collapsed {
            width: 70px;
        }

        #sidebar.collapsed .sidebar-user-info,
        #sidebar.collapsed .sidebar-link span {
            display: none;
        }

        #sidebar.collapsed .sidebar-logout {
            font-size: 0;
            padding: 8px;
        }

        #sidebar.collapsed .sidebar-logout::before {
            content: "🚪";
            font-size: 1.2rem;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            padding: 20px 16px;
            border-bottom: 1px solid #eef2f6;
            cursor: pointer;
        }

        .sidebar-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .sidebar-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-avatar i {
            font-size: 48px;
            color: #1E88E5;
        }

        .sidebar-user-info {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar-nickname {
            font-weight: 600;
            font-size: 1rem;
        }

        .sidebar-email {
            font-size: 0.7rem;
            color: #6c757d;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 0;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            color: #4a5568;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .sidebar-link i {
            width: 28px;
            font-size: 1.2rem;
            text-align: center;
        }

        .sidebar-link span {
            margin-left: 12px;
        }

        .sidebar-link:hover {
            background: #f0f2f5;
        }

        .sidebar-link.active {
            background: #e9f0fe;
            color: #1E88E5;
        }

        .notif-dot {
            color: #e53e3e;
            font-size: 0.7rem;
            margin-left: 4px;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #eef2f6;
        }

        .sidebar-logout {
            width: 100%;
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: #e53e3e;
            border-radius: 8px;
            text-align: center;
        }

        .sidebar-logout:hover {
            background: #ffe5e5;
        }

        body {
            padding-top: 60px;
            margin-left: 260px;
            transition: margin-left 0.3s ease;
        }

        body.sidebar-collapsed {
            margin-left: 70px;
        }

        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }

            body {
                margin-left: 0;
            }

            #sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                width: 260px !important;
            }

            #sidebar.open-mobile {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body id="appBody">
    <!-- 顶部栏 -->
    <div class="top-bar-container">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-bars"></i>
            </button>
            <a href="/" class="logo">深圳高中生社区</a>
            <div class="search-area">
                <input type="text" placeholder="搜索帖子、用户..." id="searchInput">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <!-- 新增：关于按钮 -->
            <a href="/about.html" class="about-link" id="aboutLink">
                <i class="fas fa-info-circle"></i> 关于
            </a>
            <!-- 顶部铃铛：改为链接跳转通知页面 -->
            <a href="/notifications.html" class="notifications-icon" id="notifLink">
                <i class="fas fa-bell"></i>
                <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
            </a>
        </div>
    </div>

    <!-- 侧边栏 -->
    <div id="sidebar">
        <div class="sidebar-user" id="sidebarUserBtn">
            <div class="sidebar-avatar" id="sidebarAvatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <div class="sidebar-user-info">
                <div class="sidebar-nickname" id="sidebarNickname">未登录</div>
                <div class="sidebar-email" id="sidebarEmail"></div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="sidebar-link" title="首页"><i class="fas fa-home"></i><span>首页</span></a>
            <a href="learning.html" class="sidebar-link" title="学习"><i
                    class="fas fa-graduation-cap"></i><span>学习</span></a>
            <a href="circles.html" class="sidebar-link" title="圈子">
                <i class="fas fa-users"></i><span>圈子</span>
            </a>
            <a href="/study.html" class="sidebar-link" title="自习室">
                <i class="fas fa-clock"></i><span>自习室</span>
            </a>
            <a href="feed.html" class="sidebar-link" title="动态"><i class="fas fa-bolt"></i><span>动态</span></a>
            <a href="life.html" class="sidebar-link" title="生活"><i class="fas fa-life-ring"></i><span>生活</span></a>
            <a href="gaokao.html" class="sidebar-link" title="升学"><i class="fas fa-chart-line"></i><span>升学</span></a>
            <a href="profile.html" class="sidebar-link" title="个人主页"><i class="fas fa-user"></i><span>个人主页</span></a>
            <a href="settings.html" class="sidebar-link" title="设置"><i class="fas fa-cog"></i><span>设置</span></a>
            <a href="admin.html" class="sidebar-link active" title="管理后台"><i
                    class="fas fa-shield-alt"></i><span>管理后台</span></a>
            <a href="messages.html" class="sidebar-link" id="sidebarMessagesLink" title="私信">
                <i class="fas fa-envelope"></i><span>私信</span>
            </a>
            <a href="drafts.html" class="sidebar-link" title="草稿箱">
                <i class="fas fa-edit"></i><span>草稿箱</span>
            </a>
            <a href="feedback.html" class="sidebar-link" id="sidebarFeedbackLink" title="反馈">
                <i class="fas fa-comment-dots"></i><span>反馈</span>
            </a>
            <a href="https://mushanw.github.io/MuShanblog/sponsor.html" class="sidebar-link sponsor-link" title="赞助" target="_blank"><i class="fas fa-heart"></i><span>赞助</span></a>

            <a href="/notifications.html" class="sidebar-link" id="sidebarNotifLink" title="通知">
                <i class="fas fa-bell"></i><span>通知</span>
                <span class="notif-dot" id="sidebarNotifDot" style="display:none;">●</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="sidebar-logout" id="sidebarLogoutBtn">退出登录</button>
        </div>
    </div>

    <div class="container admin-container">
        <h1>管理员仪表盘</h1>
        <div id="statsContainer" class="stats-grid">加载中...</div>

        <!-- 图表区域 -->
        <div class="charts-row">
            <div class="chart-card">
                <h3>每日活跃用户 (DAU)</h3>
                <canvas id="dauChart" width="400" height="300"></canvas>
            </div>
            <div class="chart-card">
                <h3>每日发帖趋势</h3>
                <canvas id="postsChart" width="400" height="300"></canvas>
            </div>
            <div class="chart-card">
                <h3>每日举报趋势</h3>
                <canvas id="reportsChart" width="400" height="300"></canvas>
            </div>
        </div>

        <div class="admin-layout">
            <div class="admin-sidebar">
                <div class="admin-nav-item active" data-tab="reports">举报受理</div>
                <div class="admin-nav-item" data-tab="feedbacks">反馈受理</div>
                <div class="admin-nav-item" data-tab="circle-applications">圈子审批</div>
                <div class="admin-nav-item" data-tab="announcements">公告管理</div>
                <div class="admin-nav-item" data-tab="activities">活动管理</div>
            </div>
            <div class="admin-content">
        <div id="reportsTab" class="tab-content active">
            <div id="reportsList">加载中...</div>
        </div>
        <div id="feedbacksTab" class="tab-content">
            <div id="feedbacksList">加载中...</div>
        </div>
        <div id="circleApplicationsTab" class="tab-content">
            <div id="circleApplicationsList">加载中...</div>
        </div>
        <div id="announcementsTab" class="tab-content">
            <!-- 发布公告表单 -->
            <div class="card" style="margin-bottom:20px;">
                <h3>发布新公告</h3>
                <div class="form-group">
                    <label>公告标题</label>
                    <input type="text" id="announcementTitle" placeholder="公告标题" maxlength="200">
                </div>
                <div class="form-group">
                    <label>公告内容</label>
                    <div id="announcementEditor" style="min-height:200px;background:white;"></div>
                </div>
                <button class="btn-primary" id="publishAnnouncementBtn">发布公告</button>
            </div>

            <!-- 公告列表 -->
            <div class="card">
                <h3>公告列表</h3>
                <div id="announcementsList">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 活动管理标签页 -->
        <div id="activitiesTab" class="tab-content">
            <!-- 创建/编辑活动表单 -->
            <div class="card" style="margin-bottom:20px;" id="activityFormCard">
                <h3 id="activityFormTitle">创建活动</h3>
                <div class="form-group">
                    <label>活动标题 *</label>
                    <input type="text" id="activityTitle" placeholder="如：2026社娘形象征集大赛" maxlength="200">
                </div>
                <div class="form-group">
                    <label>活动类型 *</label>
                    <select id="activityType">
                        <option value="">请选择</option>
                        <option value="vote">投票评选类</option>
                        <option value="submit">投稿征集类</option>
                        <option value="checkin">打卡挑战类</option>
                        <option value="signup">报名参与类</option>
                        <option value="quiz">答题竞赛类</option>
                        <option value="pk">校际PK类</option>
                    </select>
                </div>

                <!-- 封面图上传组件 -->
                <div class="form-group">
                    <label>封面图</label>
                    <div class="cover-upload-area" id="activityCoverUpload" onclick="document.getElementById('activityCoverInput').click()">
                        <div id="coverPreview" style="height:120px;display:flex;align-items:center;justify-content:center;color:#9CA3AF;border:2px dashed #D1D5DB;border-radius:12px;cursor:pointer;background:#F9FAFB;overflow:hidden;">
                            <span id="coverPlaceholder"><i class="fas fa-image"></i> 点击上传封面图</span>

                </div>

                <!-- 按活动类型动态显示配置区域 -->
                <div id="typeConfigSections">
                    <!-- 投票评选类：选项列表 -->
                    <div id="voteConfigSection" class="type-config" style="display:none;">
                        <div class="form-group">
                            <label>投票选项</label>

                        <div class="form-group">

                        </div>
                        <div class="form-group">
                            <label class="config-checkbox"><input type="checkbox" id="submitNeedReview"> 投稿需管理员审核</label>
                        </div>

                    <!-- 打卡挑战类：周期/天数 -->
                    <div id="checkinConfigSection" class="type-config" style="display:none;">
                        <div class="form-group">

                            <select id="checkinPeriod">
                                <option value="daily">每日打卡</option>
                                <option value="weekly">每周打卡</option>
                                <option value="custom">自定义天数</option>
                            </select>
                        </div>
                        <div class="form-group" id="checkinDaysGroup" style="display:none;">
                            <label>打卡天数（天）</label>
                            <input type="number" id="checkinDays" min="1" value="7">

                    <!-- 报名参与类：字段/人数上限/截止时间 -->
                    <div id="signupConfigSection" class="type-config" style="display:none;">

                            <label>报名表单字段</label>
                            <div id="signupFieldsList"></div>
                            <button type="button" class="btn-sm" id="addSignupFieldBtn" style="margin-top:8px;">+ 添加字段</button>
                        </div>
                        <div class="form-row">
                            <div class="form-group" style="flex:1;">
                                <label>人数上限</label>
                                <input type="number" id="signupMaxCount" min="1" value="100">
                            </div>
                            <div class="form-group" style="flex:1;">
                                <label>报名截止时间</label>
                                <input type="datetime-local" id="signupDeadline">
                            </div>
                        </div>
                    </div>
                    <!-- 答题竞赛类：提示 -->
                    <div id="quizConfigSection" class="type-config" style="display:none;">
                        <div style="padding:12px;background:#F9FAFB;border-radius:8px;color:#6B7280;font-size:0.9rem;">
                            <i class="fas fa-info-circle"></i> 请将答题链接写在活动规则中
                        </div>
                    </div>
                    <!-- 校际PK类：预设阵营 + 待审核 -->
                    <div id="pkConfigSection" class="type-config" style="display:none;">
                        <div class="form-group">
                            <label>预设阵营</label>
                            <div id="pkFactionsList"></div>
                            <button type="button" class="btn-sm" id="addPkFactionBtn" style="margin-top:8px;">+ 添加阵营</button>
                        </div>
                        <div class="form-group" id="pendingFactionsSection" style="display:none;">
                            <label>待审核阵营申请</label>
                            <div id="pendingFactionsList"></div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>活动规则（富文本）</label>
                    <div id="activityEditor" style="min-height:150px;background:white;"></div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>开始时间</label>
                        <input type="datetime-local" id="activityStart">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>结束时间</label>
                        <input type="datetime-local" id="activityEnd">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>鹏城币奖励</label>
                        <input type="number" id="activityRewardCoins" value="0" min="0">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>限定勋章（可选）</label>
                        <input type="text" id="activityRewardBadge" placeholder="如：activity_star">
                    </div>
                </div>
                <button class="btn-primary" id="saveActivityBtn">创建活动</button>
                <button class="btn-secondary" id="cancelActivityBtn" style="display:none;margin-left:8px;">取消编辑</button>
            </div>

            <!-- 活动列表 -->
            <div class="card">
                <h3>活动列表</h3>
                <div id="activitiesList">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
            </div>
        </div>
    </div>

    <script>
        window.API_BASE = window.API_BASE || '/api';
        let token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }

        // ---------- 侧边栏展开/收起 ----------
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('menuToggle');
        const body = document.getElementById('appBody');
        const isExpanded = localStorage.getItem('sidebarExpanded') !== 'false';
        if (!isExpanded) {
            sidebar.classList.add('collapsed');
            body.classList.add('sidebar-collapsed');
        } else {
            sidebar.classList.remove('collapsed');
            body.classList.remove('sidebar-collapsed');
        }
        toggleBtn.addEventListener('click', () => {
            const currentlyExpanded = !sidebar.classList.contains('collapsed');
            if (currentlyExpanded) {
                sidebar.classList.add('collapsed');
                body.classList.add('sidebar-collapsed');
                localStorage.setItem('sidebarExpanded', 'false');
            } else {
                sidebar.classList.remove('collapsed');
                body.classList.remove('sidebar-collapsed');
                localStorage.setItem('sidebarExpanded', 'true');
            }
        });

        // ---------- 用户信息 ----------
        const avatarDiv = document.getElementById('sidebarAvatar');
        const nicknameSpan = document.getElementById('sidebarNickname');
        const emailSpan = document.getElementById('sidebarEmail');
        async function updateSidebarUser() {
            if (!token) {
                nicknameSpan.innerText = '未登录';
                emailSpan.innerText = '';
                avatarDiv.innerHTML = '<i class="fas fa-user-circle"></i>';
                return;
            }
            try {
                const res = await fetch(`${window.API_BASE}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const user = await res.json();
                    nicknameSpan.innerText = user.nickname || '用户';
                    emailSpan.innerText = user.email || '';
                    if (user.avatar_url) {
                        avatarDiv.innerHTML = `<img src="${user.avatar_url}" alt="头像">`;
                    } else {
                        avatarDiv.innerHTML = '<i class="fas fa-user-circle"></i>';
                    }
                }
            } catch (e) { console.warn(e); }
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', () => {
            window.location.href = '/profile.html';
        });

        // ---------- 未读小红点 ----------
        async function updateNotifDot() {
            if (!token) return;
            try {
                const res = await fetch(`${window.API_BASE}/notifications?page=1&limit=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const unreadCount = data.unreadCount || 0;
                const topBadge = document.getElementById('notifBadge');
                const sidebarDot = document.getElementById('sidebarNotifDot');
                if (topBadge) {
                    if (unreadCount > 0) {
                        topBadge.style.display = 'flex';
                        topBadge.innerText = unreadCount > 99 ? '99+' : unreadCount;
                    } else {
                        topBadge.style.display = 'none';
                    }
                }
                if (sidebarDot) {
                    sidebarDot.style.display = unreadCount > 0 ? 'inline-block' : 'none';
                }
            } catch (e) { }
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);

        // ---------- 退出登录 ----------
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        // ---------- 搜索 ----------
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        searchBtn?.addEventListener('click', () => {
            const keyword = searchInput.value.trim();
            if (keyword) window.location.href = `/search.html?q=${encodeURIComponent(keyword)}`;
            else alert('请输入搜索关键词');
        });
        searchInput?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        // ---------- 管理员功能 ----------
        let dauChart, postsChart, reportsChart;

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
        }

        async function loadStats() {
            try {
                const res = await fetch(`${window.API_BASE}/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 403) {
                    alert('无管理员权限，将跳转首页');
                    window.location.href = '/';
                    return;
                }
                const stats = await res.json();
                renderStats(stats);
            } catch (err) {
                console.error(err);
                document.getElementById('statsContainer').innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
            }
        }

        function renderStats(stats) {
            const container = document.getElementById('statsContainer');
            container.innerHTML = `
                <div class="stat-card"><div class="stat-number">${stats.totalUsers}</div><div class="stat-label">注册用户</div></div>
                <div class="stat-card"><div class="stat-number">${stats.newUsersToday}</div><div class="stat-label">今日新增用户</div></div>
                <div class="stat-card"><div class="stat-number">${stats.totalPosts}</div><div class="stat-label">总帖子数</div></div>
                <div class="stat-card"><div class="stat-number">${stats.newPostsToday}</div><div class="stat-label">今日新帖</div></div>
                <div class="stat-card"><div class="stat-number">${stats.totalReplies}</div><div class="stat-label">总回复数</div></div>
                <div class="stat-card"><div class="stat-number">${stats.totalLikes}</div><div class="stat-label">总点赞数</div></div>
                <div class="stat-card"><div class="stat-number">${stats.totalFavorites}</div><div class="stat-label">总收藏数</div></div>
            `;
        }

        async function loadCharts() {
            try {
                const res = await fetch(`${window.API_BASE}/admin/daily-stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('获取图表数据失败');
                const data = await res.json();
                renderCharts(data);
            } catch (err) {
                console.error(err);
                document.querySelectorAll('.chart-card').forEach(card => card.style.opacity = '0.5');
            }
        }

        function renderCharts(data) {
            const dates = data.dates;
            const dauData = data.dau;
            const postsData = data.posts;
            const reportsData = data.reports;
            if (dauChart) dauChart.destroy();
            if (postsChart) postsChart.destroy();
            if (reportsChart) reportsChart.destroy();
            const ctxDau = document.getElementById('dauChart').getContext('2d');
            const ctxPosts = document.getElementById('postsChart').getContext('2d');
            const ctxReports = document.getElementById('reportsChart').getContext('2d');
            dauChart = new Chart(ctxDau, {
                type: 'line',
                data: { labels: dates, datasets: [{ label: '活跃用户数', data: dauData, borderColor: '#1E88E5', backgroundColor: 'rgba(30,136,229,0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
            postsChart = new Chart(ctxPosts, {
                type: 'line',
                data: { labels: dates, datasets: [{ label: '发帖数', data: postsData, borderColor: '#f5b042', backgroundColor: 'rgba(245,176,66,0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
            reportsChart = new Chart(ctxReports, {
                type: 'line',
                data: { labels: dates, datasets: [{ label: '举报数', data: reportsData, borderColor: '#e53e3e', backgroundColor: 'rgba(229,62,62,0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }

        async function loadReports() {
            const container = document.getElementById('reportsList');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const res = await fetch(`${window.API_BASE}/admin/reports`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const reports = data.reports || [];
                if (!reports.length) {
                    container.innerHTML = '<div class="loading">暂无举报记录</div>';
                    return;
                }
                container.innerHTML = reports.map(r => `
                    <div class="list-item" data-id="${r.id}">
                        <div class="item-meta">
                            <span>举报人：${escapeHtml(r.reporter_nickname)}</span>
                            <span>目标：${r.target_type} ID:${r.target_id}</span>
                            <span>类型：${r.reason_type}</span>
                            <span>状态：<span class="badge badge-${r.status}">${getStatusText(r.status)}</span></span>
                        </div>
                        <div class="item-content">说明：${escapeHtml(r.reason || '无')}</div>
                        <div class="item-meta">提交时间：${new Date(r.created_at).toLocaleString()}</div>
                        ${r.status === 'pending' ? `
                            <div class="item-actions">
                                <button class="btn-sm primary resolve-btn" data-id="${r.id}" data-action="resolve">通过（删除内容）</button>
                                <button class="btn-sm danger reject-btn" data-id="${r.id}" data-action="reject">驳回</button>
                            </div>
                        ` : `<div class="item-actions"><span class="badge">已处理</span></div>`}
                    </div>
                `).join('');
                document.querySelectorAll('.resolve-btn').forEach(btn => {
                    btn.addEventListener('click', () => handleReport(parseInt(btn.dataset.id), 'resolve'));
                });
                document.querySelectorAll('.reject-btn').forEach(btn => {
                    btn.addEventListener('click', () => handleReport(parseInt(btn.dataset.id), 'reject'));
                });
            } catch (err) {
                container.innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
            }
        }

        async function handleReport(reportId, action) {
            if (!confirm(`确定要${action === 'resolve' ? '通过（删除违规内容）' : '驳回'}此举报吗？`)) return;
            try {
                const res = await fetch(`${window.API_BASE}/admin/reports/${reportId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ action })
                });
                if (res.ok) {
                    alert('处理成功');
                    loadReports();
                    loadCharts();
                } else {
                    const err = await res.json();
                    alert(err.error || '处理失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        async function loadFeedbacks() {
            const container = document.getElementById('feedbacksList');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const res = await fetch(`${window.API_BASE}/admin/feedbacks`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const feedbacks = data.feedbacks || [];
                if (!feedbacks.length) {
                    container.innerHTML = '<div class="loading">暂无反馈记录</div>';
                    return;
                }
                container.innerHTML = feedbacks.map(f => `
                    <div class="list-item" data-id="${f.id}">
                        <div class="item-meta">
                            <span>用户：${escapeHtml(f.user_nickname)}</span>
                            <span>状态：<span class="badge badge-${f.status}">${getFeedbackStatusText(f.status)}</span></span>
                        </div>
                        <div class="item-content">${escapeHtml(f.content)}</div>
                        <div class="item-meta">提交时间：${new Date(f.created_at).toLocaleString()}</div>
                        ${f.status === 'pending' ? `
                            <div class="reply-form">
                                <input type="text" id="replyInput_${f.id}" placeholder="输入回复内容...">
                                <button class="btn-sm primary reply-submit" data-id="${f.id}">回复并标记已读</button>
                            </div>
                        ` : f.reply ? `<div class="item-content">管理员回复：${escapeHtml(f.reply)}</div>` : ''}
                    </div>
                `).join('');
                document.querySelectorAll('.reply-submit').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const feedbackId = parseInt(btn.dataset.id);
                        const replyInput = document.getElementById(`replyInput_${feedbackId}`);
                        const reply = replyInput.value.trim();
                        if (!reply) { alert('请输入回复内容'); return; }
                        try {
                            const res = await fetch(`${window.API_BASE}/admin/feedbacks/${feedbackId}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                                body: JSON.stringify({ reply, action: 'resolve' })
                            });
                            if (res.ok) {
                                alert('回复成功');
                                loadFeedbacks();
                            } else {
                                const err = await res.json();
                                alert(err.error || '处理失败');
                            }
                        } catch (err) { alert('网络错误'); }
                    });
                });
            } catch (err) {
                container.innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
            }
        }

        // ---------- 圈子申请受理 ----------
        async function loadCircleApplications() {
            const container = document.getElementById('circleApplicationsList');
            container.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const res = await fetch(`${window.API_BASE}/admin/circle-applications`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const applications = data.applications || [];
                if (!applications.length) {
                    container.innerHTML = '<div class="loading">暂无待审批的圈子申请</div>';
                    return;
                }
                container.innerHTML = applications.map(app => {
                    const participants = app.participants || [];
                    const participantsHtml = participants.map(p => `
                        <span class="participant-item">
                            ${p.avatar_url ? `<img src="${escapeHtml(p.avatar_url)}" class="participant-avatar">` : '<i class="fas fa-user-circle"></i>'}
                            <span class="participant-name">${escapeHtml(p.nickname)}</span>
                            ${p.id === app.initiator_id ? '<span class="initiator-badge">发起人</span>' : ''}
                        </span>
                    `).join('');
                    return `
                        <div class="list-item" data-id="${app.id}">
                            <div class="item-meta">
                                <span>圈子名称：<strong>${escapeHtml(app.name)}</strong></span>
                                <span>发起人：${escapeHtml(app.initiator_nickname)}</span>
                                <span>申请时间：${new Date(app.created_at).toLocaleString()}</span>
                            </div>
                            <div class="item-content">简介：${escapeHtml(app.description || '无')}</div>
                            <div class="participants-list">
                                参与者：${participantsHtml}
                            </div>
                            <div class="item-actions">
                                <button class="btn-sm primary approve-btn" data-id="${app.id}">通过</button>
                                <button class="btn-sm danger reject-btn" data-id="${app.id}">驳回</button>
                            </div>
                        </div>
                    `;
                }).join('');
                document.querySelectorAll('.approve-btn').forEach(btn => {
                    btn.addEventListener('click', () => handleCircleApplication(parseInt(btn.dataset.id), 'approve'));
                });
                document.querySelectorAll('.reject-btn').forEach(btn => {
                    btn.addEventListener('click', () => handleCircleApplication(parseInt(btn.dataset.id), 'reject'));
                });
            } catch (err) {
                container.innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
            }
        }

        async function handleCircleApplication(appId, action) {
            if (!confirm(`确定要${action === 'approve' ? '通过' : '驳回'}此圈子申请吗？`)) return;
            try {
                const res = await fetch(`${window.API_BASE}/admin/circle-applications/${appId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ action })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(action === 'approve' ? '圈子创建成功' : '已驳回申请');
                    loadCircleApplications();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'pending': return '待处理';
                case 'resolved': return '已处理';
                case 'rejected': return '已驳回';
                default: return status;
            }
        }
        function getFeedbackStatusText(status) {
            switch (status) {
                case 'pending': return '待回复';
                case 'read': return '已读';
                case 'resolved': return '已解决';
                default: return status;
            }
        }

        // ---------- 公告管理 ----------
        let announcementQuill = null;
        function initAnnouncementEditor() {
            if (!announcementQuill) {
                announcementQuill = new Quill('#announcementEditor', {
                    theme: 'snow',
                    placeholder: '公告内容...',
                    modules: {
                        toolbar: {
                            container: [
                                ['bold', 'italic', 'underline'],
                                [{ 'header': 1 }, { 'header': 2 }],
                                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                                ['link', 'image', 'video', 'clean']
                            ],
                            handlers: {
                                'image': imageHandler,
                                'video': videoHandler
                            }
                        }
                    }
                });
            }
        }

        // ---------- 公告编辑器图片/视频上传 ----------
        function imageHandler() {
            var input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();
            input.onchange = function () {
                var file = input.files[0];
                if (!file) return;
                uploadAndInsert(file, 'image');
            };
        }

        function videoHandler() {
            var input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'video/*');
            input.click();
            input.onchange = function () {
                var file = input.files[0];
                if (!file) return;
                uploadAndInsert(file, 'video');
            };
        }

        async function uploadAndInsert(file, type) {
            var maxSize = type === 'video' ? 200 * 1024 * 1024 : 50 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('文件过大！' + (type === 'video' ? '视频不能超过 200MB' : '图片不能超过 50MB'));
                return;
            }
            var fd = new FormData();
            fd.append('file', file);
            showUploading();
            try {
                var res = await fetch(window.API_BASE + '/upload/file', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: fd
                });
                var data = await res.json();
                if (res.ok && data.url) {
                    var range = announcementQuill.getSelection(true);
                    if (type === 'image') {
                        announcementQuill.insertEmbed(range.index, 'image', data.url);
                    } else {
                        announcementQuill.insertEmbed(range.index, 'video', data.url);
                    }
                    announcementQuill.setSelection(range.index + 1);
                } else {
                    if (data.quiz_required) {
                        hideUploading();
                        if (confirm('⚠️ 请先通过第二级入站考试才能上传文件\n点击确定前往答题页面')) {
                            window.location.href = data.quiz_url || '/quiz.html?level=2';
                        }
                        return;
                    }
                    alert(data.error || '上传失败');
                }
            } catch (err) {
                alert('上传失败，请重试');
            } finally {
                hideUploading();
            }
        }

        // 将 UTC ISO 时间转为 datetime-local 格式（本地显示）
        function toLocalDatetimeInput(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return '';
            const pad = n => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

            const cover_url = window._activityCoverUrl || '';
            const rules = activityQuill.root.innerHTML.trim();
            const start_time = document.getElementById('activityStart').value;

            const reward_coins = parseInt(document.getElementById('activityRewardCoins').value) || 0;

            if (!title) { alert('请输入活动标题'); return; }
            if (!type) { alert('请选择活动类型'); return; }
            if (!start_time || !end_time) { alert('请选择开始和结束时间'); return; }

            let config = {};
            if (type === 'vote') {
                const filled = voteOptions.filter(o => o.title.trim());
                if (filled.length < 2) { alert('投票活动至少需要 2 个选项'); return; }

                config.enable_comment = document.getElementById('submitEnableComment').checked;

                config.period = document.getElementById('checkinPeriod').value;

                if (data.activities.length === 0) {
                    container.innerHTML = '<div class="loading">暂无活动</div>';
                    return;
                }

                container.innerHTML = data.activities.map(a => `
                    <div class="list-item">
                        <div class="item-meta">
                            <span><strong>${escapeHtml(a.title)}</strong></span>
                            <span>类型：${ACTIVITY_TYPE_NAMES[a.type] || a.type}</span>
                            <span>状态：${a.status === 'active' ? '进行中' : a.status === 'completed' ? '已完成' : '未开始'}</span>
                            <span>${a.participant_count} 人参与</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn-sm" onclick="editActivity(${a.id})">编辑</button>
                            <button class="btn-sm primary" onclick="location.href='/activity.html?id=${a.id}'">查看</button>
                            <button class="btn-sm" onclick="viewActivityLeaderboard(${a.id})">排行</button>
                            <button class="btn-sm primary" onclick="rewardActivity(${a.id})">发放奖励</button>
                            <button class="btn-sm danger" onclick="deleteActivity(${a.id})">删除</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="loading">加载失败</div>';
            }
        }

        // 删除活动
        async function deleteActivity(id) {
            if (!confirm('确定要删除这个活动吗？')) return;
            const res = await fetch(`${window.API_BASE}/activities/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) { loadActivities(); }
        }

        // 编辑活动（填充表单）
        async function editActivity(id) {
            const res = await fetch(`${window.API_BASE}/activities/${id}`);
            const data = await res.json();
            const a = data.activity;
            const config = a.config || {};

            document.getElementById('activityTitle').value = a.title;
            document.getElementById('activityType').value = a.type;
            // 封面回填
            window._activityCoverUrl = a.cover_url || '';
            if (a.cover_url) {
                document.getElementById('coverPreviewImg').src = getFullUrl(a.cover_url);
                document.getElementById('coverPreviewImg').style.display = 'block';
                document.getElementById('coverPlaceholder').style.display = 'none';
            }
            activityQuill.root.innerHTML = a.rules || '';
            document.getElementById('activityStart').value = toLocalDatetimeInput(a.start_time);
            document.getElementById('activityEnd').value = toLocalDatetimeInput(a.end_time);
            document.getElementById('activityRewardCoins').value = a.reward_coins || 0;
            document.getElementById('activityRewardBadge').value = a.reward_badge || '';

            // 重置所有类型配置
            voteOptions = []; pkFactions = []; signupFields = [];
            editingActivityConfig = config;
            document.getElementById('pendingFactionsSection').style.display = 'none';
            document.getElementById('pendingFactionsList').innerHTML = '';

            // 显示对应类型配置区域并回填
            showTypeConfig(a.type);
            switch (a.type) {
                case 'vote':
                    voteOptions = (config.options || []).map(o => ({ id: Date.now() + Math.random(), title: o.title || '', description: o.description || '', image_url: o.image_url || '' }));
                    renderVoteOptions();
                    break;
                case 'submit':
                    document.getElementById('submitEnableComment').checked = !!config.enable_comment;
                    document.getElementById('submitNeedReview').checked = !!config.need_review;
                    break;
                case 'checkin':
                    document.getElementById('checkinPeriod').value = config.period || 'daily';
                    document.getElementById('checkinDays').value = config.days || 7;
                    toggleCheckinDays();
                    break;
                case 'signup':
                    signupFields = (config.fields || []).map(f => ({ id: Date.now() + Math.random(), name: f.name || '', type: f.type || 'text', required: !!f.required }));
                    renderSignupFields();
                    document.getElementById('signupMaxCount').value = config.max_count || 100;
                    document.getElementById('signupDeadline').value = config.deadline ? String(config.deadline).substring(0, 16) : '';
                    break;
                case 'pk':
                    pkFactions = (config.factions || []).map(f => ({ id: Date.now() + Math.random(), name: f.name || '', logo_url: f.logo_url || '', description: f.description || '' }));
                    renderPkFactions();
                    loadPendingFactions(id);
                    break;
            }

            editingActivityId = id;
            document.getElementById('activityFormTitle').textContent = '编辑活动';
            document.getElementById('saveActivityBtn').textContent = '保存修改';
            document.getElementById('cancelActivityBtn').style.display = 'inline-block';
        }

        // 重置表单
        function resetActivityForm() {
            document.getElementById('activityTitle').value = '';
            document.getElementById('activityType').value = '';
            activityQuill.root.innerHTML = '';
            document.getElementById('activityStart').value = '';
            document.getElementById('activityEnd').value = '';
            document.getElementById('activityRewardCoins').value = '0';
            document.getElementById('activityRewardBadge').value = '';
            // 清空封面
            window._activityCoverUrl = '';
            document.getElementById('coverPreviewImg').style.display = 'none';
            document.getElementById('coverPreviewImg').src = '';
            document.getElementById('coverPlaceholder').style.display = 'flex';
            document.getElementById('coverPlaceholder').innerHTML = '<i class="fas fa-image"></i> 点击上传封面图';
            // 清空各类型配置
            voteOptions = []; renderVoteOptions();
            pkFactions = []; renderPkFactions();
            signupFields = []; renderSignupFields();
            document.getElementById('pendingFactionsSection').style.display = 'none';
            document.getElementById('pendingFactionsList').innerHTML = '';
            editingActivityConfig = null;
            document.getElementById('submitEnableComment').checked = false;
            document.getElementById('submitNeedReview').checked = false;
            document.getElementById('checkinPeriod').value = 'daily';
            document.getElementById('checkinDays').value = '7';
            document.getElementById('checkinDaysGroup').style.display = 'none';
            document.getElementById('signupMaxCount').value = '100';
            document.getElementById('signupDeadline').value = '';
            showTypeConfig('');
            editingActivityId = null;
            document.getElementById('activityFormTitle').textContent = '创建活动';
            document.getElementById('saveActivityBtn').textContent = '创建活动';
            document.getElementById('cancelActivityBtn').style.display = 'none';
        }

        // 发放奖励
        async function rewardActivity(id) {
            if (!confirm('确定向所有参与者发放奖励吗？此操作不可撤销。')) return;
            const res = await fetch(`${window.API_BASE}/activities/${id}/reward`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) { alert('奖励已发放'); loadActivities(); }
        }

        // 查看排行榜
        async function viewActivityLeaderboard(id) {
            try {
                const res = await fetch(`${window.API_BASE}/activities/${id}/leaderboard`);
                const data = await res.json();
                if (!data.leaderboard || data.leaderboard.length === 0) {
                    alert('暂无排行数据');
                    return;
                }
                const lines = data.leaderboard.slice(0, 10).map((u, i) =>
                    `${i + 1}. ${u.nickname || '用户' + u.id}（${u.score} 次参与）`
                );
                alert('活动排行榜 TOP10：\n\n' + lines.join('\n'));
            } catch (e) {
                alert('加载排行榜失败');
            }
        }

        // 侧边导航切换
        const tabBtns = document.querySelectorAll('.admin-nav-item');
        const tabs = {
            reports: document.getElementById('reportsTab'),
            feedbacks: document.getElementById('feedbacksTab'),
            'circle-applications': document.getElementById('circleApplicationsTab'),
            announcements: document.getElementById('announcementsTab'),
            activities: document.getElementById('activitiesTab')
        };
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.values(tabs).forEach(t => t.classList.remove('active'));
                tabs[tab].classList.add('active');
                // 切换到对应标签时自动加载数据
                if (tab === 'circle-applications') {
                    loadCircleApplications();
                } else if (tab === 'announcements') {
                    initAnnouncementEditor();
                    loadAnnouncements();
                } else if (tab === 'activities') {
                    initActivityEditor();
                    loadActivities();
                }
            });
        });

        // 初始加载
        loadStats();
        loadCharts();
        loadReports();
        loadFeedbacks();
        // 预加载圈子申请（如果默认标签页不是它，可以不加载，但这里预先准备）
    </script>
