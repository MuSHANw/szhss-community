<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css" media="screen and (max-width: 768px)">
    <script src="/js/device-detect.js"></script>
    <script src="/js/mobile.js" defer></script>
    <script src="/js/quiz-bank.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif; background-color: #F5F7FA; color: #1f2d3d; line-height: 1.5; padding-top: 60px; margin-left: 260px; transition: margin-left 0.3s ease; position: relative; min-height: 100vh; }
        body.sidebar-collapsed { margin-left: 70px; }
        .bg-decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .bg-decorations .wave { position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x; background-size: cover; opacity: 0.5; }
        .bg-decorations .circle { position: absolute; border-radius: 50%; background: rgba(30,136,229,0.05); }
        .bg-decorations .circle1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-decorations .circle2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
        .bg-decorations .circle3 { width: 150px; height: 150px; top: 30%; right: 10%; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .top-bar-container { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; border-bottom: 1px solid #e9ecef; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
        .top-bar { display: flex; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 20px; color: #4a5568; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1E88E5; text-decoration: none; margin-right: auto; }
        .search-area { display: flex; align-items: center; background: #f1f3f5; border-radius: 24px; padding: 4px 12px; width: 260px; }
        .search-area input { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; }
        .search-area button { background: transparent; border: none; cursor: pointer; color: #6c757d; }
        .about-link { margin-left: 16px; color: #4a5568; text-decoration: none; font-size: 0.95rem; transition: color 0.2s; }
        .about-link:hover { color: #1E88E5; }
        .notifications-icon { position: relative; margin-left: 16px; font-size: 1.4rem; color: #6c757d; text-decoration: none; display: inline-flex; align-items: center; }
        .notif-badge { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 260px; background: white; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 99; overflow-x: hidden; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-user-info, #sidebar.collapsed .sidebar-link span { display: none; }
        #sidebar.collapsed .sidebar-logout { font-size: 0; padding: 8px; }
        #sidebar.collapsed .sidebar-logout::before { content: "🚪"; font-size: 1.2rem; }
        .sidebar-user { display: flex; align-items: center; padding: 20px 16px; border-bottom: 1px solid #eef2f6; cursor: pointer; }
        .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 12px; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-avatar i { font-size: 48px; color: #1E88E5; }
        .sidebar-user-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .sidebar-nickname { font-weight: 600; font-size: 1rem; }
        .sidebar-email { font-size: 0.7rem; color: #6c757d; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 16px 0; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: #4a5568; transition: background 0.2s; white-space: nowrap; }
        .sidebar-link i { width: 28px; font-size: 1.2rem; text-align: center; }
        .sidebar-link span { margin-left: 12px; }
        .sidebar-link:hover { background: #f0f2f5; }
        .sidebar-link.active { background: #e9f0fe; color: #1E88E5; }
        .notif-dot { color: #e53e3e; font-size: 0.7rem; margin-left: 4px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #eef2f6; }
        .sidebar-logout { width: 100%; background: none; border: none; padding: 8px; cursor: pointer; color: #e53e3e; border-radius: 8px; text-align: center; }
        .sidebar-logout:hover { background: #ffe5e5; }

        .quiz-wrapper { max-width: 600px; margin: 32px auto; }
        .quiz-card { background: white; border-radius: 24px; padding: 36px 32px; border: 1px solid #eef2f6; box-shadow: 0 8px 24px rgba(0,0,0,0.04); min-height: 400px; }
        .fs { font-size: 0.85rem; color: #6c757d; text-align: center; margin-bottom: 16px; }
        .fs.danger { color: #e53e3e; }

        .intro-title { font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .intro-sub { text-align: center; color: #6c757d; font-size: 0.9rem; margin-bottom: 24px; }
        .intro-rules { background: #f8f9fa; border-radius: 16px; padding: 20px; margin-bottom: 24px; font-size: 0.9rem; line-height: 1.8; }
        .intro-rules li { margin-bottom: 6px; color: #4a5568; }

        .level-cards { display: flex; gap: 12px; margin-bottom: 24px; }
        .level-card { flex: 1; border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px; cursor: pointer; text-align: center; transition: all 0.2s; background: white; }
        .level-card:hover { border-color: #90caf9; }
        .level-card.active { border-color: #1E88E5; background: #f0f7ff; }
        .level-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .level-card .icon { font-size: 2rem; margin-bottom: 8px; }
        .level-card .name { font-weight: 600; font-size: 1rem; }
        .level-card .desc { font-size: 0.8rem; color: #6c757d; margin-top: 4px; }
        .level-card .status { font-size: 0.75rem; margin-top: 8px; padding: 2px 10px; border-radius: 10px; display: inline-block; }
        .level-card .status.passed { background: #d1fae5; color: #10B981; }
        .level-card .status.locked { background: #fee2e2; color: #e53e3e; }

        .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .type-card { border: 2px solid #e2e8f0; border-radius: 16px; padding: 18px; cursor: pointer; text-align: center; transition: all 0.2s; background: white; }
        .type-card:hover { border-color: #90caf9; }
        .type-card.active { border-color: #1E88E5; background: #f0f7ff; }
        .type-card .icon { font-size: 1.8rem; margin-bottom: 6px; }
        .type-card .name { font-weight: 600; font-size: 0.95rem; }
        .type-card .desc { font-size: 0.8rem; color: #6c757d; margin-top: 4px; }

        .start-btn { display: block; width: 100%; max-width: 240px; margin: 0 auto; background: #1E88E5; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .start-btn:hover { background: #1565C0; }
        .start-btn:disabled { background: #9CA3AF; cursor: not-allowed; }

        .progress-section { margin-bottom: 24px; }
        .progress-text { font-size: 0.85rem; color: #6c757d; margin-bottom: 8px; text-align: center; }
        .progress-bar { height: 6px; background: #eef2f6; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: #1E88E5; border-radius: 3px; transition: width 0.3s ease; }
        .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 24px; line-height: 1.6; min-height: 60px; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .option-btn { width: 100%; padding: 14px 18px; border: 2px solid #e2e8f0; border-radius: 14px; background: white; cursor: pointer; font-size: 0.95rem; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
        .option-btn:hover { border-color: #90caf9; background: #f8fbff; }
        .option-btn.selected { border-color: #1E88E5; background: #EFF6FF; }
        .option-letter { width: 28px; height: 28px; border-radius: 50%; background: #f0f2f5; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; flex-shrink: 0; }
        .option-btn.selected .option-letter { background: #1E88E5; color: white; }
        .nav-buttons { display: flex; gap: 12px; }
        .nav-btn { flex: 1; padding: 12px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .nav-btn.prev { background: #f0f2f5; color: #4a5568; }
        .nav-btn.prev:hover { background: #e2e6ea; }
        .nav-btn.next { background: #1E88E5; color: white; }
        .nav-btn.next:hover { background: #1565C0; }
        .nav-btn.submit { background: #10B981; color: white; }
        .nav-btn.submit:hover { background: #059669; }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-icon { font-size: 3.5rem; text-align: center; margin-bottom: 16px; }
        .result-score { font-size: 3rem; font-weight: 700; text-align: center; }
        .result-label { text-align: center; color: #9CA3AF; font-size: 1rem; margin-bottom: 8px; }
        .result-msg { text-align: center; font-size: 1rem; margin-bottom: 24px; padding: 12px; border-radius: 12px; }
        .result-msg.pass { background: #d1fae5; color: #065f46; }
        .result-msg.fail { background: #fee2e2; color: #991b1b; }
        .retry-btn { display: block; width: 100%; max-width: 200px; margin: 0 auto; background: #f0f2f5; color: #4a5568; border: none; padding: 12px; border-radius: 40px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .retry-btn:hover { background: #e2e6ea; }
        .loading { text-align: center; padding: 60px 20px; color: #6c757d; }

        @media (max-width: 768px) {
            body { margin-left: 0; }
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; width: 260px !important; }
            #sidebar.open-mobile { transform: translateX(0); }
            .search-area { width: 34px; }
            .quiz-wrapper { margin: 16px; }
            .quiz-card { padding: 24px 16px; }
            .level-cards { flex-direction: column; }
            .type-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

    <script>
        window.API_BASE = window.API_BASE || '/api';
        var token = localStorage.getItem('token');
        if (!token) { window.location.href = '/login.html'; }

        // 通用侧边栏
        var sidebar = document.getElementById('sidebar'), toggleBtn = document.getElementById('menuToggle'), body = document.getElementById('appBody');
        if (localStorage.getItem('sidebarExpanded') !== 'false') { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); }
        else { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); }
        toggleBtn.addEventListener('click', function() {
            var e = !sidebar.classList.contains('collapsed');
            if (e) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','false'); }
            else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','true'); }
        });
        async function updateSidebarUser() {
            try { var res = await fetch(window.API_BASE+'/me', { headers: { 'Authorization': 'Bearer '+token } }); if (res.ok) { var u = await res.json(); document.getElementById('sidebarNickname').innerText = u.nickname||'用户'; document.getElementById('sidebarEmail').innerText = u.email||''; document.getElementById('sidebarAvatar').innerHTML = u.avatar_url?'<img src="'+u.avatar_url+'" alt="头像">':'<i class="fas fa-user-circle"></i>'; } } catch(e) {}
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', function() { window.location.href='/profile.html'; });
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', function() { localStorage.removeItem('token'); window.location.href='/login.html'; });
        document.getElementById('searchBtn')?.addEventListener('click', function() { var q = document.getElementById('searchInput').value.trim(); if(q) window.location.href='/search.html?q='+encodeURIComponent(q); else alert('请输入搜索关键词'); });
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) { if(e.key==='Enter') document.getElementById('searchBtn').click(); });

        // ---------- 考试逻辑 ----------
        var currentLevel = null;
        var currentType = null;
        var questions = [];
        var currentIndex = 0;
        var answers = {};
        var isSubmitting = false;
        var statusData = null;

        function showSection(id) {
            var sections = ['pageSelect', 'pageTypeSelect', 'quizQuestions', 'quizResult'];
            sections.forEach(function(s) {
                document.getElementById(s).style.display = s === id ? 'block' : 'none';
            });
            document.getElementById('quizLoading').style.display = 'none';
        }

        // 加载考试状态
        async function loadStatus() {
            try {
                var res = await fetch(window.API_BASE + '/quiz/status?level=1', { headers: { 'Authorization': 'Bearer '+token } });
                if (res.status === 401) { localStorage.removeItem('token'); window.location.href='/login.html'; return; }
                statusData = await res.json();
                renderLevelSelect();
            } catch(e) {
                document.getElementById('quizLoading').innerHTML = '<div style="color:#e53e3e;">加载失败，请刷新重试</div>';
            }
        }

        function renderLevelSelect() {
            var container = document.getElementById('levelCards');
            var levels = [
                { level: 1, icon: '📝', name: '第一级 · 基础考试', desc: '通过后可发帖、评论、点赞等', passKey: 'level1_passed', passing: '60分及格' },
                { level: 2, icon: '🎯', name: '第二级 · 进阶考试', desc: '通过后可上传图片和视频', passKey: 'level2_passed', passing: '70分及格' }
            ];

            container.innerHTML = levels.map(function(l) {
                var passed = statusData[l.passKey];
                var disabled = (l.level === 2 && !statusData.level1_passed);
                var cls = 'level-card';
                if (passed) cls += ' disabled';
                if (disabled) cls += ' disabled';
                var statusHtml = '';
                if (passed) statusHtml = '<div class="status passed">✅ 已通过</div>';
                else if (disabled) statusHtml = '<div class="status locked">🔒 需先通过第一级</div>';

                return '<div class="' + cls + '" data-level="' + l.level + '" ' + (passed || disabled ? '' : 'onclick="selectLevel(' + l.level + ')"') + '>' +
                    '<div class="icon">' + l.icon + '</div>' +
                    '<div class="name">' + l.name + '</div>' +
                    '<div class="desc">' + l.desc + '</div>' +
                    '<div class="desc">' + l.passing + ' · 每日限3次</div>' +
                    statusHtml + '</div>';
            }).join('');

            // 更新剩余次数
            var remaining = statusData.remaining !== undefined ? statusData.remaining : 3;
            document.getElementById('remainingInfo').innerHTML = '今日剩余答题次数：<strong>' + remaining + '</strong> / ' + (statusData.max_attempts || 3);

            showSection('pageSelect');

            // 检查 URL 参数自动选择
            var urlLevel = new URLSearchParams(window.location.search).get('level');
            if (urlLevel === '2' && !statusData.level2_passed && statusData.level1_passed) {
                selectLevel(2);
            }
        }

        var selectedLevel = null;
        function selectLevel(level) {
            selectedLevel = level;
            document.querySelectorAll('.level-card').forEach(function(c) { c.classList.remove('active'); });
            document.querySelector('.level-card[data-level="' + level + '"]')?.classList.add('active');
            var btn = document.getElementById('startLevelBtn');
            btn.style.display = 'block';
            btn.disabled = false;
            btn.textContent = level === 1 ? '开始第一级考试 📝' : '选择考试类型 🔖';

            if (level === 2) {
                btn.onclick = function() { renderTypeSelect(); };
            } else {
                btn.onclick = function() { startQuiz(1); };
            }
        }

        function renderTypeSelect() {
            showSection('pageTypeSelect');
            var grid = document.getElementById('typeGrid');
            var types = QUIZ_BANK.level2;
            var html = '';
            for (var key in types) {
                var t = types[key];
                html += '<div class="type-card" data-type="' + key + '" onclick="selectType(\'' + key + '\')">' +
                    '<div class="icon">' + t.icon + '</div>' +
                    '<div class="name">' + t.name + '</div>' +
                    '<div class="desc">' + t.description + '</div>' +
                    '<div class="desc">' + t.questions.length + '道题</div></div>';
            }
            grid.innerHTML = html;
        }

        var selectedType = null;
        function selectType(type) {
            selectedType = type;
            document.querySelectorAll('.type-card').forEach(function(c) { c.classList.remove('active'); });
            document.querySelector('.type-card[data-type="' + type + '"]')?.classList.add('active');
            var btn = document.getElementById('startTypeBtn');
            btn.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '开始考试 🚀';
            btn.onclick = function() { startQuiz(2, type); };
        }

        // ---------- 开始答题 ----------
        function shuffleArray(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
            }
            return arr;
        }

        function startQuiz(level, type) {
            currentLevel = level;
            currentType = type || null;
            currentIndex = 0;
            answers = {};
            isSubmitting = false;

            var pool;
            if (level === 1) {
                pool = QUIZ_BANK.level1;
                questions = shuffleArray(pool).slice(0, 20);
            } else if (level === 2 && type) {
                pool = QUIZ_BANK.level2[type].questions;
                questions = shuffleArray(pool).slice(0, 10);
            }

            showSection('quizQuestions');
            renderQuestion();
        }

        function renderQuestion() {
            if (questions.length === 0) return;
            var q = questions[currentIndex];
            document.getElementById('questionText').innerHTML = '<span style="font-size:0.8rem;color:#9CA3AF;font-weight:400;">[' + (q.category || '') + ']</span> ' + q.question;
            document.getElementById('progressText').innerText = (currentIndex + 1) + ' / ' + questions.length;
            document.getElementById('progressFill').style.width = ((currentIndex + 1) / questions.length * 100) + '%';

            var letters = ['A', 'B', 'C', 'D'];
            var html = '';
            for (var i = 0; i < 4; i++) {
                var selected = answers[q.id] === i ? ' selected' : '';
                html += '<button class="option-btn' + selected + '" data-opt="' + i + '">' +
                    '<span class="option-letter">' + letters[i] + '</span>' +
                    q.options[i] + '</button>';
            }
            document.getElementById('optionsContainer').innerHTML = html;
            document.querySelectorAll('.option-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('selected'); });
                    btn.classList.add('selected');
                    answers[q.id] = parseInt(btn.dataset.opt);
                });
            });
            updateNavButtons();
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').style.visibility = (currentIndex === 0) ? 'hidden' : 'visible';
            var nextBtn = document.getElementById('nextBtn');
            if (currentIndex === questions.length - 1) {
                nextBtn.innerText = '交卷！';
                nextBtn.className = 'nav-btn submit';
            } else {
                nextBtn.innerText = '下一题';
                nextBtn.className = 'nav-btn next';
            }
        }

        function goToPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }

        function goToNext() {
            if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
            else if (currentIndex === questions.length - 1) { submitQuiz(); }
        }

        async function submitQuiz() {
            if (isSubmitting) return;
            for (var i = 0; i < questions.length; i++) {
                if (answers[questions[i].id] === undefined) {
                    alert('请回答第 ' + (i + 1) + ' 题');
                    currentIndex = i;
                    renderQuestion();
                    return;
                }
            }
            isSubmitting = true;
            var nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            nextBtn.innerText = '提交中...';

            try {
                var ansList = [];
                for (var i = 0; i < questions.length; i++) {
                    ansList.push({ question_id: questions[i].id, answer: answers[questions[i].id] });
                }
                var res = await fetch(window.API_BASE + '/quiz/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ level: currentLevel, type: currentType, answers: ansList })
                });
                var data = await res.json();

                showSection('quizResult');
                var maxScore = currentLevel === 1 ? 100 : 100;
                document.getElementById('resultLabel').innerText = '/ ' + maxScore + ' 分';

                if (data.passed) {
                    document.getElementById('resultIcon').innerHTML = '✅';
                    document.getElementById('resultScore').innerHTML = data.score;
                    document.getElementById('resultScore').style.color = '#10B981';
                    document.getElementById('resultMsg').className = 'result-msg pass';
                    document.getElementById('resultMsg').innerHTML = data.message || '🎉 恭喜通过！';
                    document.getElementById('retryBtn').style.display = 'none';
                    setTimeout(function() { window.location.href = '/'; }, 3000);
                } else {
                    document.getElementById('resultIcon').innerHTML = '❌';
                    document.getElementById('resultScore').innerHTML = data.score;
                    document.getElementById('resultScore').style.color = '#e53e3e';
                    document.getElementById('resultMsg').className = 'result-msg fail';
                    document.getElementById('resultMsg').innerHTML = data.message || '未通过，继续加油！';
                    document.getElementById('retryBtn').style.display = 'block';
                    document.getElementById('retryBtn').onclick = function() { window.location.href = '/quiz.html'; };
                }
            } catch (err) {
                console.error(err);
                alert('提交失败，请重试');
                isSubmitting = false;
                nextBtn.disabled = false;
                nextBtn.innerText = '交卷！';
            }
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            var quizSection = document.getElementById('quizQuestions');
            if (quizSection.style.display !== 'block') return;
            if (['A', 'B', 'C', 'D'].indexOf(e.key.toUpperCase()) !== -1) {
                var btns = document.querySelectorAll('.option-btn');
                var idx = ['A', 'B', 'C', 'D'].indexOf(e.key.toUpperCase());
                if (btns[idx]) btns[idx].click();
            }
            if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); goToNext(); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); goToPrev(); }
        });

        document.getElementById('startQuizBtn')?.addEventListener('click', function() { startQuiz(1); });
        document.getElementById('prevBtn').addEventListener('click', goToPrev);
        document.getElementById('nextBtn').addEventListener('click', goToNext);

        // 开始加载
        loadStatus();
    </script>

    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // iOS：已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
