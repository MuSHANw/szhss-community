        // ---------- 渲染更新日志 ----------
        function initChangelog() {
            const tocEl = document.getElementById('changelogToc');
            const contentEl = document.getElementById('changelogContent');
            if (!tocEl || !contentEl) return;

            const blocks = DEV_LOG_CONTENT.trim().split(/^## /m).filter(Boolean);
            if (!blocks.length) {
                contentEl.innerHTML = '<div class="changelog-empty">暂无更新记录</div>';
                return;
            }

            const sectionIds = [];
            const tocItems = [];

            blocks.forEach(block => {
                const title = block.split('\n')[0].trim();
                const id = 'date-' + title.replace(/[^\w一-龥]/g, '-');
                sectionIds.push({ id, title });

                // 目录项
                const a = document.createElement('a');
                a.href = '#' + id;
                a.className = 'changelog-toc-item';
                a.textContent = title;
                a.dataset.id = id;
                tocEl.appendChild(a);
                tocItems.push(a);

                // 内容区块
                const div = document.createElement('div');
                div.className = 'changelog-date-block';
                div.id = id;
                div.innerHTML = marked.parse('## ' + block);
                contentEl.appendChild(div);
            });

            // 点击目录项平滑滚动
            tocItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.getElementById(item.dataset.id);
                    if (target) {
                        contentEl.scrollTo({ top: target.offsetTop - 24, behavior: 'smooth' });
                    }
                });
            });

            // 滚动监听高亮
            function updateActive() {
                const scrollTop = contentEl.scrollTop;
                let currentId = sectionIds[0].id;
                sectionIds.forEach(item => {
                    const el = document.getElementById(item.id);
                    if (el && el.offsetTop - 80 <= scrollTop) currentId = item.id;
                });
                tocItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.id === currentId);
                });
            }

            contentEl.addEventListener('scroll', updateActive, { passive: true });

            // URL hash 支持（如 changelog.html#date-2026-07-25）
            const hash = window.location.hash;
            if (hash) {
                const target = document.getElementById(hash.slice(1));
                if (target) {
                    setTimeout(() => {
                        contentEl.scrollTop = target.offsetTop - 24;
                    }, 100);
                }
            } else {
                updateActive();
            }
        }

        initChangelog();

        // ---------- 侧边栏展开/收起 ----------
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('menuToggle');
        const body = document.getElementById('appBody');
        const isExpanded = localStorage.getItem('sidebarExpanded') !== 'false';
        if (!isExpanded) {
            sidebar.classList.add('collapsed');
            body.classList.add('sidebar-collapsed');
        } else {
            sidebar.classList.remove('collapsed');
            body.classList.remove('sidebar-collapsed');
        }
        toggleBtn.addEventListener('click', () => {
            const currentlyExpanded = !sidebar.classList.contains('collapsed');
            if (currentlyExpanded) {
                sidebar.classList.add('collapsed');
                body.classList.add('sidebar-collapsed');
                localStorage.setItem('sidebarExpanded', 'false');
            } else {
                sidebar.classList.remove('collapsed');
                body.classList.remove('sidebar-collapsed');
                localStorage.setItem('sidebarExpanded', 'true');
            }
        });

        // ---------- 用户信息 ----------
        const token = localStorage.getItem('token');
        const avatarDiv = document.getElementById('sidebarAvatar');
        const nicknameSpan = document.getElementById('sidebarNickname');
        const emailSpan = document.getElementById('sidebarEmail');
        async function updateSidebarUser() {
            if (!token) {
                nicknameSpan.innerText = '未登录';
                emailSpan.innerText = '';
                avatarDiv.innerHTML = '<i class="fas fa-user-circle"></i>';
                return;
            }
            try {
                const res = await fetch(`${window.API_BASE}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const user = await res.json();
                    nicknameSpan.innerText = user.nickname || '用户';
                    emailSpan.innerText = user.email || '';
                    if (user.avatar_url) {
                        avatarDiv.innerHTML = `<img src="${user.avatar_url}" alt="头像">`;
                    } else {
                        avatarDiv.innerHTML = '<i class="fas fa-user-circle"></i>';
                    }
                }
            } catch (e) { console.warn(e); }
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', () => {
            window.location.href = '/profile.html';
        });

        // ---------- 未读小红点 ----------
        async function updateNotifDot() {
            if (!token) return;
            try {
                const res = await fetch(`${window.API_BASE}/notifications?page=1&limit=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const unreadCount = data.unreadCount || 0;
                const topBadge = document.getElementById('notifBadge');
                const sidebarDot = document.getElementById('sidebarNotifDot');
                if (topBadge) {
                    if (unreadCount > 0) {
                        topBadge.style.display = 'flex';
                        topBadge.innerText = unreadCount > 99 ? '99+' : unreadCount;
                    } else {
                        topBadge.style.display = 'none';
                    }
                }
                if (sidebarDot) {
                    sidebarDot.style.display = unreadCount > 0 ? 'inline-block' : 'none';
                }
            } catch (e) { }
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);

        // ---------- 退出登录 ----------
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        // ---------- 搜索 ----------
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        searchBtn?.addEventListener('click', () => {
            const keyword = searchInput.value.trim();
            if (keyword) window.location.href = `/search.html?q=${encodeURIComponent(keyword)}`;
            else alert('请输入搜索关键词');
        });
        searchInput?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });
    </script>
    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeHarmonyBanner = function() {
                document.getElementById('harmonyBanner').style.display = 'none';
                localStorage.setItem('harmonyBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isHarmonyOS) {
                // 鸿蒙：每天首次弹窗引导添加到桌面
                const lastClosed = localStorage.getItem('harmonyBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('harmonyBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // 已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    // 根据浏览器环境设置不同文案
                    const ua = navigator.userAgent;
                    const isWeChat = /MicroMessenger/i.test(ua);
                    const isQQ = /QQ\//i.test(ua);
                    const isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua) && !isWeChat && !isQQ;

                    const textEl = document.getElementById('iosBannerText');
                    let bannerText = '';

                    if (isWeChat || isQQ) {
                        bannerText = '请点击右上角“...” → 选择“在浏览器中打开” → 在 Safari 中点击底部分享按钮 → “添加到主屏幕”';
                    } else if (isSafari) {
                        bannerText = '点击 Safari 底部的分享按钮（方框+向上箭头）→ 选择“添加到主屏幕”';
                    } else {
                        bannerText = '请在系统浏览器中打开此页面，然后通过浏览器菜单“添加到主屏幕”';
                    }

                    if (textEl) textEl.textContent = bannerText;

                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
