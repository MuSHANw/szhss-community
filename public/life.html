    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
            background-color: #F5F7FA; color: #1f2d3d; line-height: 1.5;
            padding-top: 60px; margin-left: 260px; transition: margin-left 0.3s ease;
            position: relative; min-height: 100vh;
        }
        body.sidebar-collapsed { margin-left: 70px; }
        .bg-decorations { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .bg-decorations .wave { position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231E88E5" fill-opacity="0.08" d="M0,192L48,197.3C96,203,192,213,288,208C384,203,480,181,576,186.7C672,192,768,224,864,229.3C960,235,1056,213,1152,192C1248,171,1344,149,1392,138.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') repeat-x; background-size: cover; opacity: 0.5; }
        .bg-decorations .circle { position: absolute; border-radius: 50%; background: rgba(30, 136, 229, 0.05); }
        .bg-decorations .circle1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .bg-decorations .circle2 { width: 200px; height: 200px; bottom: -50px; right: -50px; }
        .bg-decorations .circle3 { width: 150px; height: 150px; top: 30%; right: 10%; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .top-bar-container { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: white; border-bottom: 1px solid #e9ecef; z-index: 100; display: flex; align-items: center; padding: 0 20px; }
        .top-bar { display: flex; align-items: center; width: 100%; max-width: 1200px; margin: 0 auto; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; margin-right: 20px; color: #4a5568; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1E88E5; text-decoration: none; margin-right: auto; }
        .search-area { display: flex; align-items: center; background: #f1f3f5; border-radius: 24px; padding: 4px 12px; width: 260px; }
        .search-area input { border: none; background: transparent; outline: none; width: 100%; padding: 8px 0; }
        .search-area button { background: transparent; border: none; cursor: pointer; color: #6c757d; }
        .about-link { margin-left: 16px; color: #4a5568; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; white-space: nowrap; }
        .about-link:hover { color: #1E88E5; }
        .about-link i { margin-right: 4px; }
        .notifications-icon { position: relative; margin-left: 16px; font-size: 1.4rem; color: #6c757d; text-decoration: none; display: inline-flex; align-items: center; }
        .notif-badge { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        #sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 260px; background: white; border-right: 1px solid #eef2f6; display: flex; flex-direction: column; transition: width 0.3s ease; z-index: 99; overflow-x: hidden; }
        #sidebar.collapsed { width: 70px; }
        #sidebar.collapsed .sidebar-user-info, #sidebar.collapsed .sidebar-link span { display: none; }
        #sidebar.collapsed .sidebar-logout { font-size: 0; padding: 8px; }
        #sidebar.collapsed .sidebar-logout::before { content: "🚪"; font-size: 1.2rem; }
        .sidebar-user { display: flex; align-items: center; padding: 20px 16px; border-bottom: 1px solid #eef2f6; cursor: pointer; }
        .sidebar-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-right: 12px; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-avatar i { font-size: 48px; color: #1E88E5; }
        .sidebar-user-info { flex: 1; overflow: hidden; white-space: nowrap; }
        .sidebar-nickname { font-weight: 600; font-size: 1rem; }
        .sidebar-email { font-size: 0.7rem; color: #6c757d; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; padding: 16px 0; }
        .sidebar-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: #4a5568; transition: background 0.2s; white-space: nowrap; }
        .sidebar-link i { width: 28px; font-size: 1.2rem; text-align: center; }
        .sidebar-link span { margin-left: 12px; }
        .sidebar-link:hover { background: #f0f2f5; }
        .sidebar-link.active { background: #e9f0fe; color: #1E88E5; }
        .notif-dot { color: #e53e3e; font-size: 0.7rem; margin-left: 4px; }
        .sidebar-footer { padding: 16px; border-top: 1px solid #eef2f6; }
        .sidebar-logout { width: 100%; background: none; border: none; padding: 8px; cursor: pointer; color: #e53e3e; border-radius: 8px; text-align: center; }
        .sidebar-logout:hover { background: #ffe5e5; }

        .level-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        .level-dot { width: 6px; height: 6px; border-radius: 50%; }
        .level-progress { width: 100%; height: 6px; background: #eef2f6; border-radius: 3px; overflow: hidden; }
        .level-progress-bar { height: 100%; border-radius: 3px; transition: width 0.3s ease; }

        /* 页面特有样式 */
        .page-header { text-align: center; padding: 32px 0 16px; }
        .page-header h1 { font-size: 2rem; font-weight: 700; }
        .page-header p { color: #6c757d; margin-top: 6px; font-size: 0.95rem; }

        .daily-banner {
            background: linear-gradient(135deg, #e9f0fe, #d4e6f9);
            border-radius: 16px; padding: 16px 24px; text-align: center;
            margin-bottom: 20px; font-size: 1.05rem; color: #1E88E5; font-weight: 500;
        }

        .category-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .category-tab { background: #f0f2f5; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; color: #4a5568; }
        .category-tab:hover { background: #e2e6ea; }
        .category-tab.active { background: #1E88E5; color: white; }

        .sort-bar { display: flex; gap: 12px; margin-bottom: 24px; }
        .sort-btn { background: #f0f2f5; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .sort-btn.active { background: #1E88E5; color: white; }

        .post-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: box-shadow 0.2s; border: 1px solid #eef2f6; cursor: pointer; }
        .post-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.8rem; }
        .post-category { background: #e9f0fe; color: #1E88E5; padding: 2px 8px; border-radius: 12px; }
        .post-time { color: #8a9aa8; }
        .post-title { font-size: 1.2rem; margin-bottom: 10px; }
        .post-title a { text-decoration: none; color: #1f2d3d; font-weight: 600; }
        .post-title a:hover { color: #1E88E5; }
        .post-content { color: #4a5568; margin-bottom: 16px; line-height: 1.5; word-break: break-word; }
        .post-footer { display: flex; align-items: center; gap: 16px; font-size: 0.8rem; color: #6c757d; }
        .post-author { display: flex; align-items: center; gap: 6px; }
        .post-author img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
        .post-author i { font-size: 22px; color: #1E88E5; }

        .footer { background: white; border-top: 1px solid #e9ecef; padding: 20px 0; text-align: center; font-size: 0.75rem; color: #6c757d; margin-top: 40px; }
        .loading, .no-posts { text-align: center; padding: 40px; background: white; border-radius: 16px; color: #6c757d; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin: 32px 0; }
        .pagination button { background: #f0f2f5; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        .pagination button.active { background: #1E88E5; color: white; }

        @media (max-width: 768px) {
            body { margin-left: 0; }
            #sidebar { transform: translateX(-100%); transition: transform 0.3s ease; width: 260px !important; }
            #sidebar.open-mobile { transform: translateX(0); }
            .search-area { width: 180px; }
            .page-header h1 { font-size: 1.5rem; }
            .category-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
            .sort-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
    </style>
</head>

    <script>
        window.API_BASE = window.API_BASE || '/api';
        const token = localStorage.getItem('token');

        // ---------- 侧边栏 ----------
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('menuToggle');
        const body = document.getElementById('appBody');
        const isExpanded = localStorage.getItem('sidebarExpanded') !== 'false';
        if (!isExpanded) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); }
        else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); }
        toggleBtn.addEventListener('click', () => {
            const e = !sidebar.classList.contains('collapsed');
            if (e) { sidebar.classList.add('collapsed'); body.classList.add('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','false'); }
            else { sidebar.classList.remove('collapsed'); body.classList.remove('sidebar-collapsed'); localStorage.setItem('sidebarExpanded','true'); }
        });

        // ---------- 用户信息 ----------
        const avatarDiv = document.getElementById('sidebarAvatar');
        const nicknameSpan = document.getElementById('sidebarNickname');
        const emailSpan = document.getElementById('sidebarEmail');
        async function updateSidebarUser() {
            try {
                const res = await fetch(window.API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/login.html'; return; }
                if (res.ok) { const user = await res.json(); nicknameSpan.innerText = user.nickname || '用户'; emailSpan.innerText = user.email || ''; avatarDiv.innerHTML = user.avatar_url ? '<img src="' + user.avatar_url + '" alt="头像">' : '<i class="fas fa-user-circle"></i>'; }
            } catch(e) { console.warn(e); }
        }
        updateSidebarUser();
        document.getElementById('sidebarUserBtn')?.addEventListener('click', function() { window.location.href = '/profile.html'; });
        document.getElementById('sidebarLogoutBtn')?.addEventListener('click', function() { localStorage.removeItem('token'); window.location.href = '/login.html'; });

        // ---------- 通知小红点 ----------
        async function updateNotifDot() {
            if (!token) return;
            try {
                const res = await fetch(window.API_BASE + '/notifications?page=1&limit=1', { headers: { 'Authorization': 'Bearer ' + token } });
                const data = await res.json();
                const cnt = data.unreadCount || 0;
                const badge = document.getElementById('notifBadge');
                const dot = document.getElementById('sidebarNotifDot');
                if (badge) { badge.style.display = cnt > 0 ? 'flex' : 'none'; badge.innerText = cnt > 99 ? '99+' : cnt; }
                if (dot) dot.style.display = cnt > 0 ? 'inline-block' : 'none';
            } catch(e) {}
        }
        updateNotifDot();
        if (token) setInterval(updateNotifDot, 30000);

        // ---------- 搜索 ----------
        document.getElementById('searchBtn')?.addEventListener('click', function() { const q = document.getElementById('searchInput').value.trim(); if (q) window.location.href = '/search.html?q=' + encodeURIComponent(q); else alert('请输入搜索关键词'); });
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('searchBtn').click(); });

        // ---------- 每日一句 ----------
        const quotes = [
            '今天也是元气满满的一天！☀️', '记得吃早餐哦～🥐', '学习很苦，坚持很酷 💪',
            '你今天的努力，是未来的底气 🌟', '加油，深中人！🏆', '天道酬勤，厚积薄发 📚',
            '每一天都是新的开始 🌈', '自律即自由 ✨'
        ];
        (function() {
            const idx = new Date().getDate() % quotes.length;
            document.getElementById('dailyBanner').innerText = '✨ ' + quotes[idx];
        })();

        // ---------- 帖子逻辑 ----------
        let allPosts = [];
        let filteredPosts = [];
        let currentTag = '';
        let currentSort = 'recommended';
        let currentPage = 1;
        let totalPages = 1;

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m); }); }
        function formatDate(iso) { var d = new Date(iso); return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }

        async function loadPosts() {
            const container = document.getElementById('postsList');
            try {
                const res = await fetch(window.API_BASE + '/posts?category=生活&limit=50');
                const data = await res.json();
                allPosts = data.posts || [];
                applyFilters();
            } catch(err) { container.innerHTML = '<div class="error">加载失败</div>'; }
        }

        function applyFilters() {
            const container = document.getElementById('postsList');
            // 按标签筛选
            filteredPosts = currentTag ? allPosts.filter(function(p) {
                return p.tags && p.tags.some(function(t) { return t.toLowerCase().indexOf(currentTag.toLowerCase()) !== -1; });
            }) : allPosts.slice();
            // 按排序
            filteredPosts.sort(function(a, b) {
                if (currentSort === 'latest') return new Date(b.created_at) - new Date(a.created_at);
                if (currentSort === 'replied') {
                    var ta = a.last_reply_at || a.created_at;
                    var tb = b.last_reply_at || b.created_at;
                    return new Date(tb) - new Date(ta);
                }
                // recommended / hot
                var sa = (a.likes||0)*3 + (a.view_count||0)*1;
                var sb = (b.likes||0)*3 + (b.view_count||0)*1;
                return sb - sa;
            });
            totalPages = Math.ceil(filteredPosts.length / 10);
            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('postsList');
            var start = (currentPage - 1) * 10;
            var pagePosts = filteredPosts.slice(start, start + 10);
            if (pagePosts.length === 0) {
                container.innerHTML = '<div class="no-posts">暂无生活类帖子，快来分享你的校园日常吧~</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            container.innerHTML = pagePosts.map(function(post) {
                var avatarHtml = post.avatar_url ? '<img src="' + post.avatar_url + '" alt="头像">' : '<i class="fas fa-user-circle"></i>';
                var levelBadge = (typeof renderLevelBadge === 'function') ? renderLevelBadge(post.exp, post.has_passed_quiz) : '';
                return '<div class="post-card" data-id="' + post.id + '">' +
                    '<div class="post-header"><span class="post-category">' + escapeHtml(post.category||'综合') + '</span><span class="post-time">' + formatDate(post.created_at) + '</span></div>' +
                    '<h3 class="post-title"><a href="/post-detail.html?id=' + post.id + '">' + escapeHtml(post.title) + '</a></h3>' +
                    '<div class="post-content">' + escapeHtml((post.content||'').substring(0, 150)) + ((post.content||'').length > 150 ? '...' : '') + '</div>' +
                    '<div class="post-footer"><div class="post-author">' + avatarHtml + ' <a href="/user-profile.html?uid=' + post.user_id + '" style="color:inherit;text-decoration:none;">' + escapeHtml(post.nickname) + '</a>' + levelBadge + '</div>' +
                    '<span><i class="fas fa-eye"></i> ' + (post.view_count||0) + '</span>' +
                    '<span><i class="fas fa-comment"></i> ' + (post.reply_count||0) + '</span>' +
                    '<span><i class="fas fa-heart"></i> ' + (post.likes||0) + '</span></div></div>';
            }).join('');
            // 卡片点击跳转
            document.querySelectorAll('.post-card').forEach(function(c) {
                c.addEventListener('click', function() { window.location.href = '/post-detail.html?id=' + c.dataset.id; });
            });
            renderPagination();
        }

        function renderPagination() {
            var container = document.getElementById('pagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            var html = '';
            for (var i = 1; i <= totalPages; i++) { html += '<button class="' + (i === currentPage ? 'active' : '') + '" data-page="' + i + '">' + i + '</button>'; }
            container.innerHTML = html;
            container.querySelectorAll('button').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var p = parseInt(btn.dataset.page);
                    if (p && p !== currentPage) { currentPage = p; renderPosts(); window.scrollTo({top:0,behavior:'smooth'}); }
                });
            });
        }

        // 分类标签切换（前端过滤）
        document.querySelectorAll('#lifeCategoryTabs .category-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                var tag = tab.dataset.tag;
                if (tag === currentTag) return;
                currentTag = tag;
                currentPage = 1;
                document.querySelectorAll('#lifeCategoryTabs .category-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                applyFilters();
            });
        });

        // 排序切换
        document.querySelectorAll('.sort-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var sort = btn.dataset.sort;
                if (sort === currentSort) return;
                currentSort = sort;
                currentPage = 1;
                document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                // 重新请求获得完整数据再排序（用recommended后端排序）
                loadPosts();
            });
        });

        loadPosts();
    </script>
    <script>
        // 移动端设备引导横幅控制
        (function() {
            // 获取今天日期字符串 YYYY-MM-DD
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            // 关闭函数
            window.closeAndroidBanner = function() {
                document.getElementById('androidBanner').style.display = 'none';
                localStorage.setItem('androidBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            window.closeIOSBanner = function() {
                document.getElementById('iosBanner').style.display = 'none';
                localStorage.setItem('iosBannerClosedDate', getTodayStr());
                const topBar = document.querySelector('.top-bar-container');
                if (topBar) topBar.style.top = '0';
            };

            // 只在移动端显示
            if (!window.isMobile) return;

            // 检查是否已添加到桌面（PWA standalone模式）
            function isPWAStandalone() {
                return window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
            }

            const todayStr = getTodayStr();

            if (window.isAndroid) {
                // 安卓：每天首次访问时弹窗
                const lastClosed = localStorage.getItem('androidBannerClosedDate');
                if (lastClosed !== todayStr) {
                    document.getElementById('androidBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            } else if (window.isIOS) {
                // 已添加到桌面则不弹；未添加则每天首次弹
                if (isPWAStandalone()) return;

                const lastClosed = localStorage.getItem('iosBannerClosedDate');
                if (lastClosed !== todayStr) {
                    // 根据浏览器环境设置不同文案
                    const ua = navigator.userAgent;
                    const isWeChat = /MicroMessenger/i.test(ua);
                    const isQQ = /QQ\//i.test(ua);
                    const isSafari = /Safari/i.test(ua) && !/Chrome/i.test(ua) && !isWeChat && !isQQ;

                    const textEl = document.getElementById('iosBannerText');
                    let bannerText = '';

                    if (isWeChat || isQQ) {
                        bannerText = '请点击右上角“...” → 选择“在浏览器中打开” → 在 Safari 中点击底部分享按钮 → “添加到主屏幕”';
                    } else if (isSafari) {
                        bannerText = '点击 Safari 底部的分享按钮（方框+向上箭头）→ 选择“添加到主屏幕”';
                    } else {
                        bannerText = '请在系统浏览器中打开此页面，然后通过浏览器菜单“添加到主屏幕”';
                    }

                    if (textEl) textEl.textContent = bannerText;

                    document.getElementById('iosBanner').style.display = 'block';
                    const topBar = document.querySelector('.top-bar-container');
                    if (topBar) topBar.style.top = '40px';
                }
            }
        })();
    </script>
